<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>TURBO RACE ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{--c:#00f5d4;--p:#f72585;--y:#ffd60a;--b:#4cc9f0;--bg:#020308;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;position:fixed;inset:0;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:none;padding:7px 11px;pointer-events:none;}
#hudTop{display:flex;justify-content:space-between;align-items:flex-start;}
.hb{background:rgba(0,0,0,0.78);border:1px solid rgba(0,245,212,0.28);border-radius:8px;padding:4px 10px;backdrop-filter:blur(12px);}
.hl{font-size:7px;letter-spacing:3px;color:rgba(0,245,212,0.55);text-transform:uppercase;font-family:'Orbitron',sans-serif;}
.hv{font-size:20px;font-weight:900;color:#fff;line-height:1.1;font-family:'Orbitron',sans-serif;}

/* Gear indicator */
#gearEl{position:fixed;top:60px;right:18px;z-index:10;display:none;background:rgba(0,0,0,0.75);border:1px solid rgba(255,214,10,0.3);border-radius:8px;padding:4px 10px;pointer-events:none;font-family:'Orbitron',sans-serif;}

/* Nitro bar */
#nitroWrap{position:fixed;bottom:128px;left:50%;transform:translateX(-50%);z-index:10;display:none;flex-direction:column;align-items:center;gap:2px;pointer-events:none;}
#nitroTrack{width:155px;height:10px;background:rgba(255,255,255,0.07);border-radius:5px;border:1px solid rgba(255,214,10,0.28);overflow:hidden;}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#ffd60a,#ff8800,#f72585);border-radius:5px;transition:width .05s;}
.nlbl{font-size:7px;letter-spacing:3px;color:rgba(255,214,10,0.55);font-family:'Orbitron',sans-serif;}

/* Tilt bar */
#tiltWrap{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);z-index:10;display:none;pointer-events:none;flex-direction:column;align-items:center;gap:2px;}
#tiltTrack{width:120px;height:7px;background:rgba(255,255,255,0.06);border-radius:4px;border:1px solid rgba(0,245,212,0.18);position:relative;overflow:visible;}
#tiltDot{width:15px;height:15px;background:var(--c);border-radius:50%;position:absolute;top:50%;transform:translate(-50%,-50%);left:50%;box-shadow:0 0 12px var(--c);}

/* Joystick */
#jsArea{position:fixed;bottom:24px;left:18px;z-index:11;display:none;}
#jsOuter{width:112px;height:112px;border-radius:50%;background:rgba(0,0,0,0.58);border:2px solid rgba(0,245,212,0.28);position:relative;box-shadow:0 0 18px rgba(0,245,212,0.08);}
#jsKnob{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 33% 33%,rgba(0,245,212,0.92),rgba(0,110,100,0.85));position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px rgba(0,245,212,0.45);}
#jsLabel{font-size:7px;letter-spacing:2px;color:rgba(0,245,212,0.35);text-align:center;margin-top:4px;font-family:'Orbitron',sans-serif;}

/* Nitro button */
#nitroBtn{position:fixed;bottom:24px;right:16px;z-index:11;display:none;width:92px;height:92px;border-radius:50%;background:rgba(0,0,0,0.68);border:2.5px solid rgba(255,214,10,0.42);color:var(--y);flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:1px;backdrop-filter:blur(10px);box-shadow:0 0 16px rgba(255,214,10,0.12);font-family:'Orbitron',sans-serif;-webkit-tap-highlight-color:transparent;}
#nitroBtn.active{background:rgba(255,130,0,0.22);border-color:var(--y);box-shadow:0 0 55px rgba(255,214,10,0.85),0 0 110px rgba(255,70,0,0.35);}
#nitroBtn.cooldown{border-color:rgba(255,255,255,0.1);color:rgba(255,255,255,0.18);}

/* Drift button */
#driftBtn{position:fixed;bottom:130px;right:16px;z-index:11;display:none;width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,0.62);border:2px solid rgba(76,201,240,0.35);color:var(--b);flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:1px;backdrop-filter:blur(10px);font-family:'Orbitron',sans-serif;-webkit-tap-highlight-color:transparent;font-size:9px;letter-spacing:1px;}
#driftBtn.active{background:rgba(76,201,240,0.18);border-color:var(--b);box-shadow:0 0 28px rgba(76,201,240,0.6);}

/* Combo */
#comboEl{position:fixed;top:40%;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;font-family:'Orbitron',sans-serif;font-weight:900;text-align:center;opacity:0;transition:opacity .12s;}

/* Nitro speed overlay */
#speedOverlay{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .12s;background:radial-gradient(ellipse 80% 60% at 50% 110%,rgba(247,37,133,0.2) 0%,transparent 70%);}

/* Score popup */
.spop{position:fixed;pointer-events:none;z-index:14;font-family:'Orbitron',sans-serif;font-weight:700;animation:popUp .75s ease-out forwards;}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-65px) scale(0.85)}}

/* Distance marker */
#distEl{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10;display:none;pointer-events:none;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.3);}

/* SCREENS */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:rgba(2,3,8,0.97);}
.screen.hidden{display:none;}
.screen::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,245,212,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,212,0.025) 1px,transparent 1px);background-size:36px 36px;animation:gscr 4s linear infinite;pointer-events:none;}
@keyframes gscr{to{background-position:36px 36px}}
.gtitle{font-size:clamp(26px,7.5vw,50px);font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 40px var(--c),0 0 100px rgba(0,245,212,0.25);font-family:'Orbitron',sans-serif;position:relative;z-index:1;}
.gsub{font-size:8px;letter-spacing:5px;color:var(--y);font-family:'Orbitron',sans-serif;position:relative;z-index:1;}
.gbig{font-size:clamp(48px,13vw,84px);font-weight:900;color:var(--y);text-shadow:0 0 40px rgba(255,214,10,0.85);font-family:'Orbitron',sans-serif;position:relative;z-index:1;}
.glabel{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.25);font-family:'Orbitron',sans-serif;position:relative;z-index:1;}
.gbtn{position:relative;z-index:1;padding:13px 38px;font-size:12px;font-weight:700;letter-spacing:4px;color:#020308;background:var(--c);border:none;border-radius:8px;cursor:pointer;font-family:'Orbitron',sans-serif;box-shadow:0 0 28px rgba(0,245,212,0.55);transition:transform .1s;-webkit-tap-highlight-color:transparent;}
.gbtn:active{transform:scale(0.93);}
.gbtn.pink{background:var(--p);color:#fff;box-shadow:0 0 28px rgba(247,37,133,0.5);}
.gbtn.outline{background:transparent;color:rgba(255,255,255,0.32);border:1px solid rgba(255,255,255,0.12);box-shadow:none;font-size:10px;padding:9px 22px;}

/* Car select */
#carSelect{display:flex;gap:10px;position:relative;z-index:1;}
.cc{background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.1);border-radius:12px;padding:9px 12px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:68px;-webkit-tap-highlight-color:transparent;}
.cc.sel{border-color:var(--c);background:rgba(0,245,212,0.07);box-shadow:0 0 18px rgba(0,245,212,0.2);}
.ce{font-size:28px;}
.cn{font-size:6px;letter-spacing:2px;color:rgba(255,255,255,0.45);font-family:'Orbitron',sans-serif;}
.cstat{display:flex;gap:2px;margin-top:2px;}
.cbar{width:5px;height:10px;border-radius:2px;background:rgba(255,255,255,0.12);}
.cbar.on{background:var(--c);}

/* Stats chips */
.chips{display:flex;gap:8px;position:relative;z-index:1;flex-wrap:wrap;justify-content:center;}
.chip{background:rgba(0,245,212,0.06);border:1px solid rgba(0,245,212,0.18);border-radius:8px;padding:7px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.chipv{font-size:15px;font-weight:700;color:var(--y);font-family:'Orbitron',sans-serif;}
.chipl{font-size:6px;letter-spacing:2px;color:rgba(255,255,255,0.3);font-family:'Orbitron',sans-serif;}

/* Boss warning */
#bossWarn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;pointer-events:none;font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(24px,6vw,40px);color:var(--p);text-shadow:0 0 30px var(--p);letter-spacing:6px;opacity:0;text-align:center;}

/* Level flash */
#lvlFlash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;pointer-events:none;font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(20px,5vw,34px);color:var(--c);text-shadow:0 0 30px var(--c);letter-spacing:4px;opacity:0;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="speedOverlay"></div>
<div id="bossWarn"></div>
<div id="lvlFlash"></div>

<!-- HUD -->
<div id="hud">
  <div id="hudTop">
    <div class="hb"><div class="hl">Score</div><div class="hv" id="scoreEl">0</div></div>
    <div class="hb" style="text-align:center"><div class="hl" id="levelEl">Level 1</div><div class="hv small" id="livesEl" style="font-size:14px">❤️❤️❤️</div></div>
    <div class="hb"><div class="hl">Best</div><div class="hv" id="bestEl">0</div></div>
  </div>
  <div id="distEl">0 m</div>
</div>
<div id="gearEl"><div class="hl">Gear</div><div class="hv" id="gearNum" style="font-size:22px;color:var(--y)">1</div></div>

<!-- Nitro bar -->
<div id="nitroWrap">
  <div id="nitroTrack"><div id="nitroFill"></div></div>
  <div class="nlbl">⚡ NITRO</div>
</div>

<!-- Tilt bar -->
<div id="tiltWrap">
  <div id="tiltTrack"><div id="tiltDot"></div></div>
</div>

<!-- Joystick -->
<div id="jsArea">
  <div id="jsOuter"><div id="jsKnob"></div></div>
  <div id="jsLabel">STEER</div>
</div>

<!-- Drift Button -->
<div id="driftBtn">
  <span style="font-size:18px">🌀</span>
  <span>DRIFT</span>
</div>

<!-- Nitro Button -->
<div id="nitroBtn">
  <span style="font-size:26px">⚡</span>
  <span style="font-size:11px;letter-spacing:2px">NITRO</span>
</div>

<!-- Combo -->
<div id="comboEl"></div>

<!-- START SCREEN -->
<div class="screen" id="startScreen">
  <div style="font-size:52px;animation:bob 1s ease-in-out infinite;position:relative;z-index:1" id="startCarIcon">🏎️</div>
  <div class="gtitle">TURBO RACE</div>
  <div class="gsub">★ ULTRA EDITION ★</div>
  <div id="carSelect">
    <div class="cc sel" onclick="selectCar(0)">
      <div class="ce">🏎️</div><div class="cn">RACER</div>
      <div class="cstat"><div class="cbar on"></div><div class="cbar on"></div><div class="cbar on"></div><div class="cbar"></div><div class="cbar"></div></div>
    </div>
    <div class="cc" onclick="selectCar(1)">
      <div class="ce">🚗</div><div class="cn">MUSCLE</div>
      <div class="cstat"><div class="cbar on"></div><div class="cbar on"></div><div class="cbar on"></div><div class="cbar on"></div><div class="cbar"></div></div>
    </div>
    <div class="cc" onclick="selectCar(2)">
      <div class="ce">🚙</div><div class="cn">TANK</div>
      <div class="cstat"><div class="cbar on"></div><div class="cbar on"></div><div class="cbar on"></div><div class="cbar on"></div><div class="cbar on"></div></div>
    </div>
  </div>
  <div style="position:relative;z-index:1;background:rgba(0,0,0,0.4);border:1px solid rgba(0,245,212,0.15);border-radius:10px;padding:10px 16px;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.4);line-height:1.8;font-family:'Rajdhani',sans-serif;">
    🕹️ Left Joystick = Steer &nbsp;|&nbsp; 📱 Tilt Phone = Steer<br>
    🌀 DRIFT button = Power Drift &nbsp;|&nbsp; ⚡ NITRO = Boost<br>
    💥 Nitro pe gaadi hawa mein ud jaati hai!
  </div>
  <button class="gbtn" id="startBtn">▶ &nbsp;START RACE</button>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="overScreen">
  <div style="font-size:52px;position:relative;z-index:1">💥</div>
  <div class="gtitle" style="font-size:clamp(20px,5.5vw,34px);color:var(--p);text-shadow:0 0 30px rgba(247,37,133,0.9)">GAME OVER</div>
  <div class="glabel">Final Score</div>
  <div class="gbig" id="finalScore">0</div>
  <div class="glabel" id="bestLabel" style="font-size:10px;color:rgba(255,214,10,0.7);letter-spacing:2px;"></div>
  <div class="chips" id="statsChips"></div>
  <button class="gbtn" id="replayBtn">⟳ &nbsp;PLAY AGAIN</button>
  <button class="gbtn outline" id="menuBtn">← MENU</button>
</div>

<style>
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
</style>

<script>
// ═══════════════════════════
//  CANVAS
// ═══════════════════════════
const C=document.getElementById('c');
const ctx=C.getContext('2d');
let W,H,roadL,roadR,roadW,laneW;
function resize(){
  W=C.width=window.innerWidth; H=C.height=window.innerHeight;
  roadW=Math.min(W*0.8,410); roadL=(W-roadW)/2; roadR=roadL+roadW; laneW=roadW/3;
}
resize(); window.addEventListener('resize',resize);

// ═══════════════════════════
//  CARS CONFIG
// ═══════════════════════════
const CARS=[
  {name:'RACER', color1:'#00e8ff',color2:'#0070aa',color3:'#004f80',w:44,h:78,speed:1.0,nitroMult:3.5,driftMult:1.0},
  {name:'MUSCLE',color1:'#ff4040',color2:'#cc0000',color3:'#880000',w:48,h:82,speed:0.92,nitroMult:3.8,driftMult:1.1},
  {name:'TANK',  color1:'#50ff50',color2:'#008800',color3:'#005500',w:54,h:90,speed:0.82,nitroMult:4.2,driftMult:1.3},
];
let selectedCar=0;
function selectCar(i){
  selectedCar=i;
  document.querySelectorAll('.cc').forEach((el,j)=>el.classList.toggle('sel',j===i));
  document.getElementById('startCarIcon').textContent=['🏎️','🚗','🚙'][i];
}

// ═══════════════════════════
//  STATE
// ═══════════════════════════
let state='start';
let score=0,best=0,lives=3,dist=0;
let baseSpeed=3.5,frameCount=0;
let invincible=0,shakeF=0,shakeMag=0;
let combo=0,comboTimer=0,maxCombo=0;
let nitroKills=0,totalCoins=0,lvl=1;
let gear=1,gearTimer=0;
let bossMode=false,bossHP=0,bossMaxHP=0;
let lvlFlashTimer=0;

// Nitro
let nitroQ=1.0,nitroOn=false,nitroCool=false;
const N_DRAIN=0.0065,N_REFILL=0.0025,N_COOL=0.0045,N_MIN=0.12;

// Drift
let driftOn=false,driftTimer=0,driftDir=0;
const DRIFT_DUR=70;

// Shield / Slowmo
let shieldT=0,slowmoT=0;
const SHIELD_DUR=280,SLOWMO_DUR=200;

// Weather
let weather='clear';
let stars=[],rain=[];

// Tilt
let tiltX=0,tiltEnabled=false,tiltGranted=false;
function requestTilt(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{
        if(r==='granted'){tiltGranted=true;listenTilt();}
        startGame();
      }).catch(()=>startGame());
    } else { tiltGranted=true; listenTilt(); startGame(); }
  } catch(e){ startGame(); }
}
function listenTilt(){
  window.addEventListener('deviceorientation',e=>{
    if(!tiltEnabled||jsActive) return;
    let g=Math.max(-45,Math.min(45,e.gamma||0));
    tiltX=g/45;
    updTiltDot();
  },true);
}

// Joystick
let jsActive=false,jsTouchId=null,jsDX=0;
const jsOuter=document.getElementById('jsOuter');
const jsKnob=document.getElementById('jsKnob');
const jsArea=document.getElementById('jsArea');
function jCenter(){const r=jsOuter.getBoundingClientRect();return{cx:r.left+r.width/2,cy:r.top+r.height/2,rad:r.width/2};}
jsArea.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  jsTouchId=t.identifier; jsActive=true;
  moveJS(t.clientX,t.clientY);
},{passive:false});

// Global touch handling
document.addEventListener('touchmove',e=>{
  if(jsActive) e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===jsTouchId) moveJS(t.clientX,t.clientY);
  }
},{passive:false});
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===jsTouchId){
      jsActive=false; jsTouchId=null; jsDX=0; tiltX=0;
      jsKnob.style.transform='translate(-50%,-50%)';
      updTiltDot();
    }
  }
});
function moveJS(cx,cy){
  const j=jCenter();
  let dx=cx-j.cx,dy=cy-j.cy;
  const d=Math.sqrt(dx*dx+dy*dy),maxR=j.rad*0.58;
  if(d>maxR){dx=dx/d*maxR;dy=dy/d*maxR;}
  jsDX=dx/maxR;
  jsKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  tiltX=jsDX; updTiltDot();
}
function updTiltDot(){
  const d=document.getElementById('tiltDot');
  if(d) d.style.left=((tiltX*0.5+0.5)*100)+'%';
}

// Nitro button
const nitroBtn=document.getElementById('nitroBtn');
nitroBtn.addEventListener('touchstart',e=>{e.preventDefault();nitroPress();},{passive:false});
nitroBtn.addEventListener('touchend',e=>{e.preventDefault();nitroRel();},{passive:false});
nitroBtn.addEventListener('mousedown',nitroPress); nitroBtn.addEventListener('mouseup',nitroRel);
function nitroPress(){if(!nitroCool&&nitroQ>=N_MIN){nitroOn=true;}}
function nitroRel(){nitroOn=false;}

// Drift button
const driftBtn=document.getElementById('driftBtn');
driftBtn.addEventListener('touchstart',e=>{e.preventDefault();driftPress();},{passive:false});
driftBtn.addEventListener('touchend',e=>{e.preventDefault();driftRel();},{passive:false});
driftBtn.addEventListener('mousedown',driftPress); driftBtn.addEventListener('mouseup',driftRel);
function driftPress(){if(state==='play'){driftOn=true;driftDir=tiltX>=0?1:-1;driftTimer=DRIFT_DUR;driftBtn.classList.add('active');}}
function driftRel(){driftOn=false;driftBtn.classList.remove('active');}

// Keyboard
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if((e.key==='Enter'||e.key===' ')&&state==='start') document.getElementById('startBtn').click();
  if(e.key==='Enter'&&state==='over') document.getElementById('replayBtn').click();
  if(e.key===' '||e.key==='x') nitroPress();
  if(e.key==='z'||e.key==='Shift') driftPress();
});
document.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.key===' '||e.key==='x') nitroRel();
  if(e.key==='z'||e.key==='Shift') driftRel();
});

// Button wiring
document.getElementById('startBtn').addEventListener('click',requestTilt);
document.getElementById('startBtn').addEventListener('touchend',e=>{e.preventDefault();requestTilt();},{passive:false});
document.getElementById('replayBtn').addEventListener('click',startGame);
document.getElementById('replayBtn').addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
document.getElementById('menuBtn').addEventListener('click',showStart);
document.getElementById('menuBtn').addEventListener('touchend',e=>{e.preventDefault();showStart();},{passive:false});

// ═══════════════════════════
//  PLAYER
// ═══════════════════════════
const P={x:0,y:0,vx:0,tilt:0,wspin:0,trail:[]};

// ═══════════════════════════
//  OBSTACLES
// ═══════════════════════════
const OB_COLS=['#e63946','#f4a261','#8338ec','#3a86ff','#fb5607','#ff006e','#06d6a0','#e9c46a','#ff9f1c'];
const obstacles=[];
function spawnObs(){
  const lane=Math.floor(Math.random()*3);
  const x=roadL+lane*laneW+laneW/2;
  for(const o of obstacles) if(!o.crashed&&Math.abs(o.x-x)<laneW*0.72&&o.y<130) return;
  const isTruck=Math.random()>0.72;
  obstacles.push({
    x,y:-110,vx:0,vy:0,
    w:isTruck?52:44,h:isTruck?96:80,
    color:OB_COLS[~~(Math.random()*OB_COLS.length)],
    crashed:false,
    rotA:0,rotS:0,
    alpha:1,flyH:0,flyVZ:0,shadowSc:1,
    wspin:0,isTruck,
    isBoss:false
  });
}

// ═══════════════════════════
//  BOSS CAR
// ═══════════════════════════
function spawnBoss(){

const parts=[];
function boom(x,y,n,cols,big){
  const c=cols||['#f72585','#ffd60a','#00f5d4','#fff'];
  const cnt=big?n*2:n;
  for(let i=0;i<cnt;i++){
    const a=Math.PI*2*Math.random(),sp=big?(6+Math.random()*15):(3+Math.random()*9);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,decay:big?(0.01+Math.random()*0.016):(0.018+Math.random()*0.022),
      r:big?(4+Math.random()*13):(2+Math.random()*7),
      color:c[~~(Math.random()*c.length)],glow:big});
  }
}
function sparks(x,y,col){
  for(let i=0;i<18;i++) parts.push({x,y,vx:(Math.random()-0.5)*18,vy:-6-Math.random()*12,
    life:1,decay:0.05+Math.random()*0.04,r:2+Math.random()*4,color:col||'#ffd60a',glow:true});
}
function trailPart(x,y){
  parts.push({x:x+(Math.random()-0.5)*12,y:y+38,
    vx:(Math.random()-0.5)*3,vy:1+Math.random()*3,
    life:0.6+Math.random()*0.35,decay:0.038,
    r:3+Math.random()*6,
    color:nitroOn?'#f72585':(driftOn?'#4cc9f0':'rgba(80,120,255,0.5)'),glow:nitroOn});
}
function driftSmoke(x,y){
  parts.push({x:x+(Math.random()-0.5)*24,y:y+30+(Math.random()-0.5)*20,
    vx:driftDir*(2+Math.random()*5),vy:(Math.random()-0.5)*2,
    life:0.8+Math.random()*0.4,decay:0.022,
    r:10+Math.random()*18,color:'rgba(200,220,255,0.25)',glow:false,smoke:true});
}

// ═══════════════════════════
//  CRASH
// ═══════════════════════════
function crashObs(o,pvx,big){
  if(o.crashed) return;
  o.crashed=true;
  const dir=pvx>=0?1:-1;
  o.vx=dir*(6+Math.random()*8);
  o.vy=big?-(16+Math.random()*12):-(7+Math.random()*6);
  o.flyVZ=big?(22+Math.random()*18):(9+Math.random()*7);
  o.rotS=(Math.random()*0.24+0.14)*(Math.random()>0.5?1:-1);
  o.flyH=0; o.shadowSc=1;
  if(big){
    boom(o.x,o.y,35,['#f72585','#ffd60a','#00f5d4','#fff','#ff9900','#ff6b6b'],true);
    sparks(o.x,o.y,'#ffd60a'); sparks(o.x,o.y,'#f72585');
    boom(o.x,o.y-40,20,['#fff','#ffcc00'],false);
  } else {
    boom(o.x,o.y,22,['#f72585','#ffd60a','#00f5d4','#fff'],false);
    sparks(o.x,o.y);
  }
}

// ═══════════════════════════
//  POWERUP APPLY
// ═══════════════════════════
function applyPup(type,x,y){
  if(type==='shield'){shieldT=SHIELD_DUR;spop(x,y-30,'🛡️ SHIELD','#00f5d4',true);boom(x,y,14,['#00f5d4','#fff']);}
  else if(type==='nitroFull'){nitroQ=1;nitroCool=false;spop(x,y-30,'⚡ FULL NITRO','#ffd60a',true);boom(x,y,14,['#ffd60a','#f72585']);}
  else if(type==='extraLife'){if(lives<5)lives++;spop(x,y-30,'❤️ +1 LIFE','#f72585',true);boom(x,y,14,['#f72585','#fff']);}
  else if(type==='slowmo'){slowmoT=SLOWMO_DUR;spop(x,y-30,'⏱️ SLOW MO','#4cc9f0',true);boom(x,y,14,['#4cc9f0','#fff']);}
  else if(type==='coinMagnet'){coinMagnet=true;coinMagnetT=180;spop(x,y-30,'🧲 MAGNET','#ffd60a',true);boom(x,y,14,['#ffd60a','#fff']);}
}

// ═══════════════════════════
//  COLLISION
// ═══════════════════════════
const CAR=CARS[0];
function collides(a,b){
  return !b.crashed&&Math.abs(a.x-b.x)<(a.w+b.w)/2-10&&Math.abs(a.y-b.y)<(a.h+b.h)/2-12;
}

function startGame(){
  const car=CARS[selectedCar];
  score=0;lives=3;dist=0;baseSpeed=3.5;frameCount=0;
  nitroQ=1;nitroOn=false;nitroCool=false;
  invincible=0;shakeF=0;
  combo=0;comboTimer=0;maxCombo=0;
  nitroKills=0;totalCoins=0;lvl=1;gear=1;gearTimer=0;
  bossMode=false;shieldT=0;slowmoT=0;coinMagnet=false;
  obstacles.length=0;parts.length=0;coins.length=0;pups.length=0;
  tiltX=0;tiltEnabled=true;
  P.x=W/2;P.y=H*0.72;P.vx=0;P.tilt=0;P.trail=[];
  P.w=car.w; P.h=car.h;
  // Weather
  const ws=['clear','clear','night','rain'];
  weather=ws[~~(Math.random()*ws.length)];
  initScenery();initStars();initRain();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');

  document.getElementById('nitroWrap').style.display='flex';
  document.getElementById('tiltWrap').style.display='flex';
  document.getElementById('jsArea').style.display='block';
  document.getElementById('nitroBtn').style.display='flex';
  document.getElementById('driftBtn').style.display='flex';
  document.getElementById('gearEl').style.display='block';
  document.getElementById('distEl').style.display='block';
  state='play';
  updateHUD();
}

function showStart(){
  tiltEnabled=false;jsActive=false;
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  ['hud','nitroWrap','tiltWrap','jsArea','nitroBtn','driftBtn','gearEl','distEl'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display='none';
  });
  state='start';
}

function gameOver(){
  state='over';tiltEnabled=false;jsActive=false;
  if(score>best) best=score;
  document.getElementById('finalScore').textContent=Math.floor(score);
  document.getElementById('bestLabel').textContent=best>0?'🏆 Best: '+Math.floor(best):'';
  document.getElementById('statsChips').innerHTML=`
    <div class="chip"><div class="chipv">${nitroKills}</div><div class="chipl">Nitro Kills</div></div>
    <div class="chip"><div class="chipv">${totalCoins}</div><div class="chipl">Coins</div></div>
    <div class="chip"><div class="chipv">${lvl}</div><div class="chipl">Level</div></div>
    <div class="chip"><div class="chipv">${maxCombo}x</div><div class="chipl">Max Combo</div></div>
  `;
  document.getElementById('overScreen').classList.remove('hidden');
  ['hud','nitroWrap','tiltWrap','jsArea','nitroBtn','driftBtn','gearEl','distEl'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display='none';
  });
}

function updateHUD(){
  const car=CARS[selectedCar];
  document.getElementById('scoreEl').textContent=Math.floor(score);
  document.getElementById('bestEl').textContent=Math.floor(best);
  document.getElementById('levelEl').textContent='LVL '+lvl;
  document.getElementById('livesEl').textContent=(shieldT>0?'🛡️':'')+('❤️'.repeat(Math.min(lives,5)))||(lives<=0?'💔':'');
  document.getElementById('nitroFill').style.width=(nitroQ*100)+'%';
  document.getElementById('gearNum').textContent=gear;
  document.getElementById('distEl').textContent=Math.floor(dist)+' m';
  // Gear color
  const gc=['#00f5d4','#ffd60a','#ff9900','#f72585','#ff0000','#ff0000'];
  document.getElementById('gearNum').style.color=gc[Math.min(gear-1,5)];
  // Nitro btn
  if(nitroCool) nitroBtn.className='cooldown';
  else if(nitroOn) nitroBtn.className='active';
  else nitroBtn.className='';
  // Speed overlay
  document.getElementById('speedOverlay').style.opacity=nitroOn?'1':'0';
}

// ═══════════════════════════
//  DRAW ROAD
// ═══════════════════════════
function drawRoad(spd){
  // Sky
  const skyC=weather==='night'?['#02030f','#04061a']:weather==='rain'?['#0a0a16','#10101e']:['#090912','#0c0c1c'];
  const sg=ctx.createLinearGradient(0,0,0,H*0.38);
  sg.addColorStop(0,skyC[0]);sg.addColorStop(1,skyC[1]);
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  // Stars
  if(weather==='night'){
    for(const s of stars){
      s.tw+=0.035;
      const a=0.4+0.5*Math.sin(s.tw);
      ctx.fillStyle=`rgba(255,255,255,${a*0.75})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    // Moon
    ctx.fillStyle='rgba(255,245,200,0.9)';
    ctx.beginPath();ctx.arc(W*0.82,H*0.12,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,220,0.2)';
    ctx.beginPath();ctx.arc(W*0.82,H*0.12,30,0,Math.PI*2);ctx.fill();
  }
  // Grass
  const gc1=weather==='rain'?'#0b1a0d':'#0d1f0f';
  const gc2=weather==='rain'?'#101f12':'#162b18';
  const gL=ctx.createLinearGradient(0,0,roadL,0);
  gL.addColorStop(0,gc1);gL.addColorStop(1,gc2);
  ctx.fillStyle=gL;ctx.fillRect(0,0,roadL,H);
  const gR=ctx.createLinearGradient(roadR,0,W,0);
  gR.addColorStop(0,gc2);gR.addColorStop(1,gc1);
  ctx.fillStyle=gR;ctx.fillRect(roadR,0,W-roadR,H);
  // Road
  const rd=ctx.createLinearGradient(roadL,0,roadR,0);
  const rd1=weather==='rain'?'#181818':'#1a1a1a';
  const rd2=weather==='rain'?'#202020':'#252525';
  rd.addColorStop(0,rd1);rd.addColorStop(0.5,rd2);rd.addColorStop(1,rd1);
  ctx.fillStyle=rd;ctx.fillRect(roadL,0,roadW,H);
  // Wet reflection
  if(weather==='rain'){
    const wr=ctx.createLinearGradient(roadL,H*0.35,roadL,H);
    wr.addColorStop(0,'transparent');wr.addColorStop(1,'rgba(80,120,200,0.08)');
    ctx.fillStyle=wr;ctx.fillRect(roadL,0,roadW,H);
  }
  // Night road glow from headlights
  if(weather==='night'){
    const nr=ctx.createRadialGradient(P.x,P.y-60,0,P.x,P.y-60,180);
    nr.addColorStop(0,'rgba(255,255,200,0.12)');nr.addColorStop(1,'transparent');
    ctx.fillStyle=nr;ctx.fillRect(roadL,0,roadW,H);
  }
  // Edge lines
  ctx.strokeStyle=weather==='night'?'rgba(210,210,210,0.8)':'#ccc';
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(roadL,0);ctx.lineTo(roadL,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(roadR,0);ctx.lineTo(roadR,H);ctx.stroke();
  // Lane dashes
  roadOff=(roadOff+(nitroOn?spd*2.2:spd))%80;
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;
  ctx.setLineDash([44,36]);ctx.lineDashOffset=-roadOff;
  for(let l=1;l<3;l++){const lx=roadL+l*laneW;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke();}
  ctx.setLineDash([]);ctx.lineDashOffset=0;
  // Rumble strips
  for(let y=0;y<H;y+=40){
    const ry=(y+roadOff*2)%H;
    ctx.fillStyle=(Math.floor(ry/20)%2===0)?'rgba(255,50,50,0.5)':'rgba(255,255,255,0.5)';
    ctx.fillRect(roadL,ry,6,20);ctx.fillRect(roadR-6,ry,6,20);
  }
}

// ═══════════════════════════
//  DRAW SCENERY
// ═══════════════════════════
function drawScenery(){
  for(const s of scenery){
    const sx=s.side==='L'?roadL-55:roadR+8,sz=s.size;
    if(s.type==='tree'){
      ctx.fillStyle=weather==='night'?'#2a1404':'#3d2208';
      ctx.fillRect(sx+10*sz,s.y-8*sz,8*sz,20*sz);
      ctx.fillStyle=weather==='night'?'#0d3018':'#1a5c35';
      ctx.beginPath();ctx.arc(sx+14*sz,s.y-24*sz,22*sz,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=weather==='night'?'#155028':'#27a85a';
      ctx.beginPath();ctx.arc(sx+14*sz,s.y-38*sz,14*sz,0,Math.PI*2);ctx.fill();
    } else if(s.type==='lamp'){
      ctx.fillStyle='#555';
      ctx.fillRect(sx+11*sz,s.y-52*sz,4*sz,56*sz);
      const lc=weather==='night'?'rgba(255,240,80,0.95)':'rgba(255,240,80,0.75)';
      ctx.fillStyle=lc;
      ctx.beginPath();ctx.arc(sx+13*sz,s.y-54*sz,8*sz,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=weather==='night'?'rgba(255,240,80,0.22)':'rgba(255,240,80,0.08)';
      ctx.beginPath();ctx.arc(sx+13*sz,s.y-54*sz,weather==='night'?32*sz:20*sz,0,Math.PI*2);ctx.fill();
    } else {
      const bh=45+s.hue*0.5,bw=26*sz;
      ctx.fillStyle=weather==='night'?'#0a0a16':'#10101e';
      ctx.fillRect(sx+2*sz,s.y-bh*sz,bw,bh*sz);
      for(let wy=0;wy<5;wy++) for(let wx=0;wx<2;wx++){
        const lit=Math.random()>0.35;
        ctx.fillStyle=lit?(weather==='night'?'rgba(255,240,140,0.9)':'rgba(180,210,255,0.45)'):'rgba(0,0,0,0.5)';
        ctx.fillRect(sx+(5+wx*10)*sz,s.y-(bh-8-wy*9)*sz,5*sz,5*sz);
      }
    }
  }
}

// ═══════════════════════════
//  DRAW RAIN
// ═══════════════════════════
function drawRain(spd){
  ctx.strokeStyle='rgba(170,195,255,0.28)';ctx.lineWidth=1.2;
  for(const r of rain){
    ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-r.len*0.22,r.y+r.len);ctx.stroke();
    r.y+=r.sp+spd*0.38;r.x-=r.sp*0.18;
    if(r.y>H){r.y=-20;r.x=Math.random()*W;}
    if(r.x<0) r.x=W;
  }
}

// ═══════════════════════════
//  DRAW PLAYER
// ═══════════════════════════
function drawPlayer(x,y,alpha,tilt,nitro,drift){
  const car=CARS[selectedCar];
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(x,y);
  ctx.rotate(tilt*0.1+driftOn*driftDir*0.18);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(driftOn?driftDir*8:0,44,22,7,0,0,Math.PI*2);ctx.fill();
  // Shield bubble
  if(shieldT>0){
    const sf=(shieldT/SHIELD_DUR);
    ctx.strokeStyle=`rgba(0,245,212,${0.4+sf*0.3})`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(0,0,54,62,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(0,245,212,${0.05+sf*0.08})`;
    ctx.beginPath();ctx.ellipse(0,0,54,62,0,0,Math.PI*2);ctx.fill();
  }
  // Body
  const bg=ctx.createLinearGradient(-car.w/2,-car.h/2,car.w/2,car.h/2);
  bg.addColorStop(0,car.color1);bg.addColorStop(0.45,car.color2);bg.addColorStop(1,car.color3);
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect(-car.w/2,-car.h/2,car.w,car.h,9);ctx.fill();
  // Center stripe
  ctx.fillStyle='rgba(255,255,255,0.09)';
  ctx.beginPath();ctx.roundRect(-5,-car.h/2,10,car.h,4);ctx.fill();
  // Cabin
  ctx.fillStyle='rgba(0,150,200,0.38)';
  ctx.beginPath();ctx.roundRect(-13,-car.h/2+12,26,32,6);ctx.fill();
  // Windshield
  ctx.fillStyle='rgba(255,255,255,0.38)';
  ctx.beginPath();ctx.roundRect(-10,-car.h/2+14,20,12,4);ctx.fill();
  // Headlights
  ctx.fillStyle='#fffde0';
  ctx.beginPath();ctx.ellipse(-car.w/2+8,-car.h/2+5,5,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(car.w/2-8,-car.h/2+5,5,3,0,0,Math.PI*2);ctx.fill();
  // HL glow
  ctx.fillStyle=weather==='night'?'rgba(255,255,200,0.5)':'rgba(255,255,200,0.28)';
  ctx.beginPath();ctx.ellipse(-car.w/2+8,-car.h/2+5,12,9,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(car.w/2-8,-car.h/2+5,12,9,0,0,Math.PI*2);ctx.fill();
  // Tail lights
  ctx.fillStyle=nitro?'#ff8800':'#f72585';
  ctx.beginPath();ctx.ellipse(-car.w/2+7,car.h/2-5,5,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(car.w/2-7,car.h/2-5,5,3,0,0,Math.PI*2);ctx.fill();
  // Wheels
  P.wspin+=nitro?0.55:drift?0.35:0.18;
  function wheel(wx,wy){
    ctx.save();ctx.translate(wx,wy);
    ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,0,7,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(0,0,3.5,5.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath();ctx.arc(0,0,3.8,P.wspin,P.wspin+Math.PI);ctx.fill();
    ctx.restore();
  }
  const wy1=-car.h/2+18,wy2=car.h/2-18,wx=car.w/2+2;
  wheel(-wx,wy1);wheel(wx,wy1);wheel(-wx,wy2);wheel(wx,wy2);
  // Nitro flames
  if(nitro){
    for(let f=0;f<3;f++){
      const fh=22+Math.random()*50,fw=7+f*5,ox=(f-1)*8;
      const fg=ctx.createLinearGradient(ox,car.h/2,ox,car.h/2+fh);
      fg.addColorStop(0,'rgba(255,255,255,0.95)');fg.addColorStop(0.18,'#ffd60a');
      fg.addColorStop(0.55,'#f72585');fg.addColorStop(1,'transparent');
      ctx.fillStyle=fg;
      ctx.beginPath();ctx.moveTo(ox-fw/2,car.h/2);
      ctx.quadraticCurveTo(ox-fw,car.h/2+fh*0.5,ox,car.h/2+fh);
      ctx.quadraticCurveTo(ox+fw,car.h/2+fh*0.5,ox+fw/2,car.h/2);ctx.fill();
    }
  }
  // Drift smoke trails
  if(drift){
    ctx.fillStyle='rgba(200,220,255,0.18)';
    ctx.beginPath();ctx.ellipse(-wx+driftDir*20,wy2,16,10,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(wx+driftDir*20,wy2,16,10,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ═══════════════════════════
//  DRAW OBSTACLE
// ═══════════════════════════
function drawObs(o){
  ctx.save();
  if(o.crashed){
    ctx.translate(o.x,o.y-o.flyH);
    ctx.rotate(o.rotA);
    ctx.globalAlpha=o.alpha;
    const sc=Math.max(0.25,1-o.flyH/700);
    ctx.scale(sc,sc);
  } else { ctx.translate(o.x,o.y); }
  // Shadow
  if(o.crashed){
    ctx.save();ctx.globalAlpha=0.22*o.alpha*(1-o.flyH/600);
    ctx.translate(0,o.flyH+42);ctx.scale(1,0.3);
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.ellipse(0,0,22*o.shadowSc,22*o.shadowSc,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.beginPath();ctx.ellipse(0,42,20,7,0,0,Math.PI*2);ctx.fill();
  }
  const c=o.color,bw=o.w,bh=o.h;
  const bg=ctx.createLinearGradient(-bw/2,-bh/2,bw/2,bh/2);
  bg.addColorStop(0,c);bg.addColorStop(1,shadeHex(c,-55));
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,o.isBoss?6:8);ctx.fill();
  if(o.isBoss){
    // Boss decal
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-bw/2+4,-bh/2+4,bw-8,bh-8,4);ctx.stroke();
    // Boss HP bar
    if(!o.crashed){
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-30,-bh/2-14,60,8);
      ctx.fillStyle='#f72585';ctx.fillRect(-30,-bh/2-14,60*(bossHP/bossMaxHP),8);
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(-30,-bh/2-14,60,8);
    }
  }
  // Cabin
  ctx.fillStyle='rgba(0,0,0,0.32)';
  ctx.beginPath();ctx.roundRect(-bw/2+8,-bh/2+10,bw-16,o.isTruck?22:28,4);ctx.fill();
  // Rear lights
  ctx.fillStyle='#ff2200';
  ctx.beginPath();ctx.ellipse(-bw/2+9,-bh/2+6,4,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw/2-9,-bh/2+6,4,3,0,0,Math.PI*2);ctx.fill();
  // Wheels
  o.wspin=(o.wspin||0)+0.1;
  function wh(wx,wy){
    ctx.save();ctx.translate(wx,wy);
    ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,0,o.isBoss?10:7,o.isBoss?14:10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(0,0,o.isBoss?5:3.5,o.isBoss?7:5.5,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  const wy1=-bh/2+20,wy2=bh/2-20,wx2=bw/2+2;
  wh(-wx2,wy1);wh(wx2,wy1);wh(-wx2,wy2);wh(wx2,wy2);
  if(o.isBoss||o.isTruck){wh(-wx2,0);wh(wx2,0);}
  ctx.restore();
}

// ═══════════════════════════
//  DRAW POWERUP
// ═══════════════════════════
function drawPup(p){
  p.pulse+=0.09;
  const ga=0.5+0.5*Math.sin(p.pulse);
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);
  const EM={'shield':'🛡️','nitroFull':'⚡','extraLife':'❤️','slowmo':'⏱️','coinMagnet':'🧲'};
  const CO={'shield':'#00f5d4','nitroFull':'#ffd60a','extraLife':'#f72585','slowmo':'#4cc9f0','coinMagnet':'#ffd60a'};
  const col=CO[p.type]||'#fff';
  ctx.fillStyle=hexAlpha(col,ga*0.22);
  ctx.beginPath();ctx.arc(0,0,p.r+10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.font=`${p.r+2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(EM[p.type],0,1);
  ctx.restore();
}

function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function shadeHex(hex,amt){
  let n=parseInt(hex.replace('#',''),16)||0;
  return `rgb(${cl(((n>>16)&0xff)+amt)},${cl(((n>>8)&0xff)+amt)},${cl((n&0xff)+amt)})`;
}
function cl(v){return Math.max(0,Math.min(255,v));}

// ═══════════════════════════
//  MAIN LOOP
// ═══════════════════════════
function loop(){
  requestAnimationFrame(loop);
  frameCount++;

  if(state==='play'){
    const car=CARS[selectedCar];
    // Level up
    const newLvl=1+Math.floor(score/700);
    if(newLvl>lvl){ lvl=newLvl; showLvl(lvl); }

    // Gear system
    gearTimer++;
    const gearThresholds=[0,400,1000,2000,3500,5000];
    for(let g=5;g>=1;g--){ if(score>=gearThresholds[g-1]){if(gear!==g){gear=g;}break;} }

    baseSpeed=(3.5+lvl*0.45+gear*0.2)*car.speed;
    baseSpeed=Math.min(baseSpeed,18);
    const slowF=slowmoT>0?0.42:1;
    const curSpd=(nitroOn?baseSpeed*car.nitroMult:(driftOn?baseSpeed*0.85:baseSpeed))*slowF;
    if(slowmoT>0) slowmoT--;
    if(shieldT>0) shieldT--;
    if(coinMagnetT>0) coinMagnetT--; else coinMagnet=false;

    // Nitro
    if(nitroOn){ nitroQ-=N_DRAIN; if(nitroQ<=0){nitroQ=0;nitroOn=false;nitroCool=true;} }
    else if(nitroCool){ nitroQ+=N_COOL; if(nitroQ>=1){nitroQ=1;nitroCool=false;} }
    else { nitroQ=Math.min(1,nitroQ+N_REFILL*0.5); }

    // Drift timer
    if(driftOn){ driftTimer--; if(driftTimer<=0){driftOn=false;driftBtn.classList.remove('active');} }

    // Steer
    let steer=tiltX;
    if(keys['ArrowLeft']||keys['a']) steer=-1;
    if(keys['ArrowRight']||keys['d']) steer=1;
    if(driftOn) steer=steer*0.4+driftDir*0.6*car.driftMult;

    const maxVx=nitroOn?12:driftOn?9:6.5;
    P.vx=steer*maxVx;
    P.x+=P.vx;
    P.x=Math.max(roadL+P.w/2,Math.min(roadR-P.w/2,P.x));
    P.tilt+=(steer-P.tilt)*0.15;

    // Particles
    if(frameCount%2===0&&(nitroOn||driftOn||Math.abs(steer)>0.3)) trailPart(P.x,P.y);
    if(driftOn&&frameCount%3===0) driftSmoke(P.x,P.y);

    dist+=curSpd*0.04;

    // Boss spawn (every 5 levels)
    if(!bossMode&&lvl>1&&lvl%3===0&&frameCount%4===0&&Math.random()>0.9998) spawnBoss();

    // Obstacle spawn
    const spawnRate=Math.max(15,70-lvl*3-Math.floor(score/300));
    if(frameCount%Math.max(15,spawnRate)===0) spawnObs();

    // Update obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      if(o.isBoss&&!o.crashed){
        // Boss movement
        o.moveTimer--;
        if(o.moveTimer<=0){ o.moveDir*=-1; o.moveTimer=40+Math.random()*40; }
        o.x+=o.moveDir*2.5;
        o.x=Math.max(roadL+o.w/2,Math.min(roadR-o.w/2,o.x));
      }
      if(o.crashed){
        o.x+=o.vx; o.y+=o.vy; o.vy+=0.28;
        o.flyVZ-=0.55; o.flyH=Math.max(0,o.flyH+o.flyVZ);
        o.rotA+=o.rotS; o.alpha-=0.0055; o.shadowSc=Math.max(0.05,1-o.flyH/500);
        if(o.alpha<=0||o.y>H+300){ if(o.isBoss) bossMode=false; obstacles.splice(i,1); }
        continue;
      }
      o.y+=curSpd;
      if(o.y>H+140){ obstacles.splice(i,1); score+=8; combo=0; continue; }
      // Collision
      if(invincible<=0&&collides(P,o)){
        if(nitroOn){
          crashObs(o,P.vx,true); score+=250; nitroKills++;
          if(o.isBoss){ bossHP-=3; if(bossHP<=0){crashObs(o,P.vx,true);bossMode=false;score+=500;spop(P.x,P.y-60,'💀 BOSS DOWN! +500','#f72585',true);} }
          combo++; if(combo>maxCombo) maxCombo=combo; comboTimer=130;
          if(combo>1) showCombo(combo);
          spop(o.x,o.y-45,`+250 NITRO${combo>1?' x'+combo:''}!`,'#f72585',true);
          shakeF=6;shakeMag=4;
        } else if(shieldT>0){
          crashObs(o,P.vx,false); score+=50;
          spop(o.x,o.y-30,'🛡️ BLOCKED!','#00f5d4',false);
          shakeF=8;shakeMag=5;
        } else {
          lives--; combo=0;
          crashObs(o,P.vx,false);
          invincible=110; shakeF=20;shakeMag=9;
          boom(P.x,P.y,20,['#f72585','#fff','#ffd60a'],false);
          if(lives<=0){ gameOver(); return; }
        }
      }
    }
    if(comboTimer>0) comboTimer--; else combo=0;

    // Coins
    if(frameCount%72===0) spawnCoin();
    for(let i=coins.length-1;i>=0;i--){
      const co=coins[i]; co.y+=curSpd*0.5; co.spin+=0.09;
      if(co.y>H+40){ coins.splice(i,1); continue; }
      // Magnet
      if(coinMagnet){ const dx=P.x-co.x,dy=P.y-co.y,d=Math.sqrt(dx*dx+dy*dy); if(d<200){ co.x+=dx/d*8; co.y+=dy/d*8; } }
      if(!co.collected&&Math.hypot(P.x-co.x,P.y-co.y)<30){
        co.collected=true; totalCoins++;
        const pts=20*(combo>1?combo:1);
        score+=pts;
        spop(co.x,co.y-20,combo>1?`+${pts}x${combo}`:`+20`,'#ffd60a',false);
        boom(co.x,co.y,6,['#ffd60a','#fff','#ffaa00'],false);
        coins.splice(i,1);
      }
    }
    // Powerups
    if(frameCount%200===0) spawnPup();
    for(let i=pups.length-1;i>=0;i--){
      const p=pups[i]; p.y+=curSpd*0.44; p.spin+=0.04;
      if(p.y>H+50){ pups.splice(i,1); continue; }
      if(!p.collected&&Math.hypot(P.x-p.x,P.y-p.y)<34){ p.collected=true; applyPup(p.type,p.x,p.y); pups.splice(i,1); }
    }
    // Scenery
    for(const s of scenery){ s.y+=curSpd*0.4; if(s.y>H+110) s.y=-110; }
    // Particles
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.smoke?-0.05:0.18; p.vx*=p.smoke?0.97:0.97;
      p.life-=p.decay; if(p.life<=0) parts.splice(i,1);
    }
    if(invincible>0) invincible--;
    score+=0.1*(nitroOn?2.8:driftOn?1.5:1);
    updateHUD();
  }

  // ══ RENDER ══
  ctx.save();
  if(shakeF>0){ ctx.translate((Math.random()-0.5)*shakeMag,(Math.random()-0.5)*shakeMag); shakeF--;if(shakeF<=0)shakeMag=0; }

  const spDraw=(nitroOn?baseSpeed*CARS[selectedCar].nitroMult:baseSpeed)*(slowmoT>0?0.42:1);
  drawRoad(spDraw);
  drawScenery();
  if(weather==='rain') drawRain(spDraw);

  // Coins
  for(const co of coins){
    if(co.collected) continue;
    ctx.save(); ctx.translate(co.x,co.y); ctx.rotate(co.spin);
    ctx.fillStyle='rgba(255,214,10,0.18)'; ctx.beginPath(); ctx.arc(0,0,co.r+8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd60a'; ctx.beginPath(); ctx.arc(0,0,co.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(-4,-4,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // Powerups
  for(const p of pups) if(!p.collected) drawPup(p);
  // Obstacles
  for(const o of obstacles) if(!o.crashed) drawObs(o);
  for(const o of obstacles) if(o.crashed) drawObs(o);
  // Player
  const palpha=invincible>0?(Math.floor(invincible/5)%2===0?0.18:1):1;
  drawPlayer(P.x,P.y,palpha,P.tilt,nitroOn,driftOn);
  // Particles
  for(const p of parts){
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
    if(p.smoke){ ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,p.r*p.life),0,Math.PI*2); ctx.fill(); ctx.restore(); continue; }
    if(p.glow){ ctx.shadowColor=p.color; ctx.shadowBlur=14; }
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.5,p.r*Math.max(0.1,p.life)),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // Nitro overlay
  if(state==='play'&&nitroOn){
    const ng=ctx.createRadialGradient(P.x,P.y,10,P.x,P.y,320);
    ng.addColorStop(0,'rgba(247,37,133,0.09)'); ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=2;
    for(let i=0;i<25;i++){
      const lx=roadL+Math.random()*roadW,ly=Math.random()*H,len=70+Math.random()*160;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+len); ctx.stroke();
    }
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.85);
    vg.addColorStop(0,'transparent'); vg.addColorStop(1,'rgba(247,37,133,0.14)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  // Slowmo tint
  if(slowmoT>0){ ctx.fillStyle='rgba(76,201,240,0.04)'; ctx.fillRect(0,0,W,H); }
  // Night vignette
  if(weather==='night'){
    const nv=ctx.createRadialGradient(W/2,H/2,H*0.18,W/2,H/2,H*0.88);
    nv.addColorStop(0,'transparent'); nv.addColorStop(1,'rgba(0,0,18,0.48)');
    ctx.fillStyle=nv; ctx.fillRect(0,0,W,H);
  }
  // Drift tint
  if(driftOn){
    ctx.fillStyle='rgba(76,201,240,0.03)'; ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

// Prevent scroll
document.addEventListener('touchstart',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
// Init
['hud','nitroWrap','tiltWrap','jsArea','nitroBtn','driftBtn','gearEl','distEl'].forEach(id=>{
  const el=document.getElementById(id); if(el) el.style.display='none';
});
loop();
</script>
