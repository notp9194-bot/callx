<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TURBO RACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --neon: #00f5d4;
      --neon2: #f72585;
      --neon3: #ffd60a;
      --dark: #03040a;
      --glass: rgba(0,245,212,0.07);
      --glass-border: rgba(0,245,212,0.18);
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Rajdhani', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Grid BG */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,245,212,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,212,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 8s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove { from{background-position:0 0} to{background-position:40px 40px} }

    .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; }
    .orb1 { width:320px;height:320px;background:rgba(0,245,212,0.12);top:-80px;left:-80px;animation:o1 7s ease-in-out infinite; }
    .orb2 { width:260px;height:260px;background:rgba(247,37,133,0.10);bottom:-60px;right:-60px;animation:o2 9s ease-in-out infinite; }
    @keyframes o1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,30px)}}
    @keyframes o2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-20px)}}

    /* ── LAUNCH SCREEN ── */
    #launchScreen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      text-align: center; padding: 24px;
    }
    .game-icon {
      width: 90px; height: 90px;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      animation: iconPulse 2.5s ease-in-out infinite;
      backdrop-filter: blur(8px);
    }
    @keyframes iconPulse {
      0%,100%{box-shadow:0 0 20px rgba(0,245,212,0.2),inset 0 0 20px rgba(0,245,212,0.05)}
      50%{box-shadow:0 0 50px rgba(0,245,212,0.5),inset 0 0 30px rgba(0,245,212,0.12)}
    }
    .game-icon svg { width:50px;height:50px; }

    .game-title {
      font-family:'Orbitron',monospace;
      font-size:clamp(28px,7vw,48px);
      font-weight:900; letter-spacing:6px; color:#fff;
      text-shadow:0 0 30px rgba(0,245,212,0.6),0 0 60px rgba(0,245,212,0.3);
    }
    .game-subtitle {
      font-size:clamp(11px,3vw,15px);font-weight:300;
      letter-spacing:4px;color:var(--neon);text-transform:uppercase;opacity:.8;
      margin-top:4px;
    }

    .stats-row { display:flex;gap:16px; }
    .stat-chip {
      display:flex;flex-direction:column;align-items:center;gap:2px;
      padding:10px 18px;
      background:var(--glass);border:1px solid var(--glass-border);
      border-radius:8px;backdrop-filter:blur(6px);
    }
    .stat-val { font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:var(--neon3); }
    .stat-lbl { font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.4);text-transform:uppercase; }

    .launch-btn {
      position:relative;padding:16px 52px;
      font-family:'Orbitron',monospace;font-size:14px;font-weight:700;letter-spacing:4px;
      color:var(--dark);background:var(--neon);border:none;border-radius:6px;
      cursor:pointer;overflow:hidden;
      box-shadow:0 0 30px rgba(0,245,212,0.4),0 0 60px rgba(0,245,212,0.2);
      transition:transform .15s,box-shadow .3s;
    }
    .launch-btn::before {
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
      transform:translateX(-100%);animation:shine 2.5s ease-in-out infinite;
    }
    @keyframes shine{0%{transform:translateX(-100%)}40%{transform:translateX(100%)}100%{transform:translateX(100%)}}
    .launch-btn:active{transform:scale(0.96);}

    .hint { font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.2);text-transform:uppercase; }

    /* ── LOADING SCREEN ── */
    #loadingScreen {
      position:fixed;inset:0;z-index:20;
      background:var(--dark);
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:24px;
    }
    #loadingScreen.show { display:flex; }

    .loader-ring {
      width:72px;height:72px;border-radius:50%;
      border:3px solid rgba(0,245,212,0.1);
      border-top-color:var(--neon);border-right-color:var(--neon2);
      animation:spin .9s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .bar-wrap { width:220px;height:4px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden; }
    .bar-fill {
      height:100%;width:0%;
      background:linear-gradient(90deg,var(--neon),var(--neon2));
      border-radius:4px;transition:width .4s ease;
    }

    .loader-msg {
      font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;
      color:rgba(0,245,212,0.7);text-transform:uppercase;
      animation:blink 1.2s ease-in-out infinite;
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── ERROR SCREEN ── */
    #errorScreen {
      position:fixed;inset:0;z-index:30;
      background:var(--dark);
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;
      padding:32px;text-align:center;
    }
    #errorScreen.show { display:flex; }

    .err-icon {
      width:70px;height:70px;border-radius:50%;
      background:rgba(247,37,133,0.1);border:2px solid rgba(247,37,133,0.35);
      display:flex;align-items:center;justify-content:center;font-size:30px;
      animation:errPulse 2s ease-in-out infinite;
    }
    @keyframes errPulse{0%,100%{box-shadow:0 0 0 0 rgba(247,37,133,.3)}50%{box-shadow:0 0 0 16px rgba(247,37,133,0)}}

    .err-title { font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--neon2);letter-spacing:3px; }
    .err-msg { font-size:14px;font-weight:300;color:rgba(255,255,255,.5);line-height:1.7;max-width:280px; }

    .err-btn {
      padding:13px 36px;font-family:'Orbitron',monospace;
      font-size:12px;font-weight:700;letter-spacing:3px;
      border-radius:6px;cursor:pointer;transition:all .2s;border:1.5px solid;
    }
    .btn-retry { color:var(--neon2);background:rgba(247,37,133,.1);border-color:rgba(247,37,133,.4); }
    .btn-retry:hover { background:rgba(247,37,133,.2); }
    .btn-back  { color:rgba(255,255,255,.3);background:transparent;border-color:rgba(255,255,255,.12); }
  </style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- ══ LAUNCH ══ -->
<div id="launchScreen">
  <div class="game-icon">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 36 L16 20 H48 L56 36 V46 H8 V36Z" fill="rgba(0,245,212,0.15)" stroke="#00f5d4" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 20 L26 10 H38 L44 20" stroke="#00f5d4" stroke-width="1.5" fill="rgba(0,245,212,0.08)" stroke-linejoin="round"/>
      <circle cx="18" cy="46" r="7" fill="#080c18" stroke="#ffd60a" stroke-width="2"/>
      <circle cx="18" cy="46" r="3" fill="#ffd60a"/>
      <circle cx="46" cy="46" r="7" fill="#080c18" stroke="#ffd60a" stroke-width="2"/>
      <circle cx="46" cy="46" r="3" fill="#ffd60a"/>
      <line x1="8" y1="36" x2="56" y2="36" stroke="rgba(0,245,212,0.3)" stroke-width="1" stroke-dasharray="4 3"/>
    </svg>
  </div>

  <div>
    <div class="game-title">TURBO RACE</div>
    <div class="game-subtitle">High Speed Racing Game</div>
  </div>

  <div class="stats-row">
    <div class="stat-chip"><span class="stat-val">3D</span><span class="stat-lbl">Graphics</span></div>
    <div class="stat-chip"><span class="stat-val">60<span style="font-size:10px">fps</span></span><span class="stat-lbl">Target</span></div>
    <div class="stat-chip"><span class="stat-val">∞</span><span class="stat-lbl">Tracks</span></div>
  </div>

  <button class="launch-btn" onclick="startGame()">▶ &nbsp;PLAY NOW</button>
  <div class="hint">Tap to start your engine</div>
</div>

<!-- ══ LOADING ══ -->
<div id="loadingScreen">
  <div class="loader-ring"></div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  <div class="loader-msg" id="loaderMsg">Loading Game...</div>
</div>

<!-- ══ ERROR ══ -->
<div id="errorScreen">
  <div class="err-icon">⚠</div>
  <div class="err-title">NO CONNECTION</div>
  <div class="err-msg" id="errMsg">No internet connection.<br/>Check your network and try again.</div>
  <button class="err-btn btn-retry" onclick="retryGame()">⟳ &nbsp;RETRY</button>
  <button class="err-btn btn-back"  onclick="backToMenu()">← Back to Menu</button>
</div>

<script>
  const GAME_URL = 'https://callx-server.onrender.com/car.html';

  const launchScreen  = document.getElementById('launchScreen');
  const loadingScreen = document.getElementById('loadingScreen');
  const errorScreen   = document.getElementById('errorScreen');
  const barFill       = document.getElementById('barFill');
  const loaderMsg     = document.getElementById('loaderMsg');

  const msgs = ['Loading Game...','Warming Up Engine...','Loading Assets...','Almost Ready...'];
  let msgIdx = 0, msgTimer, barTimer, pct = 0;

  function startGame() {
    if (!navigator.onLine) {
      showError('No internet connection.<br/>Check your Wi-Fi or mobile data and try again.');
      return;
    }
    showLoading();
    // After 2.5s fake progress → redirect
    animateBar();
    msgTimer = setInterval(() => {
      msgIdx = (msgIdx + 1) % msgs.length;
      loaderMsg.textContent = msgs[msgIdx];
    }, 900);

    setTimeout(() => {
      clearInterval(msgTimer);
      clearInterval(barTimer);
      barFill.style.width = '100%';
      // Redirect to game
      window.location.href = GAME_URL;
    }, 2600);
  }

  function animateBar() {
    pct = 0;
    barFill.style.width = '0%';
    barTimer = setInterval(() => {
      pct += Math.random() * 12 + 4;
      if (pct > 88) pct = 88;
      barFill.style.width = pct + '%';
    }, 200);
  }

  function showLoading() {
    launchScreen.style.display  = 'none';
    errorScreen.classList.remove('show');
    loadingScreen.classList.add('show');
    loaderMsg.textContent = msgs[0];
  }

  function showError(msg) {
    loadingScreen.classList.remove('show');
    launchScreen.style.display = 'none';
    document.getElementById('errMsg').innerHTML = msg;
    errorScreen.classList.add('show');
  }

  function retryGame() {
    errorScreen.classList.remove('show');
    startGame();
  }

  function backToMenu() {
    errorScreen.classList.remove('show');
    loadingScreen.classList.remove('show');
    launchScreen.style.display = '';
    clearInterval(msgTimer);
    clearInterval(barTimer);
    pct = 0;
  }

  // Auto-retry on reconnect
  window.addEventListener('online',  () => { if (errorScreen.classList.contains('show')) retryGame(); });
  window.addEventListener('offline', () => { showError('You went offline.<br/>Reconnect to continue.'); });
</script>
</body>
</html>
