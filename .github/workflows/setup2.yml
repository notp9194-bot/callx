          cat > app/src/main/res/layout/fragment_status.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/surface_bg">

              <androidx.core.widget.NestedScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fillViewport="true"
                  android:overScrollMode="never">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:paddingBottom="100dp">

                      <!-- Section header: Recent updates (horizontal cards) -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:paddingStart="20dp"
                          android:paddingEnd="20dp"
                          android:paddingTop="20dp"
                          android:paddingBottom="12dp">
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Recent updates"
                              android:textColor="?android:attr/textColorPrimary"
                              android:textSize="20sp"
                              android:textStyle="bold"/>
                          <TextView
                              android:id="@+id/tv_status_count"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="@color/text_secondary"
                              android:textSize="12sp"/>
                      </LinearLayout>

                      <!-- Horizontal RecyclerView of status cards -->
                      <androidx.recyclerview.widget.RecyclerView
                          android:id="@+id/rv_status"
                          android:layout_width="match_parent"
                          android:layout_height="240dp"
                          android:clipToPadding="false"
                          android:paddingStart="14dp"
                          android:paddingEnd="14dp"
                          android:overScrollMode="never"/>

                      <!-- Empty state -->
                      <LinearLayout
                          android:id="@+id/empty_status"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:gravity="center"
                          android:paddingTop="60dp"
                          android:paddingBottom="60dp"
                          android:visibility="gone">
                          <ImageView
                              android:layout_width="64dp"
                              android:layout_height="64dp"
                              android:src="@drawable/ic_status_notification"
                              android:alpha="0.4"
                              android:contentDescription="No updates"/>
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="No status updates yet"
                              android:textColor="@color/text_secondary"
                              android:textSize="15sp"
                              android:layout_marginTop="14dp"/>
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Tap the camera to share your moment"
                              android:textColor="@color/text_muted"
                              android:textSize="12sp"
                              android:layout_marginTop="4dp"/>
                      </LinearLayout>
                  </LinearLayout>
              </androidx.core.widget.NestedScrollView>

              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/fab_new_status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom|end"
                  android:layout_margin="20dp"
                  android:src="@drawable/ic_camera"
                  app:backgroundTint="@color/brand_primary"
                  app:tint="@color/white"
                  android:contentDescription="New status"/>
          </FrameLayout>
          ENDOFFILE

