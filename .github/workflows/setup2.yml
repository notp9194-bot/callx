          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/circle_status_unseen.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke android:width="3dp" android:color="@color/brand_accent"/>
              <solid android:color="@color/transparent"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/gradient_brand.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="135"
                  android:startColor="@color/brand_gradient_start"
                  android:endColor="@color/brand_gradient_end"/>
          </shape>
          ENDOFFILE

          # ===== Status feature drawables =====
          cat > app/src/main/res/drawable/status_card_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1F2937"/>
              <corners android:radius="18dp"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/status_card_placeholder.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="135"
                  android:startColor="#5B5BF6"
                  android:endColor="#9333EA"/>
              <corners android:radius="18dp"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/status_gradient_overlay.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="90"
                  android:startColor="#E6000000"
                  android:centerColor="#66000000"
                  android:endColor="#00000000"/>
              <corners android:radius="18dp"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/progress_segment_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#33FFFFFF"/>
              <corners android:radius="2dp"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/progress_segment_fill.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape>
                      <solid android:color="#33FFFFFF"/>
                      <corners android:radius="2dp"/>
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape>
                          <solid android:color="#FFFFFFFF"/>
