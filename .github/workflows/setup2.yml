          cat > app/proguard-rules.pro << 'ENDOFFILE'
          -keep class com.callx.app.models.** { *; }
          -keepclassmembers class com.callx.app.models.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.firebase.**
          -keep class org.webrtc.** { *; }
          -dontwarn org.webrtc.**
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn javax.annotation.**
          -dontwarn org.conscrypt.**
          -keep public class * implements com.bumptech.glide.module.GlideModule
          -keep class * extends com.bumptech.glide.module.AppGlideModule { <init>(...); }
          -keep public enum com.bumptech.glide.load.ImageHeaderParser$** { **[] $VALUES; public *; }
          -keep class com.bumptech.glide.GeneratedAppGlideModuleImpl
          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**
          -keep class com.callx.app.CallxApp { *; }
          -keep class com.callx.app.activities.** { *; }
          -keep class com.callx.app.services.** { *; }
          -keepattributes Signature
          -keepattributes *Annotation*
          ENDOFFILE

          # ============================================================
          # LAYOUTS — Auth, Main (with bottom nav), Profile
          # ============================================================
          cat > app/src/main/res/layout/activity_auth.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/surface_bg"
              android:fillViewport="true">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="32dp"
                  android:gravity="center_horizontal">
                  <FrameLayout
                      android:layout_width="96dp"
                      android:layout_height="96dp"
                      android:layout_marginTop="48dp"
                      android:background="@drawable/circle_primary">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center"
                          android:text="C"
                          android:textColor="@color/white"
                          android:textSize="48sp"
                          android:textStyle="bold"/>
                  </FrameLayout>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="CallX"
                      android:textSize="36sp"
                      android:textStyle="bold"
                      android:textColor="?android:attr/textColorPrimary"
                      android:layout_marginTop="16dp"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Connect. Call. Chat."
                      android:textColor="@color/text_secondary"
                      android:textSize="15sp"
                      android:layout_marginTop="6dp"
                      android:layout_marginBottom="40dp"/>
                  <!-- Signup avatar picker (tap karke photo choose karo) -->
                  <FrameLayout
                      android:id="@+id/fl_avatar_picker"
                      android:layout_width="110dp"
                      android:layout_height="110dp"
                      android:layout_marginBottom="14dp"
                      android:visibility="gone">
                      <de.hdodenhof.circleimageview.CircleImageView
                          android:id="@+id/iv_avatar_preview"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:src="@drawable/ic_person"
                          android:background="@color/surface_input"/>
                      <FrameLayout
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:layout_gravity="bottom|end"
                          android:background="@drawable/circle_primary">
                          <ImageView
                              android:layout_width="18dp"
                              android:layout_height="18dp"
                              android:layout_gravity="center"
                              android:src="@drawable/ic_camera"
                              android:tint="@color/white"/>
                      </FrameLayout>
                  </FrameLayout>
                  <TextView
                      android:id="@+id/tv_avatar_hint"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Profile photo lagao"
                      android:textColor="@color/text_secondary"
                      android:textSize="13sp"
                      android:layout_marginBottom="14dp"
                      android:visibility="gone"/>
                  <com.google.android.material.textfield.TextInputLayout
                      android:id="@+id/til_name"
                      style="@style/Widget.Material3.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Naam (signup ke liye)"
                      android:layout_marginBottom="12dp"
                      app:boxCornerRadiusBottomEnd="14dp"
                      app:boxCornerRadiusBottomStart="14dp"
                      app:boxCornerRadiusTopEnd="14dp"
                      app:boxCornerRadiusTopStart="14dp">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_name"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="textPersonName"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.textfield.TextInputLayout
                      android:id="@+id/til_mobile"
                      style="@style/Widget.Material3.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Mobile number (10 digit, ye hi aapki CallX ID hogi)"
                      android:layout_marginBottom="12dp"
                      app:prefixText="+"
                      app:boxCornerRadiusBottomEnd="14dp"
                      app:boxCornerRadiusBottomStart="14dp"
                      app:boxCornerRadiusTopEnd="14dp"
                      app:boxCornerRadiusTopStart="14dp">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_mobile"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="phone"
                          android:maxLength="15"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.textfield.TextInputLayout
                      style="@style/Widget.Material3.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Email"
                      app:boxCornerRadiusBottomEnd="14dp"
                      app:boxCornerRadiusBottomStart="14dp"
                      app:boxCornerRadiusTopEnd="14dp"
                      app:boxCornerRadiusTopStart="14dp">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_email"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="textEmailAddress"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.textfield.TextInputLayout
                      style="@style/Widget.Material3.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Password"
                      android:layout_marginTop="14dp"
                      app:passwordToggleEnabled="true"
                      app:boxCornerRadiusBottomEnd="14dp"
                      app:boxCornerRadiusBottomStart="14dp"
                      app:boxCornerRadiusTopEnd="14dp"
                      app:boxCornerRadiusTopStart="14dp">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_password"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="textPassword"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <TextView
                      android:id="@+id/tv_error"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="@color/action_danger"
                      android:layout_marginTop="8dp"
                      android:visibility="gone"/>
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btn_login"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="Login"
                      app:cornerRadius="14dp"
                      android:backgroundTint="@color/brand_primary"
                      android:layout_marginTop="24dp"/>
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btn_signup"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="Naya account banao"
                      style="@style/Widget.Material3.Button.OutlinedButton"
                      app:cornerRadius="14dp"
                      android:layout_marginTop="12dp"/>
              </LinearLayout>
          </ScrollView>
          ENDOFFILE

          # activity_main.xml — gradient header, ID badge, BottomNav
          cat > app/src/main/res/layout/activity_main.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.coordinatorlayout.widget.CoordinatorLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/surface_bg">
              <com.google.android.material.appbar.AppBarLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/gradient_brand"
                  app:elevation="0dp">
                  <androidx.appcompat.widget.Toolbar
                      android:id="@+id/toolbar"
                      android:layout_width="match_parent"
                      android:layout_height="?attr/actionBarSize"
                      android:background="@color/transparent"
                      app:title="CallX"
                      app:titleTextColor="@color/white"/>
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:paddingBottom="10dp">
                      <TextView
                          android:id="@+id/tv_my_id"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:textColor="#E0E7FF"
                          android:textSize="12sp"
                          android:text="Mera CallX ID: load ho raha hai..."/>
                      <ImageButton
                          android:id="@+id/btn_copy_id"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
