                      </shape>
                  </clip>
              </item>
          </layer-list>
          ENDOFFILE

          cat > app/src/main/res/drawable/reply_input_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
