          cat > app/src/main/java/com/callx/app/fragments/StatusFragment.java << 'ENDOFFILE'
          package com.callx.app.fragments;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.activities.NewStatusActivity;
          import com.callx.app.adapters.StatusListAdapter;
          import com.callx.app.models.StatusItem;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.android.material.floatingactionbutton.FloatingActionButton;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.database.*;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          public class StatusFragment extends Fragment {
              private final List<StatusItem> statuses = new ArrayList<>();
              private StatusListAdapter adapter;
              private View emptyView;
              private TextView tvCount;
              private final Set<String> seenStatusIds = new HashSet<>();   // statuses already seen by me
              private final Set<String> seenOwners    = new HashSet<>();   // owners whose latest status is seen
              private ValueEventListener statusListener;
              private ValueEventListener seenListener;
              private DatabaseReference statusRef;
              private DatabaseReference seenRef;

              @Override
              public View onCreateView(@NonNull LayoutInflater inflater, ViewGroup parent, Bundle s) {
                  View v = inflater.inflate(R.layout.fragment_status, parent, false);
                  RecyclerView rv = v.findViewById(R.id.rv_status);
                  rv.setLayoutManager(new LinearLayoutManager(getContext(),
                      LinearLayoutManager.HORIZONTAL, false));
                  rv.setItemAnimator(new androidx.recyclerview.widget.DefaultItemAnimator());
                  adapter = new StatusListAdapter(statuses, seenOwners);
                  rv.setAdapter(adapter);

                  // Fix #3 — horizontal swipe inside the cards must NOT bubble up to the
                  // ViewPager / parent NestedScrollView. Disallow parent intercept while the
                  // user is dragging horizontally on the RecyclerView.
                  rv.addOnItemTouchListener(new RecyclerView.OnItemTouchListener() {
                      private float startX, startY;
                      @Override public boolean onInterceptTouchEvent(@NonNull RecyclerView r,
                                                                     @NonNull MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  startX = e.getX(); startY = e.getY();
                                  r.getParent().requestDisallowInterceptTouchEvent(true);
                                  break;
                              case MotionEvent.ACTION_MOVE:
                                  float dx = Math.abs(e.getX() - startX);
                                  float dy = Math.abs(e.getY() - startY);
                                  // Lock horizontal — parent ko vertical scroll do, hum horizontal
                                  // ko consume karenge.
                                  if (dx > dy) r.getParent().requestDisallowInterceptTouchEvent(true);
                                  break;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  r.getParent().requestDisallowInterceptTouchEvent(false);
                                  break;
                          }
                          return false;
                      }
                      @Override public void onTouchEvent(@NonNull RecyclerView r,
                                                         @NonNull MotionEvent e) {}
                      @Override public void onRequestDisallowInterceptTouchEvent(boolean d) {}
                  });

                  emptyView = v.findViewById(R.id.empty_status);
                  tvCount = v.findViewById(R.id.tv_status_count);
                  FloatingActionButton fab = v.findViewById(R.id.fab_new_status);
                  fab.setOnClickListener(x ->
                      startActivity(new Intent(getContext(), NewStatusActivity.class)));
                  attachListeners();
                  return v;
              }

              private void attachListeners() {
                  // Listen to my "seen" map first so sorting is correct on first paint
                  if (FirebaseAuth.getInstance().getCurrentUser() != null) {
                      String myUid = FirebaseAuth.getInstance().getCurrentUser().getUid();
                      seenRef = FirebaseUtils.getStatusSeenRef(myUid);
                      seenListener = seenRef.addValueEventListener(new ValueEventListener() {
                          @Override public void onDataChange(DataSnapshot snap) {
                              seenStatusIds.clear();
                              for (DataSnapshot owner : snap.getChildren()) {
                                  for (DataSnapshot st : owner.getChildren()) {
                                      seenStatusIds.add(st.getKey());
                                  }
                              }
                              applyData(); // re-sort with fresh seen state
                          }
                          @Override public void onCancelled(DatabaseError e) {}
                      });
                  }
                  statusRef = FirebaseUtils.getStatusRef();
                  statusListener = statusRef.addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot snap) {
                          rawSnapshot = snap;
                          applyData();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }

              private DataSnapshot rawSnapshot;

              private void applyData() {
                  if (rawSnapshot == null) return;
                  statuses.clear();
                  seenOwners.clear();
                  long now = System.currentTimeMillis();
                  String myUid = FirebaseAuth.getInstance().getCurrentUser() == null
                      ? "" : FirebaseAuth.getInstance().getCurrentUser().getUid();

                  Map<String, StatusItem> latestByUser = new HashMap<>();
                  Map<String, Boolean> ownerAllSeen = new HashMap<>();

                  for (DataSnapshot user : rawSnapshot.getChildren()) {
                      StatusItem latest = null;
                      boolean allSeen = true;
                      boolean anyValid = false;
                      String ownerUid = user.getKey();
                      for (DataSnapshot st : user.getChildren()) {
                          StatusItem item = st.getValue(StatusItem.class);
                          if (item == null) continue;
                          if (item.expiresAt != null && item.expiresAt < now) continue;
                          anyValid = true;
                          if (item.id != null && !seenStatusIds.contains(item.id)) {
                              allSeen = false;
                          }
                          if (latest == null ||
                              (item.timestamp != null && latest.timestamp != null
                                  && item.timestamp > latest.timestamp)) {
                              latest = item;
                          }
                      }
                      if (anyValid && latest != null) {
                          latestByUser.put(ownerUid, latest);
                          ownerAllSeen.put(ownerUid, allSeen);
                          if (allSeen) seenOwners.add(ownerUid);
                      }
                  }

                  statuses.addAll(latestByUser.values());
                  // Sort: my own first → unseen by recency → seen by recency
                  final String myUidF = myUid;
                  Collections.sort(statuses, new Comparator<StatusItem>() {
                      @Override public int compare(StatusItem a, StatusItem b) {
                          int ao = myUidF.equals(a.ownerUid) ? 0 : 1;
                          int bo = myUidF.equals(b.ownerUid) ? 0 : 1;
                          if (ao != bo) return Integer.compare(ao, bo);
                          boolean as = Boolean.TRUE.equals(ownerAllSeen.get(a.ownerUid));
                          boolean bs = Boolean.TRUE.equals(ownerAllSeen.get(b.ownerUid));
                          if (as != bs) return as ? 1 : -1; // unseen first
                          long at = a.timestamp == null ? 0 : a.timestamp;
                          long bt = b.timestamp == null ? 0 : b.timestamp;
                          return Long.compare(bt, at); // newer first
                      }
                  });

                  adapter.notifyDataSetChanged();
                  if (emptyView != null) {
                      emptyView.setVisibility(statuses.isEmpty() ? View.VISIBLE : View.GONE);
                  }
                  if (tvCount != null) {
                      int n = statuses.size();
                      tvCount.setText(n == 0 ? "" : (n + (n == 1 ? " update" : " updates")));
                  }
              }

              @Override public void onResume() {
                  super.onResume();
                  // Re-apply on resume so freshly-seen ring colors update immediately
                  applyData();
              }

              @Override public void onDestroyView() {
                  if (statusRef != null && statusListener != null) {
                      statusRef.removeEventListener(statusListener);
                  }
                  if (seenRef != null && seenListener != null) {
                      seenRef.removeEventListener(seenListener);
                  }
                  super.onDestroyView();
              }
          }
          ENDOFFILE

