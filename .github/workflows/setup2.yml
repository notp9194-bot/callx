                              m.senderName = currentName;
                              m.type = msgType;
                              m.mediaUrl = r.secureUrl;
                              m.imageUrl = "image".equals(msgType) ? r.secureUrl : null;
                              m.fileName = fileName;
                              m.fileSize = r.bytes != null ? r.bytes : size;
                              m.duration = r.durationMs;
                              m.timestamp = System.currentTimeMillis();
