          cat > app/src/main/java/com/callx/app/workers/ScheduledMessageWorker.java << 'ENDOFFILE'
          package com.callx.app.workers;
          import android.content.Context;
          import androidx.annotation.NonNull;
          import androidx.work.*;
          import com.callx.app.utils.Constants;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.concurrent.TimeUnit;
          /** Periodically scans /scheduled/{me}/* and, for any whose sendAt has
           *  elapsed, copies the payload to the destination chat/group/broadcast
           *  and removes the scheduled record. */
          public class ScheduledMessageWorker extends Worker {
              public ScheduledMessageWorker(@NonNull Context c, @NonNull WorkerParameters p) { super(c, p); }
              @NonNull @Override public Result doWork() {
                  String me = FirebaseUtils.myUid();
                  if (me == null) return Result.success();
                  final Object lock = new Object();
                  final boolean[] done = {false};
                  FirebaseUtils.scheduled().child(me).addListenerForSingleValueEvent(
                      new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              long now = System.currentTimeMillis();
                              for (DataSnapshot c : s.getChildren()) {
                                  Long at = c.child("sendAt").getValue(Long.class);
                                  if (at == null || at > now) continue;
                                  String chatKey = c.child("chatKey").getValue(String.class);
                                  String groupId = c.child("groupId").getValue(String.class);
                                  java.util.Map<String, Object> msg = new java.util.HashMap<>();
                                  for (DataSnapshot k : c.getChildren()) {
                                      if ("sendAt".equals(k.getKey())
                                          || "chatKey".equals(k.getKey())
                                          || "groupId".equals(k.getKey())) continue;
                                      msg.put(k.getKey(), k.getValue());
                                  }
                                  msg.put("timestamp", System.currentTimeMillis());
                                  msg.put("status", "sent");
                                  DatabaseReference dest;
                                  if (groupId != null && !groupId.isEmpty()) {
                                      dest = FirebaseUtils.groups().child(groupId).child("messages").push();
                                  } else if (chatKey != null && !chatKey.isEmpty()) {
                                      dest = FirebaseUtils.chats().child(chatKey).child("messages").push();
                                  } else continue;
                                  dest.setValue(msg);
                                  c.getRef().removeValue();
                              }
                              synchronized (lock) { done[0] = true; lock.notifyAll(); }
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {
                              synchronized (lock) { done[0] = true; lock.notifyAll(); }
                          }
                      });
                  synchronized (lock) {
                      try { if (!done[0]) lock.wait(15000); } catch (InterruptedException ignored) {}
                  }
                  return Result.success();
              }
              public static void enqueue(Context ctx) {
                  Constraints c = new Constraints.Builder()
                      .setRequiredNetworkType(NetworkType.CONNECTED).build();
                  PeriodicWorkRequest req = new PeriodicWorkRequest.Builder(
                      ScheduledMessageWorker.class, 15, TimeUnit.MINUTES)
                      .setConstraints(c).build();
                  WorkManager.getInstance(ctx).enqueueUniquePeriodicWork(
                      "callx_scheduled", ExistingPeriodicWorkPolicy.KEEP, req);
                  WorkManager.getInstance(ctx).enqueue(new OneTimeWorkRequest.Builder(
                      ScheduledMessageWorker.class).setConstraints(c).build());
              }
          }
          ENDOFFILE

