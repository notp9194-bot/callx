          package com.callx.app.activities;
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import com.callx.app.R;
          public class LocationShareActivity extends AppCompatActivity {
              private TextView tvCoords, tvStatus;
              private LocationManager lm;
              private Location current;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_location_share);
                  tvCoords = findViewById(R.id.tv_coords);
                  tvStatus = findViewById(R.id.tv_status);
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  findViewById(R.id.btn_share_once).setOnClickListener(v -> shareOnce());
                  findViewById(R.id.btn_share_live).setOnClickListener(v -> shareLive());
                  lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION}, 12);
                  } else fetch();
              }
              @SuppressLint("MissingPermission")
              private void fetch() {
                  try {
                      current = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (current == null) current = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      if (current != null) {
                          tvCoords.setText(current.getLatitude() + ", " + current.getLongitude());
                          tvStatus.setText("Location ready");
                      }
                  } catch (Exception ignored) {}
              }
              private void shareOnce() {
                  if (current == null) { fetch(); if (current == null) return; }
                  Intent r = new Intent();
                  r.putExtra("lat", current.getLatitude());
                  r.putExtra("lng", current.getLongitude());
                  setResult(RESULT_OK, r); finish();
              }
              private void shareLive() { shareOnce(); }
              @Override public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
                  super.onRequestPermissionsResult(rc, p, r);
                  if (rc == 12 && r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED) fetch();
              }
          }
          ENDOFFILE

