                  ref.onDisconnect().setValue(off);
              }
              public static void setTyping(String chatKey, boolean typing) {
                  String uid = FirebaseUtils.myUid();
                  if (uid == null) return;
                  DatabaseReference t = FirebaseUtils.typing().child(chatKey).child(uid);
                  if (typing) {
                      t.setValue(System.currentTimeMillis());
                      t.onDisconnect().removeValue();
                  } else {
                      t.removeValue();
                  }
              }
          }
