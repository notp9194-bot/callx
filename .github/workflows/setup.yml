          package com.callx.app.activities;
          import android.os.Bundle;
          import android.widget.EditText;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.adapters.MemberSelectAdapter;
          import com.callx.app.models.User;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.*;
          public class NewGroupActivity extends AppCompatActivity {
              private List<User> users = new ArrayList<>();
              private Set<String> selected = new HashSet<>();
              private EditText etName;
              private RecyclerView rv;
              private MemberSelectAdapter adapter;
              private String addToGid;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_new_group);
                  etName = findViewById(R.id.et_group_name);
                  rv = findViewById(R.id.rv);
                  addToGid = getIntent().getStringExtra("addToGid");
                  if (addToGid != null) {
                      etName.setVisibility(android.view.View.GONE);
                      ((com.google.android.material.button.MaterialButton)
                          findViewById(R.id.btn_create)).setText("Add to group");
                  }
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  adapter = new MemberSelectAdapter(this, users, selected);
                  rv.setAdapter(adapter);
                  findViewById(R.id.btn_create).setOnClickListener(v -> create());
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  loadUsers();
              }
              private void loadUsers() {
                  FirebaseUtils.users().addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          String me = FirebaseUtils.myUid();
                          users.clear();
                          for (DataSnapshot c : d.getChildren()) {
                              User u = c.getValue(User.class);
                              if (u == null) continue; u.uid = c.getKey();
                              if (u.uid.equals(me)) continue;
                              users.add(u);
                          }
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
              private void create() {
                  if (selected.isEmpty()) { Toast.makeText(this, "Select members", Toast.LENGTH_SHORT).show(); return; }
                  String me = FirebaseUtils.myUid();
                  if (addToGid != null) {
                      Map<String,Object> u = new HashMap<>();
                      for (String uid : selected) u.put(uid, true);
                      FirebaseUtils.groups().child(addToGid).child("members").updateChildren(u);
                      finish(); return;
                  }
                  String name = etName.getText().toString().trim();
                  if (name.isEmpty()) { Toast.makeText(this, "Group name?", Toast.LENGTH_SHORT).show(); return; }
                  String gid = FirebaseUtils.groups().push().getKey();
                  Map<String,Object> g = new HashMap<>();
                  g.put("name", name);
                  g.put("createdBy", me);
                  g.put("createdAt", System.currentTimeMillis());
                  Map<String,Object> ms = new HashMap<>();
                  ms.put(me, true);
                  for (String uid : selected) ms.put(uid, true);
                  g.put("members", ms);
                  Map<String,Object> ad = new HashMap<>(); ad.put(me, true);
                  g.put("admins", ad);
                  FirebaseUtils.groups().child(gid).setValue(g);
                  finish();
              }
          }
