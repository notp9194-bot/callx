          package com.callx.app.activities;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import com.bumptech.glide.Glide;
          import com.callx.app.R;
          import com.callx.app.models.Message;
          import com.callx.app.models.StatusItem;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import de.hdodenhof.circleimageview.CircleImageView;
          import java.util.*;
          public class StatusViewerActivity extends AppCompatActivity {
              private List<StatusItem> items = new ArrayList<>();
              private int idx = 0;
              private ImageView ivImage;
              private TextView tvText, tvName;
              private CircleImageView ivAvatar;
              private PlayerView pv;
              private ExoPlayer player;
              private ProgressBar progress;
              private Handler h = new Handler();
              private Runnable advance;
              private String ownerUid;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_status_viewer);
                  ownerUid = getIntent().getStringExtra("ownerUid");
                  ivImage = findViewById(R.id.iv_image);
                  tvText  = findViewById(R.id.tv_text_status);
                  tvName  = findViewById(R.id.tv_name);
                  ivAvatar = findViewById(R.id.iv_avatar);
                  pv      = findViewById(R.id.pv_video);
                  progress = findViewById(R.id.progress);
                  EditText etReply = findViewById(R.id.et_reply);
                  findViewById(R.id.btn_send_reply).setOnClickListener(v -> sendReply(etReply.getText().toString()));
                  findViewById(R.id.btn_views).setOnClickListener(v -> {
                      if (items.isEmpty()) return;
                      Intent i = new Intent(this, StatusViewsActivity.class);
                      i.putExtra("statusId", items.get(idx).id);
                      i.putExtra("ownerUid", ownerUid);
                      startActivity(i);
                  });
                  ivImage.setOnClickListener(v -> next());
                  load();
              }
              private void load() {
                  FirebaseUtils.status().child(ownerUid).addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          long cutoff = System.currentTimeMillis() - 24L*60*60*1000;
                          for (DataSnapshot c : d.getChildren()) {
                              StatusItem si = c.getValue(StatusItem.class);
                              if (si == null) continue; si.id = c.getKey();
                              if (si.timestamp == null || si.timestamp < cutoff) continue;
                              items.add(si);
                          }
                          if (items.isEmpty()) finish(); else show();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
              private void show() {
                  StatusItem si = items.get(idx);
                  tvName.setText(si.ownerName == null ? "Status" : si.ownerName);
                  if (si.ownerPhoto != null && !si.ownerPhoto.isEmpty())
                      Glide.with(this).load(si.ownerPhoto).into(ivAvatar);
                  ivImage.setVisibility(View.GONE); tvText.setVisibility(View.GONE); pv.setVisibility(View.GONE);
                  long dur = 5000;
                  if ("text".equals(si.type)) {
                      tvText.setVisibility(View.VISIBLE); tvText.setText(si.text);
                  } else if ("video".equals(si.type)) {
                      pv.setVisibility(View.VISIBLE);
                      if (player != null) player.release();
                      player = new ExoPlayer.Builder(this).build();
                      pv.setPlayer(player);
                      player.setMediaItem(MediaItem.fromUri(Uri.parse(si.mediaUrl)));
                      player.prepare(); player.play();
                      dur = 15000;
                  } else {
                      ivImage.setVisibility(View.VISIBLE);
                      Glide.with(this).load(si.mediaUrl).into(ivImage);
                  }
                  // mark as viewed
                  String me = FirebaseUtils.myUid();
                  if (me != null && !me.equals(ownerUid))
                      FirebaseUtils.status().child(ownerUid).child(si.id).child("views")
                          .child(me).setValue(System.currentTimeMillis());
                  progress.setProgress(0); progress.setMax(100);
                  if (advance != null) h.removeCallbacks(advance);
                  final long total = dur;
                  final long start = System.currentTimeMillis();
                  Runnable tick = new Runnable() {
                      @Override public void run() {
                          long elapsed = System.currentTimeMillis() - start;
                          int p = (int) Math.min(100, elapsed * 100 / total);
                          progress.setProgress(p);
                          if (p < 100) h.postDelayed(this, 50);
                          else next();
                      }
                  };
                  advance = tick;
                  h.post(tick);
              }
              private void next() {
                  if (advance != null) h.removeCallbacks(advance);
                  if (player != null) { player.release(); player = null; }
                  idx++;
                  if (idx >= items.size()) finish(); else show();
              }
              private void sendReply(String s) {
                  if (s == null || s.trim().isEmpty()) return;
                  String me = FirebaseUtils.myUid();
                  String key = FirebaseUtils.chatKey(me, ownerUid);
                  Message m = new Message();
                  m.senderId = me; m.senderName = "Me"; m.type = "text";
                  m.text = "↳ status reply: " + s;
                  m.timestamp = System.currentTimeMillis(); m.status = "sent";
                  FirebaseUtils.chats().child(key).child("messages").push().setValue(m);
              }
              @Override protected void onDestroy() {
                  super.onDestroy(); if (player != null) player.release();
                  if (advance != null) h.removeCallbacks(advance);
              }
          }
          ENDOFFILE

