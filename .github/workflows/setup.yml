          package com.callx.app.adapters;
          import android.content.Context;
          import android.media.MediaPlayer;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.format.DateFormat;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;
          import com.bumptech.glide.Glide;
          import com.callx.app.R;
          import com.callx.app.models.Message;
          import com.callx.app.utils.AudioPlayerHelper;
          import com.callx.app.utils.FileUtils;
          import com.callx.app.utils.MentionHelper;
          import java.util.*;
          public class MessageAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
              public interface Listener {
                  void onLongPress(Message m);
                  void onReact(Message m, String emoji);
                  void onMediaTap(Message m);
                  default void onReplyJump(String replyToId) {}
              }
              private static final int SENT = 0, RECV = 1;
              private final Context ctx;
              private final List<Message> data;
              private final String myUid;
              private final boolean isGroup;
              private Listener listener;
              private final AudioPlayerHelper audio = new AudioPlayerHelper();
              public MessageAdapter(Context c, List<Message> d, String myUid, boolean isGroup) {
                  this.ctx = c; this.data = d; this.myUid = myUid; this.isGroup = isGroup;
              }
              public void setListener(Listener l) { this.listener = l; }
              public void releaseAudio() { audio.release(); }
              public int getAdapterPosOf(Message m) {
                  for (int i = 0; i < data.size(); i++)
                      if (data.get(i).id != null && data.get(i).id.equals(m.id)) return i;
                  return RecyclerView.NO_POSITION;
              }
              @Override public int getItemViewType(int pos) {
                  Message m = data.get(pos);
                  return (m.senderId != null && m.senderId.equals(myUid)) ? SENT : RECV;
              }
              @NonNull @Override
              public RecyclerView.ViewHolder onCreateViewHolder(@NonNull ViewGroup p, int vt) {
                  int layout = vt == SENT ? R.layout.item_message_sent : R.layout.item_message_received;
                  return new VH(LayoutInflater.from(ctx).inflate(layout, p, false));
              }
              @Override public void onBindViewHolder(@NonNull RecyclerView.ViewHolder h, int pos) {
                  ((VH) h).bind(data.get(pos));
              }
              @Override public int getItemCount() { return data.size(); }
              class VH extends RecyclerView.ViewHolder {
                  TextView tvMessage, tvTime, tvEdited, tvSenderName, tvQuoteName, tvQuoteText,
                      tvAudioDur, tvFileName, tvFileMeta, tvLocLabel, tvContactName, tvContactMeta;
                  ImageView ivStatus, ivImage, ivVideoThumb, ivViewOnce, ivStarred;
                  ImageButton btnPlayAudio;
                  SeekBar seekAudio;
                  LinearLayout llReply, llAudio, llFile, llLocation, llContact, llReactions;
                  FrameLayout flVideo;
                  View bubble;
                  VH(View v) {
                      super(v);
                      tvMessage = v.findViewById(R.id.tv_message);
                      tvTime = v.findViewById(R.id.tv_time);
                      tvEdited = v.findViewById(R.id.tv_edited);
                      tvSenderName = v.findViewById(R.id.tv_sender_name);
                      tvQuoteName = v.findViewById(R.id.tv_quote_name);
                      tvQuoteText = v.findViewById(R.id.tv_quote_text);
                      tvAudioDur = v.findViewById(R.id.tv_audio_dur);
                      tvFileName = v.findViewById(R.id.tv_file_name);
                      tvFileMeta = v.findViewById(R.id.tv_file_meta);
                      tvLocLabel = v.findViewById(R.id.tv_location_label);
                      tvContactName = v.findViewById(R.id.tv_contact_name);
                      tvContactMeta = v.findViewById(R.id.tv_contact_meta);
                      ivStatus = v.findViewById(R.id.iv_status);
                      ivImage = v.findViewById(R.id.iv_image);
                      ivVideoThumb = v.findViewById(R.id.iv_video_thumb);
                      ivViewOnce = v.findViewById(R.id.iv_view_once);
                      ivStarred = v.findViewById(R.id.iv_starred);
                      btnPlayAudio = v.findViewById(R.id.btn_play_audio);
                      seekAudio = v.findViewById(R.id.seek_audio);
                      llReply = v.findViewById(R.id.ll_reply_quote);
                      llAudio = v.findViewById(R.id.ll_audio);
                      llFile = v.findViewById(R.id.ll_file);
                      llLocation = v.findViewById(R.id.ll_location);
                      llContact = v.findViewById(R.id.ll_contact);
                      llReactions = v.findViewById(R.id.ll_reactions);
                      flVideo = v.findViewById(R.id.fl_video);
                      bubble = v;
                  }
                  void bind(final Message m) {
                      // Group sender name
                      if (isGroup && tvSenderName != null
                          && m.senderId != null && !m.senderId.equals(myUid)) {
                          tvSenderName.setVisibility(View.VISIBLE);
                          tvSenderName.setText(m.senderName == null ? "" : m.senderName);
                      } else if (tvSenderName != null) tvSenderName.setVisibility(View.GONE);
                      // Reply quote — tap jumps to original
                      if (m.replyToId != null) {
                          llReply.setVisibility(View.VISIBLE);
                          tvQuoteName.setText(m.replyToName == null ? "" : m.replyToName);
                          tvQuoteText.setText(m.replyToText == null ? "" : m.replyToText);
                          llReply.setOnClickListener(v -> {
                              if (listener != null) listener.onReplyJump(m.replyToId);
                          });
                      } else llReply.setVisibility(View.GONE);
                      // Hide all media containers, then show the one for this type
                      ivImage.setVisibility(View.GONE);
                      flVideo.setVisibility(View.GONE);
                      llAudio.setVisibility(View.GONE);
                      llFile.setVisibility(View.GONE);
                      llLocation.setVisibility(View.GONE);
                      llContact.setVisibility(View.GONE);
                      tvMessage.setVisibility(View.GONE);
                      ivViewOnce.setVisibility(Boolean.TRUE.equals(m.viewOnce) ? View.VISIBLE : View.GONE);
                      if (Boolean.TRUE.equals(m.deletedForAll)) {
                          tvMessage.setVisibility(View.VISIBLE);
                          tvMessage.setText("🚫 This message was deleted");
                      } else if ("image".equals(m.type) && m.mediaUrl != null) {
                          if (Boolean.TRUE.equals(m.viewOnce) && Boolean.TRUE.equals(m.viewed)) {
                              tvMessage.setVisibility(View.VISIBLE);
                              tvMessage.setText("👁 viewed");
                          } else {
                              ivImage.setVisibility(View.VISIBLE);
                              Glide.with(ctx).load(m.mediaUrl).into(ivImage);
                              ivImage.setOnClickListener(v -> { if (listener != null) listener.onMediaTap(m); });
                          }
                      } else if ("video".equals(m.type) && m.mediaUrl != null) {
                          // View-once video: show placeholder once viewed
                          if (Boolean.TRUE.equals(m.viewOnce) && Boolean.TRUE.equals(m.viewed)) {
                              tvMessage.setVisibility(View.VISIBLE);
                              tvMessage.setText("👁 viewed");
                          } else {
                              flVideo.setVisibility(View.VISIBLE);
                              if (m.thumbnailUrl != null)
                                  Glide.with(ctx).load(m.thumbnailUrl).into(ivVideoThumb);
                              flVideo.setOnClickListener(v -> { if (listener != null) listener.onMediaTap(m); });
                          }
                      } else if ("audio".equals(m.type) && m.mediaUrl != null) {
                          llAudio.setVisibility(View.VISIBLE);
                          tvAudioDur.setText(FileUtils.formatDuration(m.duration == null ? 0 : m.duration));
                          // Real audio playback with seekbar
                          final String url = m.mediaUrl;
                          btnPlayAudio.setImageResource(audio.isPlaying(url)
                              ? R.drawable.ic_pause : R.drawable.ic_play);
                          if (seekAudio != null) {
                              seekAudio.setMax(m.duration == null ? 100 : m.duration.intValue());
                              seekAudio.setProgress(audio.positionFor(url));
                              seekAudio.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                                  @Override public void onProgressChanged(SeekBar s, int p, boolean u) {
                                      if (u) audio.seekTo(url, p);
                                  }
                                  @Override public void onStartTrackingTouch(SeekBar s) {}
                                  @Override public void onStopTrackingTouch(SeekBar s) {}
                              });
                          }
                          btnPlayAudio.setOnClickListener(v -> {
                              audio.toggle(url, (pos, total) -> {
                                  if (seekAudio != null) seekAudio.setProgress(pos);
                                  tvAudioDur.setText(FileUtils.formatDuration(total - pos));
                              }, () -> notifyItemChanged(getAdapterPosOf(m)));
                              notifyItemChanged(getAdapterPosOf(m));
                          });
                      } else if ("file".equals(m.type) && m.mediaUrl != null) {
                          llFile.setVisibility(View.VISIBLE);
                          tvFileName.setText(m.fileName == null ? "file" : m.fileName);
                          tvFileMeta.setText(FileUtils.human(m.fileSize == null ? 0 : m.fileSize));
                          llFile.setOnClickListener(v -> { if (listener != null) listener.onMediaTap(m); });
                      } else if ("location".equals(m.type) && m.lat != null) {
                          llLocation.setVisibility(View.VISIBLE);
                          tvLocLabel.setText("📍 " + m.lat + ", " + m.lng);
                      } else if ("contact".equals(m.type)) {
                          llContact.setVisibility(View.VISIBLE);
                          tvContactName.setText(m.contactName == null ? "" : m.contactName);
                          tvContactMeta.setText(m.contactPhone == null ? "" : m.contactPhone);
                      } else {
                          tvMessage.setVisibility(View.VISIBLE);
                          String t = m.text == null ? "" : m.text;
                          tvMessage.setText(MentionHelper.highlight(t));
                      }
                      tvTime.setText(m.timestamp == null ? "" : DateFormat.format("h:mm a", m.timestamp));
                      tvEdited.setVisibility(Boolean.TRUE.equals(m.edited) ? View.VISIBLE : View.GONE);
                      // Status double tick
                      if (ivStatus != null && m.senderId != null && m.senderId.equals(myUid)) {
                          ivStatus.setVisibility(View.VISIBLE);
                          int color = ctx.getResources().getColor(R.color.text_secondary);
                          int icon = R.drawable.ic_check;
                          if (m.seenBy != null && !m.seenBy.isEmpty()) {
                              icon = R.drawable.ic_check_double;
                              color = ctx.getResources().getColor(R.color.seen_blue);
                          } else if (m.deliveredTo != null && !m.deliveredTo.isEmpty()) {
                              icon = R.drawable.ic_check_double;
                          } else if ("sending".equals(m.status)) {
                              icon = R.drawable.ic_clock;
                          }
                          ivStatus.setImageResource(icon);
                          ivStatus.setColorFilter(color);
                      }
                      // Reactions
                      if (llReactions != null) {
                          llReactions.removeAllViews();
                          if (m.reactions != null && !m.reactions.isEmpty()) {
                              llReactions.setVisibility(View.VISIBLE);
                              for (Map.Entry<String, Map<String, Long>> e : m.reactions.entrySet()) {
                                  TextView t = new TextView(ctx);
                                  t.setText(e.getKey() + " " + (e.getValue() == null ? 0 : e.getValue().size()));
                                  t.setPadding(8, 2, 8, 2);
                                  llReactions.addView(t);
                              }
                          } else llReactions.setVisibility(View.GONE);
                      }
                      bubble.setOnLongClickListener(v -> {
                          if (listener != null) listener.onLongPress(m);
                          return true;
                      });
                  }
              }
          }
          ENDOFFILE

