name: Setup CallX v2 (Production)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Full Project Structure
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          # =====================================================================
          # CallX v2 — Production grade Android chat + call + group + status app
          # Features:
          #  - Modern Material 3 dark/light UI
          #  - Multi-media chat: text, image, video, audio (record + send), PDF/file
          #  - Groups (multi-member chat with media)
          #  - Status / Story (24h disappearing photo / video / text)
          #  - Profile (avatar upload, name, about, callxId)
          #  - Audio + video calls (WebRTC scaffold + FCM signaling)
          #  - Background killed notifications: messages, group, status, calls
          #  - Cloudinary signed upload for image / video / audio / pdf
          #  - 503 fix: server returns clear errors + supports resource_type
          # =====================================================================

          # === DIRECTORIES ===
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/callx/app/activities
          mkdir -p app/src/main/java/com/callx/app/fragments
          mkdir -p app/src/main/java/com/callx/app/adapters
          mkdir -p app/src/main/java/com/callx/app/models
          mkdir -p app/src/main/java/com/callx/app/utils
          mkdir -p app/src/main/java/com/callx/app/services
          mkdir -p server
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # ============================================================
          # google-services.json
          # ============================================================
          cat > app/google-services.json << 'ENDOFFILE'
          {
            "project_info": {
              "project_number": "286173223634",
              "project_id": "sathix-97a76",
              "storage_bucket": "sathix-97a76.firebasestorage.app",
              "firebase_url": "https://sathix-97a76-default-rtdb.asia-southeast1.firebasedatabase.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:286173223634:android:77c66dd61ac22411b16b0b",
                  "android_client_info": { "package_name": "com.callx.app" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyAl-UmdtYFQo5qX6QyiZnTVmC6AS2bwqR4" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          ENDOFFILE

          # ============================================================
          # Gradle setup
          # ============================================================
          cat > settings.gradle << 'ENDOFFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://repo.getstream.io/artifactory/libs-release/" }
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "CallX"
          include ':app'
          ENDOFFILE

          cat > build.gradle << 'ENDOFFILE'
          buildscript {
              dependencies { classpath 'com.google.gms:google-services:4.4.0' }
          }
          plugins { id 'com.android.application' version '8.2.2' apply false }
          ENDOFFILE

          cat > gradle.properties << 'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          ENDOFFILE

          cat > gradle/wrapper/gradle-wrapper.properties << 'ENDOFFILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          ENDOFFILE

          # ============================================================
          # app/build.gradle  (versionCode auto-bumps with every workflow run)
          # ============================================================
          cat > app/build.gradle << 'ENDOFFILE'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.callx.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.callx.app"
                  minSdk 23
                  targetSdk 34
                  versionCode __VERSION_CODE__
                  versionName "__VERSION_NAME__"
                  vectorDrawables.useSupportLibrary = true
              }
              buildTypes {
                  debug { minifyEnabled false; debuggable true }
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildFeatures { viewBinding true }
              packagingOptions {
                  resources {
                      excludes += [
                          'META-INF/AL2.0','META-INF/LGPL2.1','META-INF/DEPENDENCIES',
                          'META-INF/LICENSE*','META-INF/NOTICE*'
                      ]
                  }
              }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.activity:activity:1.8.2'
              implementation 'androidx.fragment:fragment:1.6.2'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-database'
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'com.google.firebase:firebase-storage'

              implementation 'io.getstream:stream-webrtc-android:1.1.2'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
              implementation 'de.hdodenhof:circleimageview:3.1.0'
          }
          ENDOFFILE

          # --- Auto-bump version (har workflow run pe alag versionCode) ---
          # RUN_NUM env var top pe inject hua hai (github.run_number se)
          VCODE=$((100 + RUN_NUM))
          VNAME="2.1.${RUN_NUM}"
          sed -i "s/__VERSION_CODE__/${VCODE}/" app/build.gradle
          sed -i "s/__VERSION_NAME__/${VNAME}/" app/build.gradle
          echo "Build version: code=${VCODE} name=${VNAME}"

          # ============================================================
          # AndroidManifest.xml — all permissions for media, mic, file, fg svc
          # ============================================================
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_PHONE_CALL"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_OWN_CALLS"/>

              <application
                  android:name=".CallxApp"
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="false"
                  android:label="CallX"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.CallX"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true">

                  <activity android:name=".activities.AuthActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <activity android:name=".activities.MainActivity"     android:exported="false"/>
                  <activity android:name=".activities.ChatActivity"     android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.GroupChatActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.NewGroupActivity" android:exported="false"/>
                  <activity android:name=".activities.SearchActivity"   android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.RequestsActivity" android:exported="false"/>
                  <activity android:name=".activities.RequestPopupActivity"
                      android:exported="false"
                      android:theme="@style/Theme.CallX.Transparent"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""/>
                  <activity android:name=".activities.ProfileActivity"  android:exported="false"/>
                  <activity android:name=".activities.MediaViewerActivity"
                      android:exported="false"
                      android:theme="@style/Theme.CallX.Fullscreen"/>
                  <activity android:name=".activities.StatusViewerActivity"
                      android:exported="false"
                      android:theme="@style/Theme.CallX.Fullscreen"/>
                  <activity android:name=".activities.NewStatusActivity"
                      android:exported="false"/>
                  <activity android:name=".activities.CallActivity" android:exported="false"
                      android:screenOrientation="portrait"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"/>
                  <activity android:name=".activities.IncomingCallActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:screenOrientation="portrait"
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"/>

                  <service android:name=".services.CallxMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>
                  </service>
                  <service android:name=".services.CallForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="phoneCall"/>

                  <receiver android:name=".services.NotificationActionReceiver"
                      android:exported="false"/>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.callx.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>

                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="callx_calls"/>
              </application>
          </manifest>
          ENDOFFILE

          # ============================================================
          # RESOURCES — Modern Material 3 colors (light + dark)
          # ============================================================
          cat > app/src/main/res/values/colors.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
