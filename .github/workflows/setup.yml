          package com.callx.app.activities;
          import android.content.Intent;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import android.text.InputType;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.Toast;
          import com.callx.app.CallxApp;
          import com.callx.app.R;
          import com.callx.app.utils.BiometricHelper;
          import com.callx.app.utils.PinHelper;
          import com.callx.app.utils.PrefsManager;
          import com.google.android.material.button.MaterialButton;
          public class AppLockActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_app_lock);
                  MaterialButton bio = findViewById(R.id.btn_unlock);
                  bio.setOnClickListener(v -> showBio());
                  String mode = PrefsManager.lockMode();
                  if ("pin".equals(mode) || (!BiometricHelper.canUse(this) && PrefsManager.hasPin())) {
                      askPin();
                  } else {
                      showBio();
                  }
              }
              private void showBio() {
                  if (!BiometricHelper.canUse(this)) {
                      if (PrefsManager.hasPin()) askPin(); else unlock();
                      return;
                  }
                  BiometricHelper.prompt(this, new BiometricHelper.Cb() {
                      @Override public void onOk()         { unlock(); }
                      @Override public void onFail(String s) { if (PrefsManager.hasPin()) askPin(); }
                  });
              }
              private void askPin() {
                  EditText pin = new EditText(this);
                  pin.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  pin.setHint("Enter PIN");
                  new androidx.appcompat.app.AlertDialog.Builder(this)
                      .setTitle("Unlock")
                      .setView(pin)
                      .setCancelable(false)
                      .setPositiveButton("OK", (d, w) -> {
                          String h = PinHelper.hash(pin.getText().toString());
                          if (h != null && h.equals(PrefsManager.getPinHash())) unlock();
                          else { Toast.makeText(this, "Wrong PIN", Toast.LENGTH_SHORT).show(); askPin(); }
                      })
                      .setNeutralButton(BiometricHelper.canUse(this) ? "Use biometric" : null,
                          (d, w) -> showBio())
                      .show();
              }
              private void unlock() {
                  CallxApp.isLocked = false;
                  startActivity(new Intent(this, MainActivity.class));
                  finish();
              }
              @Override public void onBackPressed() {} // can't dismiss
          }
          ENDOFFILE

