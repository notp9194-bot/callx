          package com.callx.app.activities;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.adapters.ContactPickAdapter;
          import java.util.*;
          public class ContactsPickerActivity extends AppCompatActivity {
              private List<String[]> rows = new ArrayList<>();
              private ContactPickAdapter adapter;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_contacts_picker);
                  RecyclerView rv = findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  adapter = new ContactPickAdapter(this, rows, (n, p) -> {
                      Intent r = new Intent(); r.putExtra("name", n); r.putExtra("phone", p);
                      setResult(RESULT_OK, r); finish();
                  });
                  rv.setAdapter(adapter);
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_CONTACTS}, 11);
                  } else load();
              }
              @Override public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
                  super.onRequestPermissionsResult(rc, p, r);
                  if (rc == 11 && r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED) load();
              }
              private void load() {
                  Cursor c = getContentResolver().query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                   ContactsContract.CommonDataKinds.Phone.NUMBER},
                      null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC");
                  if (c != null) {
                      while (c.moveToNext()) rows.add(new String[]{c.getString(0), c.getString(1)});
                      c.close();
                  }
                  adapter.notifyDataSetChanged();
              }
