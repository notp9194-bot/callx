          package com.callx.app.fragments;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import androidx.annotation.NonNull;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.activities.CallActivity;
          import com.callx.app.adapters.CallHistoryAdapter;
          import com.callx.app.models.CallLog;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.*;
          public class CallsFragment extends Fragment {
              private List<CallLog> data = new ArrayList<>();
              private CallHistoryAdapter adapter;
              @Override public View onCreateView(@NonNull LayoutInflater i, ViewGroup p, Bundle s) {
                  View root = i.inflate(R.layout.fragment_calls, p, false);
                  RecyclerView rv = root.findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  adapter = new CallHistoryAdapter(getContext(), data, cl -> {
                      String chatKey = FirebaseUtils.chatKey(FirebaseUtils.myUid(), cl.partnerUid);
                      Intent it = new Intent(getActivity(), CallActivity.class);
                      it.putExtra(CallActivity.EXTRA_PEER_UID, cl.partnerUid);
                      it.putExtra(CallActivity.EXTRA_PEER_NAME, cl.partnerName);
                      it.putExtra(CallActivity.EXTRA_IS_CALLER, true);
                      it.putExtra(CallActivity.EXTRA_VIDEO, "video".equals(cl.mediaType));
                      it.putExtra(CallActivity.EXTRA_CALL_ID, "call_" + chatKey + "_" + System.currentTimeMillis());
                      startActivity(it);
                  });
                  rv.setAdapter(adapter);
                  String me = FirebaseUtils.myUid();
                  if (me == null) return root;
                  FirebaseUtils.calls().child(me).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          data.clear();
                          for (DataSnapshot c : d.getChildren()) {
                              CallLog cl = c.getValue(CallLog.class);
                              if (cl != null) { cl.id = c.getKey(); data.add(cl); }
                          }
                          Collections.sort(data, (a, b) -> Long.compare(
                              b.timestamp == null ? 0 : b.timestamp,
                              a.timestamp == null ? 0 : a.timestamp));
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
                  return root;
              }
          }
          ENDOFFILE

