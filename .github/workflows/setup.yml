          package com.callx.app.utils;
          import android.content.Context;
          import android.net.Uri;
          import okhttp3.*;
          import org.json.JSONObject;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.concurrent.TimeUnit;
          public class CloudinaryUploader {
              public interface Callback { void onSuccess(String url); void onError(String msg); }
              public static void upload(Context ctx, Uri uri, String resourceType, Callback cb) {
                  new Thread(() -> {
                      try {
                          OkHttpClient client = new OkHttpClient.Builder()
                              .connectTimeout(60, TimeUnit.SECONDS)
                              .writeTimeout(120, TimeUnit.SECONDS)
                              .readTimeout(120, TimeUnit.SECONDS).build();
                          // Get signature from server
                          Request sigReq = new Request.Builder()
                              .url(Constants.SERVER_URL + "/cloudinary/sign?folder=callx")
                              .build();
                          Response sigRes = client.newCall(sigReq).execute();
                          if (!sigRes.isSuccessful()) { cb.onError("sign failed"); return; }
                          JSONObject sig = new JSONObject(sigRes.body().string());
                          String apiKey = sig.getString("apiKey");
                          String cloud  = sig.getString("cloudName");
                          String ts     = sig.getString("timestamp");
                          String folder = sig.getString("folder");
                          String signature = sig.getString("signature");
                          InputStream is = ctx.getContentResolver().openInputStream(uri);
                          byte[] bytes = readAll(is);
                          MediaType mt = MediaType.parse("application/octet-stream");
                          MultipartBody body = new MultipartBody.Builder()
                              .setType(MultipartBody.FORM)
                              .addFormDataPart("file", "upload", RequestBody.create(bytes, mt))
                              .addFormDataPart("api_key", apiKey)
                              .addFormDataPart("timestamp", ts)
                              .addFormDataPart("folder", folder)
                              .addFormDataPart("signature", signature)
                              .build();
                          Request up = new Request.Builder()
                              .url("https://api.cloudinary.com/v1_1/" + cloud + "/" + resourceType + "/upload")
                              .post(body).build();
                          Response upr = client.newCall(up).execute();
                          if (!upr.isSuccessful()) { cb.onError("upload " + upr.code()); return; }
                          JSONObject ur = new JSONObject(upr.body().string());
                          cb.onSuccess(ur.getString("secure_url"));
                      } catch (Exception e) { cb.onError(e.getMessage()); }
                  }).start();
              }
              private static byte[] readAll(InputStream is) throws IOException {
                  java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                  byte[] b = new byte[8192]; int n;
                  while ((n = is.read(b)) != -1) out.write(b, 0, n);
                  is.close();
                  return out.toByteArray();
              }
          }
          ENDOFFILE

