          import org.webrtc.SurfaceViewRenderer;
          import org.webrtc.VideoTrack;
          import java.util.HashMap;
          import java.util.Map;
          public class CallActivity extends AppCompatActivity {
              public static final String EXTRA_PEER_UID = "peerUid";
              public static final String EXTRA_PEER_NAME = "peerName";
              public static final String EXTRA_IS_CALLER = "isCaller";
              public static final String EXTRA_VIDEO = "video";
              public static final String EXTRA_CALL_ID = "callId";
              private SurfaceViewRenderer remoteRenderer, localRenderer;
              private TextView tvName, tvStatus;
              private ImageButton btnMic, btnSpeaker, btnCam, btnSwitch, btnEnd;
              private boolean micOn = true, speakerOn = false, camOn = true;
              private boolean isCaller, video;
              private String peerUid, peerName, callId;
              private WebRtcManager webrtc;
              private long startTime = 0;
              private AudioManager am;

              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_call);
                  peerUid = getIntent().getStringExtra(EXTRA_PEER_UID);
                  peerName = getIntent().getStringExtra(EXTRA_PEER_NAME);
                  isCaller = getIntent().getBooleanExtra(EXTRA_IS_CALLER, true);
                  video = getIntent().getBooleanExtra(EXTRA_VIDEO, false);
                  callId = getIntent().getStringExtra(EXTRA_CALL_ID);
                  remoteRenderer = findViewById(R.id.remote_video);
                  localRenderer = findViewById(R.id.local_video);
                  tvName = findViewById(R.id.tv_caller_name);
                  tvStatus = findViewById(R.id.tv_call_status);
                  btnMic = findViewById(R.id.btn_toggle_mic);
                  btnSpeaker = findViewById(R.id.btn_toggle_speaker);
                  btnCam = findViewById(R.id.btn_toggle_camera);
                  btnSwitch = findViewById(R.id.btn_camera_switch);
                  btnEnd = findViewById(R.id.btn_end_call);
                  tvName.setText(peerName == null ? "" : peerName);
                  tvStatus.setText(isCaller ? "Calling..." : "Ringing...");
                  am = (AudioManager) getSystemService(AUDIO_SERVICE);
                  am.setMode(AudioManager.MODE_IN_COMMUNICATION);
                  am.setSpeakerphoneOn(false);
                  if (!video) {
                      remoteRenderer.setVisibility(View.GONE);
                      localRenderer.setVisibility(View.GONE);
                      btnCam.setVisibility(View.GONE);
                      btnSwitch.setVisibility(View.GONE);
                      findViewById(R.id.iv_caller_avatar).setVisibility(View.VISIBLE);
                  }
                  webrtc = new WebRtcManager(this, callId, isCaller, video,
                      new WebRtcManager.Listener() {
                          @Override public void onLocalTrack(VideoTrack t) {
                              runOnUiThread(() -> {
                                  if (!video) return;
                                  localRenderer.init(webrtc.eglContext(), null);
                                  localRenderer.setMirror(true);
                                  t.addSink(localRenderer);
                              });
                          }
                          @Override public void onRemoteTrack(VideoTrack t) {
                              runOnUiThread(() -> {
                                  if (!video) return;
                                  remoteRenderer.init(webrtc.eglContext(), null);
                                  t.addSink(remoteRenderer);
                              });
                          }
                          @Override public void onConnected() {
                              runOnUiThread(() -> {
                                  startTime = System.currentTimeMillis();
                                  tvStatus.setText("Connected");
                              });
                          }
                          @Override public void onDisconnected() {
                              runOnUiThread(() -> end(true));
                          }
                          @Override public void onError(String s) {
                              runOnUiThread(() -> { tvStatus.setText("Error"); });
                          }
                      });
                  webrtc.start();
                  bindBtns();
                  if (isCaller) sendInvite();
                  // Foreground service so call survives screen off / app kill
                  Intent svc = new Intent(this, CallForegroundService.class);
                  svc.putExtra("peer", peerName); svc.putExtra("video", video);
                  androidx.core.content.ContextCompat.startForegroundService(this, svc);
              }
              private void bindBtns() {
                  btnMic.setOnClickListener(v -> {
                      micOn = !micOn; webrtc.setMicEnabled(micOn);
                      btnMic.setImageResource(micOn ? R.drawable.ic_mic : R.drawable.ic_mic_off);
                  });
                  btnSpeaker.setOnClickListener(v -> {
                      speakerOn = !speakerOn; am.setSpeakerphoneOn(speakerOn);
                      btnSpeaker.setImageResource(speakerOn ? R.drawable.ic_speaker : R.drawable.ic_speaker_off);
                  });
                  btnCam.setOnClickListener(v -> {
                      camOn = !camOn; webrtc.setCameraEnabled(camOn);
                      btnCam.setImageResource(camOn ? R.drawable.ic_camera : R.drawable.ic_video_off);
                  });
                  btnSwitch.setOnClickListener(v -> webrtc.switchCamera());
                  btnEnd.setOnClickListener(v -> end(false));
              }
              private void sendInvite() {
                  try {
                      JSONObject body = new JSONObject();
                      body.put("toUid", peerUid);
                      body.put("fromUid", FirebaseUtils.myUid());
                      body.put("callId", callId);
                      body.put("video", video);
                      body.put("name", "");
                      body.put("type", "call");
                      PushNotify.send("/notify/call", body);
                  } catch (Exception ignored) {}
              }
              private void end(boolean remote) {
                  try {
                      // Save call log
                      CallLog cl = new CallLog();
                      cl.partnerUid = peerUid; cl.partnerName = peerName;
                      cl.direction = isCaller ? "outgoing" : "incoming";
                      cl.mediaType = video ? "video" : "audio";
                      cl.timestamp = System.currentTimeMillis();
                      cl.duration = startTime > 0 ? (System.currentTimeMillis() - startTime) : 0;
                      String me = FirebaseUtils.myUid();
                      Map<String, Object> m = new HashMap<>();
                      m.put("partnerUid", cl.partnerUid); m.put("partnerName", cl.partnerName);
                      m.put("direction", cl.direction);   m.put("mediaType", cl.mediaType);
                      m.put("timestamp", cl.timestamp);    m.put("duration", cl.duration);
                      FirebaseUtils.calls().child(me).push().setValue(m);
                  } catch (Exception ignored) {}
                  if (webrtc != null) webrtc.close();
                  stopService(new Intent(this, CallForegroundService.class));
                  finish();
              }
              @Override protected void onDestroy() {
                  super.onDestroy();
                  am.setMode(AudioManager.MODE_NORMAL);
                  am.setSpeakerphoneOn(false);
              }
          }
