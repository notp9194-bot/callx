          package com.callx.app.utils;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.database.Cursor;
          import android.media.MediaMetadataRetriever;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import java.io.File;
          import java.io.FileOutputStream;
          public class FileUtils {
              public static String getName(Context c, Uri u) {
                  String name = "file";
                  Cursor cur = c.getContentResolver().query(u, null, null, null, null);
                  if (cur != null) {
                      int i = cur.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                      if (cur.moveToFirst() && i >= 0) name = cur.getString(i);
                      cur.close();
                  }
                  return name;
              }
              public static long getSize(Context c, Uri u) {
                  long size = 0;
                  Cursor cur = c.getContentResolver().query(u, null, null, null, null);
                  if (cur != null) {
                      int i = cur.getColumnIndex(OpenableColumns.SIZE);
                      if (cur.moveToFirst() && i >= 0) size = cur.getLong(i);
                      cur.close();
                  }
                  return size;
              }
              public static long getDurationMs(Context c, Uri u) {
                  try {
                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                      mmr.setDataSource(c, u);
                      String d = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION);
                      mmr.release();
                      return d == null ? 0 : Long.parseLong(d);
                  } catch (Exception e) { return 0; }
              }
              /** Generate a JPEG thumbnail file for a video URI; returns local file URI string. */
              public static Uri makeVideoThumb(Context c, Uri videoUri) {
                  try {
                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                      mmr.setDataSource(c, videoUri);
                      Bitmap bmp = mmr.getFrameAtTime(1_000_000);
                      mmr.release();
                      if (bmp == null) return null;
                      File f = new File(c.getCacheDir(), "thumb_" + System.currentTimeMillis() + ".jpg");
                      FileOutputStream fos = new FileOutputStream(f);
                      bmp.compress(Bitmap.CompressFormat.JPEG, 80, fos);
                      fos.close();
                      return Uri.fromFile(f);
                  } catch (Exception e) { return null; }
              }
              public static String human(long b) {
                  if (b < 1024) return b + " B";
                  if (b < 1024L*1024) return (b / 1024) + " KB";
                  return String.format(java.util.Locale.US, "%.1f MB", b / 1024.0 / 1024.0);
              }
              public static String formatDuration(long ms) {
                  long s = ms / 1000;
                  return String.format(java.util.Locale.US, "%d:%02d", s / 60, s % 60);
              }
          }
