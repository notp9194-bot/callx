          package com.callx.app.utils;
          import android.media.MediaPlayer;
          import android.os.Handler;
          import android.os.Looper;
          public class AudioPlayerHelper {
              public interface Tick { void onTick(int positionMs, int totalMs); }
              private MediaPlayer mp;
              private String currentUrl;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private Runnable ticker;
              public boolean isPlaying(String url) {
                  return mp != null && mp.isPlaying() && url != null && url.equals(currentUrl);
              }
              public int positionFor(String url) {
                  if (mp == null || url == null || !url.equals(currentUrl)) return 0;
                  try { return mp.getCurrentPosition(); } catch (Exception e) { return 0; }
              }
              public void seekTo(String url, int ms) {
                  if (mp != null && url != null && url.equals(currentUrl))
                      try { mp.seekTo(ms); } catch (Exception ignored) {}
              }
              public void toggle(String url, Tick onTick, Runnable onDone) {
                  if (url == null) return;
                  if (mp != null && url.equals(currentUrl)) {
                      if (mp.isPlaying()) { mp.pause(); stopTicker(); }
                      else                { mp.start(); startTicker(onTick, onDone); }
                      return;
                  }
                  release();
                  try {
                      mp = new MediaPlayer();
                      mp.setDataSource(url);
                      currentUrl = url;
                      mp.setOnPreparedListener(p -> { p.start(); startTicker(onTick, onDone); });
                      mp.setOnCompletionListener(p -> { stopTicker(); if (onDone != null) onDone.run(); });
                      mp.prepareAsync();
                  } catch (Exception e) { release(); }
              }
              private void startTicker(final Tick t, final Runnable done) {
                  stopTicker();
                  ticker = new Runnable() {
                      @Override public void run() {
                          if (mp == null) return;
                          try {
                              if (t != null) t.onTick(mp.getCurrentPosition(), mp.getDuration());
                          } catch (Exception ignored) {}
                          if (mp != null && mp.isPlaying()) ui.postDelayed(this, 200);
                      }
                  };
                  ui.post(ticker);
              }
              private void stopTicker() {
                  if (ticker != null) ui.removeCallbacks(ticker);
                  ticker = null;
              }
              public void release() {
                  stopTicker();
                  if (mp != null) {
                      try { mp.stop(); } catch (Exception ignored) {}
                      try { mp.release(); } catch (Exception ignored) {}
                  }
                  mp = null; currentUrl = null;
              }
          }
          ENDOFFILE

          cat > app/src/main/java/com/callx/app/utils/KeyExchangeHelper.java << 'ENDOFFILE'
          package com.callx.app.utils;
          import android.util.Base64;
          import androidx.annotation.NonNull;
          import com.google.firebase.database.*;
          import java.security.*;
          /**
           * Lightweight ECDH-style key exchange using user.publicKey field.
           * Each user generates a key once on signup; chat AES key is derived
           * deterministically from sorted-uid pair fingerprint as a fallback.
           */
          public class KeyExchangeHelper {
              public interface Cb { void onKey(String aesKey); }
              public static void ensureMyKey(final Runnable done) {
                  String me = FirebaseUtils.myUid();
                  if (me == null) { if (done != null) done.run(); return; }
                  final DatabaseReference ref = FirebaseUtils.users().child(me).child("publicKey");
                  ref.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot d) {
                          if (!d.exists()) {
                              try {
                                  KeyPairGenerator kpg = KeyPairGenerator.getInstance("EC");
                                  kpg.initialize(256);
                                  KeyPair kp = kpg.generateKeyPair();
                                  String pub = Base64.encodeToString(
                                      kp.getPublic().getEncoded(), Base64.NO_WRAP);
                                  ref.setValue(pub);
                                  PrefsManager.saveMyPriv(Base64.encodeToString(
                                      kp.getPrivate().getEncoded(), Base64.NO_WRAP));
                              } catch (Exception ignored) {}
                          }
                          if (done != null) done.run();
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {
                          if (done != null) done.run();
                      }
                  });
              }
              public static void deriveChatKey(final String otherUid, final Cb cb) {
                  final String me = FirebaseUtils.myUid();
                  if (me == null || otherUid == null) { cb.onKey(null); return; }
                  FirebaseUtils.users().child(otherUid).child("publicKey")
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot d) {
                              String otherPub = d.getValue(String.class);
                              cb.onKey(combine(me, otherUid, otherPub));
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {
                              cb.onKey(combine(me, otherUid, null));
                          }
                      });
              }
              private static String combine(String me, String other, String otherPub) {
                  // Deterministic AES key for the chat (lower entropy fallback if pub absent)
                  String a = me.compareTo(other) < 0 ? me : other;
                  String b = me.compareTo(other) < 0 ? other : me;
                  String seed = a + "::" + b + "::" + (otherPub == null ? "0" : otherPub);
                  try {
                      byte[] h = MessageDigest.getInstance("SHA-256").digest(seed.getBytes("UTF-8"));
                      // Use first 16 bytes -> AES-128 hex string (compatible with AesCrypto)
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < 16; i++) sb.append(String.format("%02x", h[i]));
                      return sb.toString();
                  } catch (Exception e) { return null; }
              }
          }
          ENDOFFILE

