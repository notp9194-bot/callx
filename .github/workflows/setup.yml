          # ============================================================
          cat > app/src/main/java/com/callx/app/services/CallxMessagingService.java << 'ENDOFFILE'
          package com.callx.app.services;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.callx.app.R;
          import com.callx.app.activities.IncomingCallActivity;
          import com.callx.app.activities.MainActivity;
          import com.callx.app.utils.Constants;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;
          import java.util.Random;
          public class CallxMessagingService extends FirebaseMessagingService {
              @Override public void onNewToken(String token) {
                  if (FirebaseAuth.getInstance().getCurrentUser() == null) return;
                  String uid = FirebaseAuth.getInstance().getCurrentUser().getUid();
                  FirebaseUtils.getUserRef(uid).child("fcmToken").setValue(token);
              }
              @Override public void onMessageReceived(RemoteMessage msg) {
                  Map<String, String> data = msg.getData();
                  String type = data.getOrDefault("type", "message");
                  if ("call".equals(type) || "video_call".equals(type)) {
                      showIncomingCall(data, "video_call".equals(type));
                  } else if ("group_message".equals(type)) {
                      showGroupMessage(data);
                  } else if ("status".equals(type)) {
                      showStatus(data);
                  } else if ("request".equals(type)) {
                      // Request system hata diya gaya hai — kuch mat karo
                  } else {
                      showMessage(data);
                  }
              }
              private void showRequest(Map<String, String> data) {
                  String fromUid  = data.getOrDefault("fromUid", "");
                  String fromName = data.getOrDefault("fromName", "Friend");
                  // App khuli ho ya killed ho — dono case me bottom popup activity launch karo
                  Intent popup = new Intent(this, com.callx.app.activities.RequestPopupActivity.class);
                  popup.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                      | Intent.FLAG_ACTIVITY_CLEAR_TOP
                      | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  popup.putExtra("fromUid", fromUid);
                  popup.putExtra("fromName", fromName);
                  // Notification bhi dikhao taaki status bar me trace rahe
                  PendingIntent pi = PendingIntent.getActivity(this, 0, popup,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this,
                          Constants.CHANNEL_REQUESTS)
                      .setSmallIcon(R.drawable.ic_person_add)
                      .setContentTitle(fromName)
                      .setContentText("Aapko contact request bheji hai")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setFullScreenIntent(pi, true)
                      .setContentIntent(pi);
                  NotificationManager nm = (NotificationManager)
                      getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(new Random().nextInt(99999), b.build());
                  // Popup bhi turant launch karo
                  try { startActivity(popup); } catch (Exception ignored) {}
              }
              private void showIncomingCall(Map<String, String> data, boolean isVideo) {
                  Intent full = new Intent(this, IncomingCallActivity.class);
                  full.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  full.putExtra("callId", data.get("text"));
                  full.putExtra("fromUid", data.get("fromUid"));
                  full.putExtra("fromName", data.get("fromName"));
                  full.putExtra("video", isVideo);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      // Show full-screen via PendingIntent
                      PendingIntent pi = PendingIntent.getActivity(this, 0, full,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      NotificationCompat.Builder b = new NotificationCompat.Builder(this,
                              Constants.CHANNEL_CALLS)
                          .setSmallIcon(R.drawable.ic_phone)
                          .setContentTitle(data.getOrDefault("fromName", "Incoming"))
                          .setContentText(isVideo ? "Video CallX..." : "CallX...")
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setFullScreenIntent(pi, true)
                          .setOngoing(true)
                          .setAutoCancel(true);
                      NotificationManager nm = (NotificationManager)
                          getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.notify(1001, b.build());
                  } else {
                      startActivity(full);
                  }
              }
              private void showMessage(Map<String, String> data) {
                  String title = data.getOrDefault("fromName", "CallX");
                  String body  = data.getOrDefault("text", "Naya message");
                  Intent i = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this,
                          Constants.CHANNEL_MESSAGES)
                      .setSmallIcon(R.drawable.ic_message_notification)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pi);
                  NotificationManager nm = (NotificationManager)
                      getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(new Random().nextInt(99999), b.build());
              }
              private void showGroupMessage(Map<String, String> data) {
                  String title = data.getOrDefault("fromName", "Group");
                  String body  = data.getOrDefault("text", "Naya group message");
                  Intent i = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this,
                          Constants.CHANNEL_GROUPS)
                      .setSmallIcon(R.drawable.ic_group)
                      .setContentTitle(title + " (group)")
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pi);
                  NotificationManager nm = (NotificationManager)
                      getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(new Random().nextInt(99999), b.build());
              }
              private void showStatus(Map<String, String> data) {
                  String name = data.getOrDefault("fromName", "Friend");
                  Intent i = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this,
                          Constants.CHANNEL_STATUS)
                      .setSmallIcon(R.drawable.ic_status_notification)
                      .setContentTitle(name)
                      .setContentText("Naya status post kiya")
                      .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                      .setAutoCancel(true)
                      .setContentIntent(pi);
                  NotificationManager nm = (NotificationManager)
                      getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(new Random().nextInt(99999), b.build());
              }
          }
          ENDOFFILE

          # ============================================================
          # SERVER — Render Node.js (FCM + Cloudinary signing)
          # ============================================================
          mkdir -p server
          cat > server/package.json << 'ENDOFFILE'
          {
            "name": "callx-server",
            "version": "2.0.0",
            "main": "index.js",
            "scripts": { "start": "node index.js" },
            "engines": { "node": "20.x" },
            "dependencies": {
              "express": "^4.19.2",
              "firebase-admin": "^12.1.0",
              "cors": "^2.8.5",
              "morgan": "^1.10.0"
            }
          }
          ENDOFFILE

          cat > server/.gitignore << 'ENDOFFILE'
          node_modules
          .env
          serviceAccount.json
          ENDOFFILE

          cat > server/render.yaml << 'ENDOFFILE'
          services:
            - type: web
              name: callx-server
              env: node
              plan: free
              buildCommand: npm install
              startCommand: npm start
              envVars:
                - key: FIREBASE_SERVICE_ACCOUNT
                  sync: false
                - key: CLOUDINARY_CLOUD_NAME
                  value: dvqqgqdls
                - key: CLOUDINARY_API_KEY
                  sync: false
                - key: CLOUDINARY_API_SECRET
                  sync: false
                - key: DB_URL
                  value: https://sathix-97a76-default-rtdb.asia-southeast1.firebasedatabase.app
          ENDOFFILE

          cat > server/index.js << 'ENDOFFILE'
          const express = require("express");
          const cors    = require("cors");
          const morgan  = require("morgan");
          const crypto  = require("crypto");
          const admin   = require("firebase-admin");

          const app = express();
          app.use(cors());
          app.use(express.json({ limit: "2mb" }));
          app.use(morgan("tiny"));

          // ---- Firebase Admin init ----
          let firebaseReady = false;
          try {
            const sa = process.env.FIREBASE_SERVICE_ACCOUNT;
            if (sa) {
              const creds = JSON.parse(sa);
              admin.initializeApp({
                credential: admin.credential.cert(creds),
                databaseURL: process.env.DB_URL ||
                  "https://sathix-97a76-default-rtdb.asia-southeast1.firebasedatabase.app"
              });
              firebaseReady = true;
              console.log("[OK] Firebase Admin initialized");
            } else {
              console.warn("[WARN] FIREBASE_SERVICE_ACCOUNT missing");
            }
          } catch (e) {
            console.error("[ERR] Firebase init failed:", e.message);
          }

          const CLOUD_NAME = process.env.CLOUDINARY_CLOUD_NAME || "dvqqgqdls";
          const CLOUD_KEY  = process.env.CLOUDINARY_API_KEY;
          const CLOUD_SEC  = process.env.CLOUDINARY_API_SECRET;
          const cloudReady = !!(CLOUD_KEY && CLOUD_SEC);
          if (!cloudReady) console.warn("[WARN] CLOUDINARY_API_KEY/SECRET missing");

          app.get("/", (req, res) => res.json({
            ok: true,
            service: "callx-server v2",
            firebaseReady,
            cloudReady,
            cloudName: CLOUD_NAME
          }));
          app.get("/healthz", (req, res) =>
            res.json({ ok: true, firebaseReady, cloudReady }));

          // ---- Cloudinary signed upload ----
          app.post("/cloudinary/sign", (req, res) => {
            if (!cloudReady) {
              return res.status(503).json({
                error: "Cloudinary not configured",
                hint: "Render dashboard pe CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET set karo"
              });
            }
            const folder       = (req.body && req.body.folder) || "callx";
            const resourceType = (req.body && req.body.resource_type) || "auto";
            const timestamp    = Math.floor(Date.now() / 1000).toString();
            // Cloudinary signature: alphabetical params (folder + timestamp) + secret
            const toSign = `folder=${folder}&timestamp=${timestamp}`;
            const signature = crypto.createHash("sha1")
              .update(toSign + CLOUD_SEC).digest("hex");
            res.json({
              signature, timestamp,
              api_key: CLOUD_KEY,
              cloud_name: CLOUD_NAME,
              folder, resource_type: resourceType
            });
          });

          // ---- Notify single user ----
          app.post("/notify", async (req, res) => {
            if (!firebaseReady)
              return res.status(503).json({ error: "Firebase not configured" });
            const { toUid, fromUid, fromName, type, text } = req.body || {};
            if (!toUid) return res.status(400).json({ error: "toUid required" });
            try {
              const snap = await admin.database().ref("users/" + toUid).once("value");
              const user = snap.val() || {};
              if (!user.fcmToken)
                return res.status(404).json({ error: "no token" });
              const message = {
                token: user.fcmToken,
                data: {
                  type:     String(type || "message"),
                  fromUid:  String(fromUid || ""),
                  fromName: String(fromName || ""),
                  text:     String(text || "")
                },
                android: { priority: "high" }
              };
              const r = await admin.messaging().send(message);
              res.json({ ok: true, id: r });
            } catch (e) {
              console.error("notify err:", e.message);
              res.status(500).json({ error: e.message });
            }
          });

          // ---- Notify group (fanout to all members except sender) ----
          app.post("/notify/group", async (req, res) => {
            if (!firebaseReady)
              return res.status(503).json({ error: "Firebase not configured" });
            const { groupId, fromUid, fromName, type, text } = req.body || {};
            if (!groupId) return res.status(400).json({ error: "groupId required" });
            try {
              const gSnap = await admin.database()
                .ref("groups/" + groupId).once("value");
              const g = gSnap.val();
              if (!g) return res.status(404).json({ error: "group not found" });
              const memberUids = Object.keys(g.members || {})
                .filter(uid => uid !== fromUid);
              const tokens = [];
              for (const uid of memberUids) {
                const us = await admin.database().ref("users/" + uid).once("value");
                const t = us.val() && us.val().fcmToken;
                if (t) tokens.push(t);
              }
              if (!tokens.length) return res.json({ ok: true, sent: 0 });
              const responses = [];
              for (const tk of tokens) {
                try {
                  const r = await admin.messaging().send({
                    token: tk,
                    data: {
                      type:     String(type || "group_message"),
                      groupId:  String(groupId),
                      fromUid:  String(fromUid || ""),
                      fromName: String((g.name || "Group") + " • " + (fromName || "")),
                      text:     String(text || "")
                    },
                    android: { priority: "high" }
                  });
                  responses.push(r);
                } catch (e) {
                  console.warn("group send fail:", e.message);
                }
              }
              res.json({ ok: true, sent: responses.length });
            } catch (e) {
              console.error("group notify err:", e.message);
              res.status(500).json({ error: e.message });
            }
          });

          // ---- Notify status (fanout to all contacts of poster) ----
          app.post("/notify/status", async (req, res) => {
            if (!firebaseReady)
              return res.status(503).json({ error: "Firebase not configured" });
            const { fromUid, fromName } = req.body || {};
            if (!fromUid) return res.status(400).json({ error: "fromUid required" });
            try {
              const cSnap = await admin.database()
                .ref("contacts/" + fromUid).once("value");
              const contacts = cSnap.val() || {};
              const uids = Object.keys(contacts);
              const tokens = [];
              for (const uid of uids) {
                const us = await admin.database().ref("users/" + uid).once("value");
                const t = us.val() && us.val().fcmToken;
                if (t) tokens.push(t);
              }
              if (!tokens.length) return res.json({ ok: true, sent: 0 });
              let sent = 0;
              for (const tk of tokens) {
                try {
                  await admin.messaging().send({
                    token: tk,
                    data: {
                      type:     "status",
                      fromUid:  String(fromUid),
                      fromName: String(fromName || "Friend"),
                      text:     "Naya status post kiya"
                    },
                    android: { priority: "high" }
                  });
                  sent++;
                } catch (e) {
                  console.warn("status send fail:", e.message);
                }
              }
              res.json({ ok: true, sent });
            } catch (e) {
              res.status(500).json({ error: e.message });
            }
          });

          const PORT = process.env.PORT || 3000;
          app.listen(PORT, () => console.log("callx-server v2 on :" + PORT));
          ENDOFFILE

          cat > server/README.md << 'ENDOFFILE'
          # CallX Server v2

          Production-grade Node.js backend for CallX Android app.

          ## Endpoints
          - `GET /healthz` — health check
          - `POST /cloudinary/sign` — signed direct uploads (resource_type aware)
          - `POST /notify` — push to single user (calls / messages)
          - `POST /notify/group` — fanout push to group members
          - `POST /notify/status` — fanout push to all contacts when posting status

          ## Render env vars (Free plan)
          - `FIREBASE_SERVICE_ACCOUNT` — full JSON of Firebase admin service account (one line)
          - `CLOUDINARY_CLOUD_NAME` = `dvqqgqdls`
          - `CLOUDINARY_API_KEY` — from Cloudinary console
          - `CLOUDINARY_API_SECRET` — from Cloudinary console
          - `DB_URL` = `https://sathix-97a76-default-rtdb.asia-southeast1.firebasedatabase.app`

          ## 503 image upload fix
          Yeh server ab `resource_type` (image / video / raw) ko sahi handle karta hai
          aur Cloudinary missing config par clear error deta hai.
          ENDOFFILE

