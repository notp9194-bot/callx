                      uid -> FirebaseUtils.groups().child(gid).child("members").child(uid).removeValue());
                  rv.setAdapter(adapter);
                  findViewById(R.id.btn_change_icon).setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("image/*");
                      startActivityForResult(i, 1);
                  });
                  findViewById(R.id.btn_save).setOnClickListener(v -> save());
                  findViewById(R.id.btn_invite_link).setOnClickListener(v -> shareInvite());
                  findViewById(R.id.btn_add_member).setOnClickListener(v -> {
                      Intent i = new Intent(this, NewGroupActivity.class);
                      i.putExtra("addToGid", gid); startActivity(i);
                  });
                  findViewById(R.id.btn_exit).setOnClickListener(v -> {
                      FirebaseUtils.groups().child(gid).child("members")
                          .child(FirebaseUtils.myUid()).removeValue();
                      finish();
                  });
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  load();
              }
              private void load() {
                  FirebaseUtils.groups().child(gid).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          etName.setText(String.valueOf(d.child("name").getValue()));
                          iconUrl = (String) d.child("iconUrl").getValue();
                          if (iconUrl != null && !iconUrl.isEmpty())
                              Glide.with(GroupInfoActivity.this).load(iconUrl).into(iv);
                          members.clear(); admins.clear();
                          for (DataSnapshot c : d.child("members").getChildren()) members.add(c.getKey());
                          for (DataSnapshot c : d.child("admins").getChildren()) admins.add(c.getKey());
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
              private void save() {
                  Map<String,Object> u = new HashMap<>();
                  u.put("name", etName.getText().toString().trim());
                  if (iconUrl != null) u.put("iconUrl", iconUrl);
                  FirebaseUtils.groups().child(gid).updateChildren(u);
                  Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show();
              }
              private void shareInvite() {
                  String code = "g_" + gid.substring(0, Math.min(8, gid.length()));
                  FirebaseUtils.groups().child(gid).child("inviteCode").setValue(code);
                  FirebaseUtils.invites().child(code).setValue(gid);
                  String msg = "Join my group on CallX: callx://join?code=" + code;
                  Intent i = new Intent(Intent.ACTION_SEND); i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TEXT, msg);
                  startActivity(Intent.createChooser(i, "Share invite"));
              }
              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (res != Activity.RESULT_OK || d == null || d.getData() == null) return;
                  CloudinaryUploader.upload(this, d.getData(), "image", new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          iconUrl = url;
                          runOnUiThread(() -> Glide.with(GroupInfoActivity.this).load(url).into(iv));
                      }
                      @Override public void onError(String s) {}
                  });
              }
          }
