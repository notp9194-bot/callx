                  if (v == null || v.trim().isEmpty()) sp.edit().remove("draft_" + chatKey).apply();
                  else sp.edit().putString("draft_" + chatKey, v).apply();
              }
              // NEW: pinned chats
              public static boolean isChatPinned(String chatKey) { return sp.getBoolean("pin_" + chatKey, false); }
              public static void setChatPinned(String chatKey, boolean v) { sp.edit().putBoolean("pin_" + chatKey, v).apply(); }
              // NEW: hidden-for-me messages (used to also hide on multi-device)
              public static boolean isHiddenForMe(String msgId) { return sp.getBoolean("hidden_" + msgId, false); }
              public static void setHiddenForMe(String msgId, boolean v) { sp.edit().putBoolean("hidden_" + msgId, v).apply(); }
              // NEW: AES key version (rotation)
              public static int keyVersion(String chatKey) { return sp.getInt("kv_" + chatKey, 1); }
              public static void incrementKeyVersion(String chatKey) {
                  sp.edit().putInt("kv_" + chatKey, keyVersion(chatKey) + 1).apply();
