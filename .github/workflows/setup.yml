              public static void setAppLock(boolean v) { sp.edit().putBoolean("app_lock", v).apply(); }
              public static boolean readReceiptsEnabled() { return sp.getBoolean("read_receipts", true); }
              public static void setReadReceipts(boolean v) { sp.edit().putBoolean("read_receipts", v).apply(); }
              public static boolean lastSeenEnabled() { return sp.getBoolean("last_seen", true); }
              public static void setLastSeen(boolean v) { sp.edit().putBoolean("last_seen", v).apply(); }
              public static int wallpaperFor(String chatKey) { return sp.getInt("wp_" + chatKey, 0); }
              public static void setWallpaper(String chatKey, int v) { sp.edit().putInt("wp_" + chatKey, v).apply(); }
              public static long disappearFor(String chatKey) { return sp.getLong("dis_" + chatKey, 0); }
              public static void setDisappear(String chatKey, long ms) { sp.edit().putLong("dis_" + chatKey, ms).apply(); }
              public static boolean isMuted(String chatKey) { return sp.getBoolean("mute_" + chatKey, false); }
              public static void setMuted(String chatKey, boolean v) { sp.edit().putBoolean("mute_" + chatKey, v).apply(); }
              public static boolean isArchived(String chatKey) { return sp.getBoolean("arc_" + chatKey, false); }
              public static void setArchived(String chatKey, boolean v) { sp.edit().putBoolean("arc_" + chatKey, v).apply(); }
