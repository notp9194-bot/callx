          package com.callx.app.utils;
          import android.content.Context;
          import androidx.annotation.NonNull;
          import androidx.work.*;
          import com.google.firebase.database.*;
          import java.util.concurrent.TimeUnit;
          /** Periodically removes expired disappearing messages from Firebase. */
          public class DisappearWorker extends Worker {
              public DisappearWorker(@NonNull Context c, @NonNull WorkerParameters p) { super(c, p); }
              @NonNull @Override public Result doWork() {
                  final long now = System.currentTimeMillis();
                  String me = FirebaseUtils.myUid(); if (me == null) return Result.success();
                  // Sweep 1:1 chats
                  FirebaseUtils.chats().get().addOnSuccessListener(snap -> {
                      for (DataSnapshot chat : snap.getChildren()) {
                          if (!chat.getKey().contains(me)) continue;
                          for (DataSnapshot m : chat.getChildren()) {
                              Long exp = m.child("expiresAt").getValue(Long.class);
                              if (exp != null && exp > 0 && exp < now) {
                                  m.getRef().updateChildren(new java.util.HashMap<String, Object>() {{
                                      put("deletedForAll", true); put("text", null);
                                      put("encrypted", null); put("mediaUrl", null);
                                  }});
                              }
                          }
                      }
                  });
                  PrefsManager.setLastDisappearRun(now);
                  return Result.success();
              }
              public static void schedule(Context c) {
                  PeriodicWorkRequest r = new PeriodicWorkRequest.Builder(
                      DisappearWorker.class, 1, TimeUnit.HOURS)
                      .setConstraints(new Constraints.Builder()
                          .setRequiredNetworkType(NetworkType.CONNECTED).build())
                      .build();
                  WorkManager.getInstance(c).enqueueUniquePeriodicWork(
                      "callx-disappear", ExistingPeriodicWorkPolicy.KEEP, r);
              }
          }
          ENDOFFILE

