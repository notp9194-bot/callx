              private String pickedMime;
              private void pick(String mime) {
                  pickedMime = mime;
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(mime);
                  startActivityForResult(i, 1);
              }
              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (res != Activity.RESULT_OK || d == null) return;
                  if (rc == 5) {
                      String sid = d.getStringExtra("stickerId");
                      Message m = baseMsg("sticker"); m.stickerId = sid;
                      push(m); return;
                  }
                  Uri u = d.getData(); if (u == null) return;
                  String type = pickedMime.startsWith("image") ? "image"
                      : pickedMime.startsWith("video") ? "video"
                      : pickedMime.startsWith("audio") ? "audio" : "file";
                  if ("image".equals(type)) u = ImageCompressor.compress(this, u);
                  String name = FileUtils.getName(this, u);
                  long size = FileUtils.getSize(this, u);
                  long dur  = "video".equals(type) || "audio".equals(type) ? FileUtils.getDurationMs(this, u) : 0;
                  Uri thumb = "video".equals(type) ? FileUtils.makeVideoThumb(this, u) : null;
                  String resType = "file".equals(type) ? "raw" : ("audio".equals(type) ? "video" : "auto");
                  CloudinaryUploader.upload(this, u, resType, new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          runOnUiThread(() -> {
                              Message m = baseMsg(type); m.mediaUrl = url;
                              m.duration = dur; m.fileName = name; m.fileSize = size;
                              if (thumb != null) {
                                  CloudinaryUploader.upload(GroupChatActivity.this, thumb, "image",
                                      new CloudinaryUploader.Callback() {
                                          @Override public void onSuccess(String tu) { m.thumbnailUrl = tu; push(m); }
                                          @Override public void onError(String s) { push(m); }
                                      });
                              } else push(m);
                          });
                      }
                      @Override public void onError(String s) {}
                  });
              }
              private void toggleRecord() {
                  if (!recording) {
                      try { recorder.start(this); recording = true; } catch (Exception e) {}
                  } else {
                      java.io.File f = recorder.stop(); recording = false;
                      if (f != null) {
                          long dur = FileUtils.getDurationMs(this, Uri.fromFile(f));
                          CloudinaryUploader.upload(this, Uri.fromFile(f), "video",
                              new CloudinaryUploader.Callback() {
                                  @Override public void onSuccess(String url) {
                                      runOnUiThread(() -> {
                                          Message m = baseMsg("audio"); m.mediaUrl = url; m.duration = dur;
                                          push(m);
                                      });
                                  }
                                  @Override public void onError(String s) {}
                              });
                      }
                  }
              }
