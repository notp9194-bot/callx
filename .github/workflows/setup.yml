                  swRR.setChecked(PrefsManager.readReceiptsEnabled());
                  swLS.setChecked(PrefsManager.lastSeenEnabled());
                  swLock.setOnCheckedChangeListener((b, v) -> PrefsManager.setAppLock(v));
                  swRR.setOnCheckedChangeListener((b, v) -> PrefsManager.setReadReceipts(v));
                  swLS.setOnCheckedChangeListener((b, v) -> PrefsManager.setLastSeen(v));
