                  edit.setVisibility(mine && "text".equals(m.type) ? View.VISIBLE : View.GONE);
                  delAll.setVisibility(mine ? View.VISIBLE : View.GONE);
                  edit.setOnClickListener(x -> { startEdit(m); d.dismiss(); });
                  v.findViewById(R.id.opt_delete_me).setOnClickListener(x -> { hideForMe(m); d.dismiss(); });
                  delAll.setOnClickListener(x -> { deleteForAll(m); d.dismiss(); });
                  v.findViewById(R.id.opt_info).setOnClickListener(x -> {
                      Intent i = new Intent(this, MessageInfoActivity.class);
                      i.putExtra("chatKey", chatKey); i.putExtra("msgId", m.id);
                      startActivity(i); d.dismiss();
                  });
                  View pin = v.findViewById(R.id.opt_pin);
                  if (pin != null) {
                      pin.setOnClickListener(x -> { togglePin(m); d.dismiss(); });
                  }
                  View sched = v.findViewById(R.id.opt_select);
                  if (sched != null) sched.setOnClickListener(x -> {
                      adapter.enterSelectionMode(m.id); enterSelect(); d.dismiss();
                  });
                  d.show();
              }
              private void addReaction(Message m, String emoji) { toggleReaction(m, emoji); }
              private void toggleReaction(Message m, String emoji) {
                  String me = FirebaseUtils.myUid();
                  if (m.id == null || me == null) return;
                  DatabaseReference r = msgRef.child(m.id).child("reactions").child(emoji).child(me);
                  r.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          if (s.exists()) r.removeValue();
                          else r.setValue(System.currentTimeMillis());
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
              private void showReactionDetails(Message m) {
                  if (m.reactions == null) return;
                  List<ReactionDetailAdapter.Row> rows = new ArrayList<>();
                  for (Map.Entry<String, Map<String, Long>> e : m.reactions.entrySet()) {
                      if (e.getValue() == null) continue;
                      for (String uid : e.getValue().keySet()) {
                          rows.add(new ReactionDetailAdapter.Row(uid, "", e.getKey()));
                      }
                  }
                  // resolve names
                  for (ReactionDetailAdapter.Row r : rows) {
                      FirebaseUtils.users().child(r.name).child("name")
                          .addListenerForSingleValueEvent(new ValueEventListener() {
                              @Override public void onDataChange(@NonNull DataSnapshot s) {
                                  String n = s.getValue(String.class);
                                  if (n != null) r.name = n;
                              }
                              @Override public void onCancelled(@NonNull DatabaseError e) {}
                          });
                  }
                  BottomSheetDialog bsd = new BottomSheetDialog(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.dialog_reaction_details, null);
                  RecyclerView rvr = v.findViewById(R.id.rv);
                  rvr.setLayoutManager(new LinearLayoutManager(this));
                  rvr.setAdapter(new ReactionDetailAdapter(this, rows));
                  bsd.setContentView(v); bsd.show();
              }
              private void startReply(Message m) {
                  replyTo = m;
                  llReplyPreview.setVisibility(View.VISIBLE);
                  tvReplyToName.setText(m.senderName == null ? "" : m.senderName);
                  tvReplyToText.setText(m.text == null ? ("[" + m.type + "]") : m.text);
              }
              private void startEdit(Message m) {
                  editing = m;
                  llEditPreview.setVisibility(View.VISIBLE);
                  tvEditText.setText(m.text == null ? "" : m.text);
                  etMessage.setText(m.text == null ? "" : m.text);
                  etMessage.setSelection(etMessage.getText().length());
              }
              private void applyEdit(Message m, String newText) {
                  Map<String, Object> u = new HashMap<>();
                  u.put("encrypted", chatAesKey == null ? null : AesCrypto.encrypt(newText, chatAesKey));
                  u.put("text", chatAesKey == null ? newText : null);
                  u.put("edited", true);
                  msgRef.child(m.id).updateChildren(u);
                  editing = null; llEditPreview.setVisibility(View.GONE); etMessage.setText("");
              }
              private void hideForMe(Message m) {
                  PrefsManager.setHiddenForMe(m.id, true);
                  for (int i = 0; i < messages.size(); i++)
                      if (messages.get(i).id.equals(m.id)) {
                          messages.remove(i); adapter.notifyItemRemoved(i); break;
                      }
              }
              private void deleteForAll(Message m) {
                  Map<String, Object> u = new HashMap<>();
                  u.put("deletedForAll", true);
                  u.put("text", null); u.put("encrypted", null);
                  u.put("mediaUrl", null); u.put("thumbnailUrl", null);
                  msgRef.child(m.id).updateChildren(u);
              }
              private void toggleStar(Message m) {
                  String me = FirebaseUtils.myUid();
                  DatabaseReference s = FirebaseUtils.starred().child(me).child(m.id);
                  s.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot d) {
                          if (d.exists()) s.removeValue();
                          else {
                              Map<String,Object> mp = new HashMap<>();
                              mp.put("chatKey", chatKey); mp.put("at", System.currentTimeMillis());
                              mp.put("preview", m.text != null ? m.text : "[" + m.type + "]");
                              s.setValue(mp);
                          }
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
              private void forward(Message m) {
                  Intent i = new Intent(this, ForwardActivity.class);
                  i.putExtra("text", m.text); i.putExtra("type", m.type);
                  i.putExtra("mediaUrl", m.mediaUrl);
                  startActivity(i);
              }
              // ================= PINNED =================
              private void togglePin(Message m) {
                  if (Boolean.TRUE.equals(m.pinned)) {
                      Map<String, Object> u = new HashMap<>();
                      u.put("pinned", false); u.put("pinnedAt", null); u.put("pinnedBy", null);
                      msgRef.child(m.id).updateChildren(u);
                      FirebaseUtils.chats().child(chatKey).child("_meta").child("pinnedIds").child(m.id).removeValue();
                  } else {
                      Map<String, Object> u = new HashMap<>();
                      u.put("pinned", true); u.put("pinnedAt", System.currentTimeMillis());
                      u.put("pinnedBy", FirebaseUtils.myUid());
                      msgRef.child(m.id).updateChildren(u);
                      FirebaseUtils.chats().child(chatKey).child("_meta").child("pinnedIds").child(m.id)
                          .setValue(System.currentTimeMillis());
                  }
              }
              private void watchPinned() {
                  pinRef = FirebaseUtils.chats().child(chatKey).child("_meta").child("pinnedIds");
                  pinListener = new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          if (!s.exists() || s.getChildrenCount() == 0) {
                              llPinnedBar.setVisibility(View.GONE); return;
                          }
                          // Show most recent pinned
                          String latestId = null; long latest = 0;
                          for (DataSnapshot c : s.getChildren()) {
                              Long at = c.getValue(Long.class);
                              if (at != null && at > latest) { latest = at; latestId = c.getKey(); }
                          }
                          if (latestId == null) { llPinnedBar.setVisibility(View.GONE); return; }
                          final String pid = latestId;
                          msgRef.child(pid).addListenerForSingleValueEvent(new ValueEventListener() {
                              @Override public void onDataChange(@NonNull DataSnapshot ds) {
                                  Message pm = parse(ds);
                                  if (pm == null) { llPinnedBar.setVisibility(View.GONE); return; }
                                  llPinnedBar.setVisibility(View.VISIBLE);
                                  tvPinned.setText("📌 " +
                                      (pm.text != null ? pm.text : "[" + pm.type + "]"));
                                  llPinnedBar.setOnClickListener(v -> jumpToMessage(pid));
                              }
                              @Override public void onCancelled(@NonNull DatabaseError e) {}
                          });
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  pinRef.addValueEventListener(pinListener);
              }
              private void jumpToMessage(String id) {
                  if (id == null) return;
                  for (int i = 0; i < messages.size(); i++) {
                      if (id.equals(messages.get(i).id)) {
                          rv.smoothScrollToPosition(i);
                          adapter.highlightOnce(id);
                          return;
                      }
                  }
                  Toast.makeText(this, "Loading older messages…", Toast.LENGTH_SHORT).show();
              }
              // ================= SELECTION MODE =================
              private void enterSelect() { llSelectBar.setVisibility(View.VISIBLE); }
              private void exitSelect() { llSelectBar.setVisibility(View.GONE); adapter.exitSelectionMode(); }
              private void bulkDelete() {
                  for (String id : adapter.getSelected()) {
                      Message m = findById(id);
                      if (m != null && m.senderId != null && m.senderId.equals(FirebaseUtils.myUid()))
                          deleteForAll(m);
                      else if (m != null) hideForMe(m);
                  }
                  exitSelect();
              }
              private void bulkForward() {
                  StringBuilder concat = new StringBuilder();
                  for (String id : adapter.getSelected()) {
                      Message m = findById(id);
                      if (m != null && m.text != null) concat.append(m.text).append("\n");
                  }
                  Intent i = new Intent(this, ForwardActivity.class);
                  i.putExtra("text", concat.toString()); i.putExtra("type", "text");
                  startActivity(i); exitSelect();
              }
              private void bulkStar() {
                  for (String id : adapter.getSelected()) {
                      Message m = findById(id);
                      if (m != null) toggleStar(m);
                  }
                  exitSelect();
              }
              private Message findById(String id) {
                  for (Message m : messages) if (id.equals(m.id)) return m;
                  return null;
              }
              // ================= AUDIO RECORD =================
              private void toggleRecord() {
                  if (!recording) {
                      try { recorder.start(this); recording = true;
                          Toast.makeText(this, "Recording...", Toast.LENGTH_SHORT).show(); }
                      catch (Exception e) { Toast.makeText(this, "Mic error", Toast.LENGTH_SHORT).show(); }
                  } else {
                      java.io.File f = recorder.stop(); recording = false;
                      if (f != null && f.exists()) {
                          long dur = FileUtils.getDurationMs(this, Uri.fromFile(f));
                          CloudinaryUploader.upload(this, Uri.fromFile(f), "video", new CloudinaryUploader.Callback() {
                              @Override public void onSuccess(String url) {
                                  runOnUiThread(() -> {
                                      Message m = newMessageBase("audio");
                                      m.mediaUrl = url; m.duration = dur;
                                      pushMessage(m);
                                  });
                              }
                              @Override public void onError(String s) {}
                          });
                      }
                  }
              }
              // ================= PRESENCE / TYPING / BLOCK =================
              private void watchPresenceAndTyping() {
                  presenceRef = FirebaseUtils.presence().child(otherUid);
                  presenceListener = new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          Boolean on = s.child("online").getValue(Boolean.class);
                          Long at = s.child("at").getValue(Long.class);
                          otherOnline = Boolean.TRUE.equals(on);
                          otherLastSeen = at == null ? 0 : at;
                          updateSubtitle();
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  presenceRef.addValueEventListener(presenceListener);
                  typingRef = FirebaseUtils.typing().child(chatKey).child(otherUid);
                  typingListener = new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          otherTyping = s.exists();
                          updateSubtitle();
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  typingRef.addValueEventListener(typingListener);
              }
              private void updateSubtitle() {
                  String sub;
                  if (otherTyping) sub = getString(R.string.typing);
                  else if (otherOnline) sub = getString(R.string.online);
                  else sub = otherLastSeen == 0 ? "" : "last seen " + relTime(otherLastSeen);
                  toolbar.setSubtitle(sub);
              }
              private void watchBlockState() {
                  String me = FirebaseUtils.myUid();
                  FirebaseUtils.blocks().child(me).child(otherUid).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          iBlockedThem = s.exists();
                          findViewById(R.id.banner_block).setVisibility(
                              (iBlockedThem || theyBlockedMe) ? View.VISIBLE : View.GONE);
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
                  FirebaseUtils.blocks().child(otherUid).child(me).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          theyBlockedMe = s.exists();
                          findViewById(R.id.banner_block).setVisibility(
                              (iBlockedThem || theyBlockedMe) ? View.VISIBLE : View.GONE);
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
              private String relTime(long at) {
                  long diff = System.currentTimeMillis() - at;
                  if (diff < 60_000) return "just now";
                  if (diff < 3600_000) return (diff / 60_000) + "m ago";
                  if (diff < 86400_000) return (diff / 3600_000) + "h ago";
                  return (diff / 86400_000) + "d ago";
              }
