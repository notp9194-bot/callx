          import com.google.firebase.database.*;
          import java.util.*;
          public class SearchInChatActivity extends AppCompatActivity {
              private RecyclerView rv;
              private EditText et;
              private List<Message> all = new ArrayList<>(), filtered = new ArrayList<>();
              private MessageAdapter adapter;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_search_in_chat);
                  rv = findViewById(R.id.rv);
                  et = findViewById(R.id.et_q);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  adapter = new MessageAdapter(this, filtered, FirebaseUtils.myUid(), false);
                  rv.setAdapter(adapter);
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  String chatKey = getIntent().getStringExtra("chatKey");
                  boolean group = getIntent().getBooleanExtra("group", false);
                  String gid = getIntent().getStringExtra("gid");
                  DatabaseReference ref = group
                      ? FirebaseUtils.groups().child(gid).child("messages")
                      : FirebaseUtils.chats().child(chatKey).child("messages");
                  ref.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          for (DataSnapshot c : d.getChildren()) {
                              Message m = c.getValue(Message.class);
                              if (m != null) { m.id = c.getKey(); all.add(m); }
                          }
                          filter("");
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
                  et.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence c,int a,int b,int d){}
                      @Override public void onTextChanged(CharSequence c,int a,int b,int d){ filter(c.toString()); }
                      @Override public void afterTextChanged(Editable s){}
                  });
              }
              private void filter(String q) {
                  filtered.clear(); String qq = q.trim().toLowerCase();
                  for (Message m : all) {
                      if (m.text != null && (qq.isEmpty() || m.text.toLowerCase().contains(qq)))
                          filtered.add(m);
                  }
                  adapter.notifyDataSetChanged();
              }
          }
