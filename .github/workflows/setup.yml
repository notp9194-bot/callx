          # ============================================================
          # PROGUARD
          # ============================================================
          cat > app/proguard-rules.pro << 'ENDOFFILE'
          -keep class com.callx.app.models.** { *; }
          -keepclassmembers class com.callx.app.models.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.firebase.**
          -keep class org.webrtc.** { *; }
          -dontwarn org.webrtc.**
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn javax.annotation.**
          -dontwarn org.conscrypt.**
          -keep public class * implements com.bumptech.glide.module.GlideModule
          -keep class * extends com.bumptech.glide.module.AppGlideModule { <init>(...); }
          -keep public enum com.bumptech.glide.load.ImageHeaderParser$** { **[] $VALUES; public *; }
          -keep class com.bumptech.glide.GeneratedAppGlideModuleImpl
          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**
          -keep class com.callx.app.CallxApp { *; }
          -keep class com.callx.app.activities.** { *; }
          -keep class com.callx.app.services.** { *; }
          -keepattributes Signature
          -keepattributes *Annotation*
          ENDOFFILE

          # ============================================================
          # LAYOUTS — Auth, Main (with bottom nav), Profile
          # ============================================================
          cat > app/src/main/res/layout/activity_auth.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/surface_bg"
              android:fillViewport="true">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="32dp"
                  android:gravity="center_horizontal">
                  <FrameLayout
                      android:layout_width="96dp"
                      android:layout_height="96dp"
                      android:layout_marginTop="48dp"
                      android:background="@drawable/circle_primary">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center"
                          android:text="C"
                          android:textColor="@color/white"
                          android:textSize="48sp"
                          android:textStyle="bold"/>
                  </FrameLayout>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="CallX"
                      android:textSize="36sp"
                      android:textStyle="bold"
                      android:textColor="?android:attr/textColorPrimary"
                      android:layout_marginTop="16dp"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Connect. Call. Chat."
                      android:textColor="@color/text_secondary"
                      android:textSize="15sp"
                      android:layout_marginTop="6dp"
                      android:layout_marginBottom="40dp"/>
                  <com.google.android.material.textfield.TextInputLayout
                      android:id="@+id/til_name"
                      style="@style/Widget.Material3.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Naam (signup ke liye)"
                      android:layout_marginBottom="12dp"
                      app:boxCornerRadiusBottomEnd="14dp"
                      app:boxCornerRadiusBottomStart="14dp"
                      app:boxCornerRadiusTopEnd="14dp"
                      app:boxCornerRadiusTopStart="14dp">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_name"
