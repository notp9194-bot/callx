          package com.callx.app.activities;
          import android.os.Bundle;
          import android.text.InputType;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.utils.PinHelper;
          import com.callx.app.utils.PrefsManager;
          public class PinSetupActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(48, 96, 48, 48);
                  TextView tv = new TextView(this); tv.setText("Set 4–6 digit PIN"); tv.setTextSize(20);
                  EditText e1 = new EditText(this); e1.setHint("Enter PIN");
                  e1.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  EditText e2 = new EditText(this); e2.setHint("Confirm PIN");
                  e2.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  Button save = new Button(this); save.setText("Save PIN");
                  root.addView(tv); root.addView(e1); root.addView(e2); root.addView(save);
                  setContentView(root);
                  save.setOnClickListener(v -> {
                      String a = e1.getText().toString(), b = e2.getText().toString();
                      if (a.length() < 4 || a.length() > 6) { Toast.makeText(this, "PIN 4–6 digits", Toast.LENGTH_SHORT).show(); return; }
                      if (!a.equals(b)) { Toast.makeText(this, "PINs do not match", Toast.LENGTH_SHORT).show(); return; }
                      PrefsManager.setPinHash(PinHelper.hash(a));
                      PrefsManager.setAppLock(true);
                      Toast.makeText(this, "PIN saved", Toast.LENGTH_SHORT).show();
                      finish();
                  });
              }
          }
