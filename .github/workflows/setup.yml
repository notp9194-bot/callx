          # ============================================================
          # JAVA — AuthActivity.java  (callxId + name save)
          # ============================================================
          cat > app/src/main/java/com/callx/app/activities/AuthActivity.java << 'ENDOFFILE'
          package com.callx.app.activities;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.databinding.ActivityAuthBinding;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.FirebaseUser;
          import com.google.firebase.auth.UserProfileChangeRequest;
          import com.google.firebase.database.FirebaseDatabase;
          import com.google.firebase.messaging.FirebaseMessaging;
          import com.callx.app.utils.Constants;
          import java.util.HashMap;
          import java.util.Map;
          public class AuthActivity extends AppCompatActivity {
              private ActivityAuthBinding binding;
              private FirebaseAuth auth;
              private boolean isLoginMode = true;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  binding = ActivityAuthBinding.inflate(getLayoutInflater());
                  setContentView(binding.getRoot());
                  auth = FirebaseAuth.getInstance();
                  if (auth.getCurrentUser() != null) { goToMain(); return; }
                  binding.btnLogin.setOnClickListener(v -> {
                      String email = binding.etEmail.getText().toString().trim();
                      String password = binding.etPassword.getText().toString().trim();
                      if (email.isEmpty() || password.isEmpty()) {
                          showError("Email aur password fill karo");
                          return;
                      }
                      if (isLoginMode) {
                          auth.signInWithEmailAndPassword(email, password)
                              .addOnSuccessListener(r -> { saveFcmToken(); goToMain(); })
                              .addOnFailureListener(e -> showError(e.getMessage()));
                      } else {
                          String name = binding.etName.getText().toString().trim();
                          if (name.isEmpty()) { showError("Naam bhi daalo"); return; }
                          auth.createUserWithEmailAndPassword(email, password)
                              .addOnSuccessListener(r -> {
                                  FirebaseUser user = r.getUser();
                                  if (user == null) return;
                                  // Display name set karo
                                  user.updateProfile(new UserProfileChangeRequest.Builder()
                                      .setDisplayName(name).build());
                                  // Unique callxId
                                  String callxId = "callx_" + user.getUid().substring(0, 8).toLowerCase();
                                  Map<String, Object> data = new HashMap<>();
                                  data.put("uid", user.getUid());
                                  data.put("email", email);
                                  data.put("name", name);
                                  data.put("emoji", "😊");
                                  data.put("callxId", callxId);
                                  FirebaseDatabase.getInstance("https://sathix-97a76-default-rtdb.asia-southeast1.firebasedatabase.app").getReference("users")
                                      .child(user.getUid()).setValue(data)
                                      .addOnSuccessListener(x -> {
                                          Toast.makeText(this,
                                              "Account bana!\nTumhara CallX ID: " + callxId,
                                              Toast.LENGTH_LONG).show();
                                          saveFcmToken();
                                          goToMain();
                                      });
                              })
                              .addOnFailureListener(e -> showError(e.getMessage()));
                      }
                  });
                  binding.btnSignup.setOnClickListener(v -> {
                      isLoginMode = !isLoginMode;
                      binding.btnLogin.setText(isLoginMode ? "Login" : "Sign Up");
                      binding.btnSignup.setText(isLoginMode ? "Sign Up" : "Back to Login");
                      binding.tilName.setVisibility(isLoginMode ? View.GONE : View.VISIBLE);
                  });
                  // Name field pehle hidden
                  binding.tilName.setVisibility(View.GONE);
              }
              private void showError(String msg) {
                  binding.tvError.setVisibility(View.VISIBLE);
                  binding.tvError.setText(msg);
              }
              private void saveFcmToken() {
                  FirebaseUser user = auth.getCurrentUser();
                  if (user == null) return;
                  String uid = user.getUid();
                  FirebaseMessaging.getInstance().getToken()
                      .addOnSuccessListener(token -> {
                          if (token == null) return;
                          FirebaseDatabase.getInstance(Constants.DB_URL)
                              .getReference("users").child(uid)
                              .child("fcmToken").setValue(token);
                      });
              }
              private void goToMain() {
                  startActivity(new Intent(this, MainActivity.class));
                  finish();
              }
          }
          ENDOFFILE

          # ============================================================
          # JAVA — MainActivity.java  (FAB + ID display + logout menu)
          # ============================================================
          cat > app/src/main/java/com/callx/app/activities/MainActivity.java << 'ENDOFFILE'
          package com.callx.app.activities;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Menu;
          import android.view.MenuItem;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.viewpager2.widget.ViewPager2;
          import com.callx.app.R;
          import com.callx.app.adapters.ViewPagerAdapter;
          import com.callx.app.databinding.ActivityMainBinding;
          import com.callx.app.utils.Constants;
          import com.google.android.material.tabs.TabLayoutMediator;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.database.*;
          import com.google.firebase.messaging.FirebaseMessaging;
          public class MainActivity extends AppCompatActivity {
              private ActivityMainBinding binding;
              private final String[] tabs = {"Chats", "Updates", "Calls"};
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  binding = ActivityMainBinding.inflate(getLayoutInflater());
                  setContentView(binding.getRoot());
                  if (FirebaseAuth.getInstance().getCurrentUser() == null) {
                      startActivity(new Intent(this, AuthActivity.class));
                      finish(); return;
                  }
                  // Android 13+ notification permission
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                              new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }
                  setSupportActionBar(binding.toolbar);
                  binding.viewPager.setAdapter(new ViewPagerAdapter(this));
                  new TabLayoutMediator(binding.tabLayout, binding.viewPager,
                      (tab, pos) -> tab.setText(tabs[pos])).attach();
                  // FAB — Search screen kholo
                  binding.fabNewChat.setOnClickListener(v ->
                      startActivity(new Intent(this, SearchActivity.class)));
                  // Apna CallX ID dikhao
                  String uid = FirebaseAuth.getInstance().getCurrentUser().getUid();
                  FirebaseDatabase.getInstance(Constants.DB_URL).getReference("users").child(uid)
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          public void onDataChange(DataSnapshot snap) {
                              String id = snap.child("callxId").getValue(String.class);
                              if (id != null) binding.tvMyId.setText("Mera CallX ID: " + id);
                          }
                          public void onCancelled(DatabaseError e) {}
                      });
                  // Refresh FCM token (app launch pe har baar)
                  FirebaseMessaging.getInstance().getToken()
                      .addOnSuccessListener(token -> {
                          if (token == null) return;
                          FirebaseDatabase.getInstance(Constants.DB_URL)
                              .getReference("users").child(uid)
                              .child("fcmToken").setValue(token);
                      });
              }
              @Override
              public boolean onCreateOptionsMenu(Menu menu) {
                  getMenuInflater().inflate(R.menu.main_menu, menu);
                  return true;
              }
              @Override
              public boolean onOptionsItemSelected(MenuItem item) {
                  if (item.getItemId() == R.id.action_logout) {
                      FirebaseAuth.getInstance().signOut();
                      startActivity(new Intent(this, AuthActivity.class));
                      finish();
                  }
                  return super.onOptionsItemSelected(item);
              }
          }
          ENDOFFILE

          # ============================================================
          # JAVA — ChatActivity.java
          # ============================================================
          cat > app/src/main/java/com/callx/app/activities/ChatActivity.java << 'ENDOFFILE'
          package com.callx.app.activities;
          import android.os.Bundle;
          import android.util.Log;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import com.callx.app.adapters.MessageAdapter;
          import com.callx.app.databinding.ActivityChatBinding;
          import com.callx.app.models.Message;
          import com.callx.app.utils.Constants;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.database.*;
          import org.json.JSONObject;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.*;
          public class ChatActivity extends AppCompatActivity {
              private ActivityChatBinding binding;
              private MessageAdapter adapter;
              private final List<Message> messages = new ArrayList<>();
              private String chatId, currentUid, partnerUid, partnerName;
              private DatabaseReference messagesRef;
              private androidx.activity.result.ActivityResultLauncher<String> pickImageLauncher;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  binding = ActivityChatBinding.inflate(getLayoutInflater());
                  setContentView(binding.getRoot());
                  setSupportActionBar(binding.toolbar);
                  getSupportActionBar().setDisplayHomeAsUpEnabled(true);
                  currentUid = FirebaseAuth.getInstance().getCurrentUser().getUid();
                  partnerUid = getIntent().getStringExtra("partnerUid");
                  partnerName = getIntent().getStringExtra("partnerName");
                  binding.toolbar.setTitle(partnerName != null ? partnerName : "Chat");
                  String[] ids = {currentUid, partnerUid};
                  Arrays.sort(ids);
                  chatId = ids[0] + "_" + ids[1];
                  adapter = new MessageAdapter(messages, currentUid);
                  binding.rvMessages.setLayoutManager(new LinearLayoutManager(this));
                  binding.rvMessages.setAdapter(adapter);
                  messagesRef = FirebaseDatabase.getInstance(com.callx.app.utils.Constants.DB_URL)
                      .getReference("messages").child(chatId);
                  messagesRef.addChildEventListener(new ChildEventListener() {
                      public void onChildAdded(DataSnapshot s, String prev) {
                          Message msg = s.getValue(Message.class);
                          if (msg != null) {
                              messages.add(msg);
                              adapter.notifyItemInserted(messages.size() - 1);
                              binding.rvMessages.scrollToPosition(messages.size() - 1);
                          }
                      }
                      public void onChildChanged(DataSnapshot s, String prev) {}
                      public void onChildRemoved(DataSnapshot s) {}
                      public void onChildMoved(DataSnapshot s, String prev) {}
                      public void onCancelled(DatabaseError e) {}
                  });
                  // Image picker launcher (system gallery — no runtime perm needed)
                  pickImageLauncher = registerForActivityResult(
                      new androidx.activity.result.contract.ActivityResultContracts.GetContent(),
                      uri -> { if (uri != null) uploadAndSendImage(uri); });
                  binding.btnSend.setOnClickListener(v -> sendMessage());
                  binding.btnAttach.setOnClickListener(v -> pickImageLauncher.launch("image/*"));
              }
              private void sendMessage() {
                  String text = binding.etMessage.getText().toString().trim();
                  if (text.isEmpty()) return;
                  Map<String, Object> msg = new HashMap<>();
                  msg.put("senderId", currentUid);
                  msg.put("text", text);
                  msg.put("type", "text");
                  msg.put("timestamp", ServerValue.TIMESTAMP);
                  messagesRef.push().setValue(msg);
                  binding.etMessage.setText("");
                  String myName = FirebaseAuth.getInstance().getCurrentUser().getDisplayName();
                  if (myName == null || myName.isEmpty()) myName = "CallX User";
                  pushNotify(partnerUid, currentUid, myName, "message", text);
              }
              private void uploadAndSendImage(android.net.Uri uri) {
                  binding.uploadProgress.setVisibility(android.view.View.VISIBLE);
                  binding.btnAttach.setEnabled(false);
                  String folder = "callx/" + chatId;
                  com.callx.app.utils.CloudinaryUploader.upload(this, uri, folder,
                      new com.callx.app.utils.CloudinaryUploader.UploadCallback() {
                          @Override public void onSuccess(String secureUrl) {
                              binding.uploadProgress.setVisibility(android.view.View.GONE);
                              binding.btnAttach.setEnabled(true);
                              Map<String, Object> msg = new HashMap<>();
                              msg.put("senderId", currentUid);
                              msg.put("imageUrl", secureUrl);
                              msg.put("type", "image");
                              msg.put("timestamp", ServerValue.TIMESTAMP);
                              messagesRef.push().setValue(msg);
                              String myName = FirebaseAuth.getInstance().getCurrentUser().getDisplayName();
                              if (myName == null || myName.isEmpty()) myName = "CallX User";
                              pushNotify(partnerUid, currentUid, myName, "message", "📷 Photo");
                          }
                          @Override public void onError(String message) {
                              binding.uploadProgress.setVisibility(android.view.View.GONE);
                              binding.btnAttach.setEnabled(true);
                              android.widget.Toast.makeText(ChatActivity.this,
                                  "Upload fail: " + message,
                                  android.widget.Toast.LENGTH_LONG).show();
                          }
                      });
              }
              private void pushNotify(String toUid, String fromUid,
                                      String fromName, String type, String text) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(Constants.SERVER_URL + "/notify");
                          conn = (HttpURLConnection) url.openConnection();
