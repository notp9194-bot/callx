          cat > README.md << 'ENDOFFILE'
          # CallX v3 — Production Build

          Full Android chat / voice / video / group / status / call app built by
          this single GitHub Actions workflow YAML.

          ## What it has
          - Auth (Firebase email+password)
          - 1:1 chat with text, image, video, audio, file, location, contact, view-once
          - Reply, edit, delete-for-me, delete-for-all, forward, copy, star, react, mention
          - Per-chat AES-GCM encryption layer
          - Per-chat wallpaper, mute, archive, disappearing messages (24h / 7d / 90d)
          - Read receipts (double tick), last seen, typing, presence
          - 1:1 voice + video calls (real WebRTC, Firebase signaling, foreground service)
          - Groups (create / invite / admins / kick / member list / icon / rename)
          - Status (text / image / video, 24h, view counts, viewers list)
          - Search (global users + in-chat)
          - Block / unblock
          - App lock (biometric)
          - FCM data pushes (message / group / status / call)

          ## Run
          1. Push this repo to GitHub.
          2. Add Firebase: drop `app/google-services.json` (you can also commit a
             dummy if just want a build).
          3. Trigger the workflow ("Build CallX APK").
          4. Get APK from Actions artifacts.

          ## Server
          See `server/README.md`. Required for signed Cloudinary uploads + FCM pushes.
          ENDOFFILE

      - name: Clean previous build
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show generated APKs
        if: always()
        run: |
          echo "=== APKs found ==="
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || echo "No APKs found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CallX-APK-v3.0.${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
