          package com.callx.app.utils;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import com.callx.app.models.Message;
          import java.io.File;
          import java.io.FileWriter;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          /** Generates a plain-text .txt export of a chat and shares via system intent. */
          public class ChatExporter {
              public static void exportAndShare(Context ctx, String chatTitle, List<Message> messages) {
                  try {
                      SimpleDateFormat fmt = new SimpleDateFormat(
                          "yyyy-MM-dd HH:mm", Locale.US);
                      File f = new File(ctx.getCacheDir(),
                          "chat_" + chatTitle.replaceAll("\\W", "_") + "_" +
                          System.currentTimeMillis() + ".txt");
                      FileWriter w = new FileWriter(f);
                      w.write("CallX chat export — " + chatTitle + "\n");
                      w.write("Exported: " + fmt.format(new Date()) + "\n");
                      w.write("Messages: " + messages.size() + "\n");
                      w.write("============================================\n\n");
                      for (Message m : messages) {
                          if (Boolean.TRUE.equals(m.deletedForAll)) continue;
                          long ts = m.timestamp == null ? 0 : m.timestamp;
                          String when = fmt.format(new Date(ts));
                          String who = m.senderName == null ? "Unknown" : m.senderName;
                          String body;
                          if (m.text != null && !m.text.isEmpty()) body = m.text;
                          else if ("image".equals(m.type))   body = "[image] " + (m.mediaUrl == null ? "" : m.mediaUrl);
                          else if ("video".equals(m.type))   body = "[video] " + (m.mediaUrl == null ? "" : m.mediaUrl);
                          else if ("audio".equals(m.type))   body = "[audio] " + (m.mediaUrl == null ? "" : m.mediaUrl);
                          else if ("file".equals(m.type))    body = "[file] " + (m.fileName == null ? "" : m.fileName);
                          else if ("location".equals(m.type)) body = "[location] " + m.lat + "," + m.lng;
                          else if ("contact".equals(m.type)) body = "[contact] " + m.contactName;
                          else if ("sticker".equals(m.type)) body = "[sticker]";
                          else body = "[" + m.type + "]";
                          w.write("[" + when + "] " + who + ": " + body + "\n");
                      }
                      w.close();
                      Uri uri = FileProvider.getUriForFile(ctx,
                          ctx.getPackageName() + ".fileprovider", f);
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_STREAM, uri);
                      send.putExtra(Intent.EXTRA_SUBJECT, "Chat export — " + chatTitle);
                      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      ctx.startActivity(Intent.createChooser(send, "Share chat export"));
                  } catch (Exception ignored) {}
              }
          }
