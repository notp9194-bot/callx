          cat > app/src/main/res/layout/activity_chat.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical">
              <com.google.android.material.appbar.MaterialToolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent" android:layout_height="?attr/actionBarSize"
                  android:background="@color/brand_primary"
                  app:titleTextColor="@color/white"
                  app:subtitleTextColor="#CCFFFFFF"
                  app:navigationIcon="@drawable/ic_arrow_back"/>
              <FrameLayout
                  android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1">
                  <ImageView android:id="@+id/iv_wallpaper"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:scaleType="centerCrop" android:src="@color/bg_chat"/>
                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/rv_messages"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:padding="6dp"
                      android:clipToPadding="false"/>
                  <ProgressBar android:id="@+id/upload_progress" android:visibility="gone"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_gravity="center"/>
                  <LinearLayout android:id="@+id/banner_block"
                      android:visibility="gone"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:layout_gravity="bottom" android:gravity="center"
                      android:padding="10dp"
                      android:background="@color/black_overlay">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="You can't message this contact"
                          android:textColor="@color/white"/>
                  </LinearLayout>
              </FrameLayout>

              <!-- Reply preview -->
              <LinearLayout android:id="@+id/ll_reply_preview"
                  android:visibility="gone"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:padding="8dp"
                  android:background="@color/surface">
                  <View android:layout_width="3dp" android:layout_height="match_parent"
                      android:background="@color/brand_accent"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical"
                      android:layout_marginStart="8dp">
                      <TextView android:id="@+id/tv_reply_to_name"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textStyle="bold" android:textColor="@color/brand_accent"/>
                      <TextView android:id="@+id/tv_reply_to_text"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textColor="@color/text_secondary" android:maxLines="2" android:ellipsize="end"/>
                  </LinearLayout>
                  <ImageButton android:id="@+id/btn_close_reply"
                      android:layout_width="32dp" android:layout_height="32dp"
                      android:src="@drawable/ic_close" android:background="@android:color/transparent"/>
              </LinearLayout>

              <!-- Edit preview -->
              <LinearLayout android:id="@+id/ll_edit_preview"
                  android:visibility="gone"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:padding="8dp"
                  android:background="@color/surface">
                  <ImageView android:layout_width="20dp" android:layout_height="20dp"
                      android:src="@drawable/ic_edit"
                      app:tint="@color/brand_primary"/>
                  <TextView android:id="@+id/tv_edit_text"
                      android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:textColor="@color/text_secondary"
                      android:layout_marginStart="8dp" android:maxLines="1" android:ellipsize="end"/>
                  <ImageButton android:id="@+id/btn_close_edit"
                      android:layout_width="32dp" android:layout_height="32dp"
                      android:src="@drawable/ic_close" android:background="@android:color/transparent"/>
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:padding="6dp" android:orientation="horizontal" android:gravity="center_vertical">
                  <LinearLayout
                      android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:background="@drawable/rounded_input_bg" android:padding="6dp">
                      <ImageButton android:id="@+id/btn_attach"
                          android:layout_width="36dp" android:layout_height="36dp"
                          android:src="@drawable/ic_attach"
                          android:background="@android:color/transparent"
                          app:tint="@color/text_secondary"/>
                      <EditText
                          android:id="@+id/et_message"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:background="@android:color/transparent"
                          android:hint="Message" android:maxLines="5"/>
                      <ImageButton android:id="@+id/btn_camera"
                          android:layout_width="36dp" android:layout_height="36dp"
                          android:src="@drawable/ic_camera"
                          android:background="@android:color/transparent"
                          app:tint="@color/text_secondary"/>
                  </LinearLayout>
                  <ImageButton android:id="@+id/btn_send"
                      android:visibility="gone"
                      android:layout_width="48dp" android:layout_height="48dp"
                      android:src="@drawable/ic_send_fill"
                      android:background="@drawable/circle_primary"
                      android:layout_marginStart="6dp"
                      app:tint="@color/white"/>
                  <ImageButton android:id="@+id/btn_mic"
                      android:layout_width="48dp" android:layout_height="48dp"
                      android:src="@drawable/ic_mic"
                      android:background="@drawable/circle_primary"
                      android:layout_marginStart="6dp"
                      app:tint="@color/white"/>
              </LinearLayout>
          </LinearLayout>
          ENDOFFILE

