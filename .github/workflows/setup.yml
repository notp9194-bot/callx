name: Setup CallX Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Full Project Structure
        run: |
          # === GRADLE FILES ===
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/callx/app/activities
          mkdir -p app/src/main/java/com/callx/app/fragments
          mkdir -p app/src/main/java/com/callx/app/adapters
          mkdir -p app/src/main/java/com/callx/app/models
          mkdir -p app/src/main/java/com/callx/app/utils
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

          # === settings.gradle ===
          cat > settings.gradle << 'ENDOFFILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CallX"
          include ':app'
          ENDOFFILE

          # === build.gradle ROOT ===
          cat > build.gradle << 'ENDOFFILE'
          buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ENDOFFILE

          # === gradle.properties ===
          cat > gradle.properties << 'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          ENDOFFILE

          # === gradle-wrapper.properties ===
          cat > gradle/wrapper/gradle-wrapper.properties << 'ENDOFFILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          ENDOFFILE

          # === app/build.gradle ===
          cat > app/build.gradle << 'ENDOFFILE'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.callx.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.callx.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildFeatures {
                  viewBinding true
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-database'
              implementation 'io.getstream:stream-webrtc-android:1.1.2'
          }
          ENDOFFILE

          # === AndroidManifest.xml ===
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:allowBackup="true"
                  android:label="CallX"
                  android:theme="@style/Theme.CallX"
                  android:supportsRtl="true">
                  <activity
                      android:name=".activities.AuthActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".activities.MainActivity" android:exported="false"/>
                  <activity android:name=".activities.ChatActivity" android:exported="false" android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.CallActivity" android:exported="false" android:screenOrientation="portrait" android:showWhenLocked="true" android:turnScreenOn="true"/>
              </application>
          </manifest>
          ENDOFFILE

          # === colors.xml ===
          cat > app/src/main/res/values/colors.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="callx_header_bg">#005c97</color>
              <color name="callx_accent_blue">#34B7F1</color>
              <color name="callx_message_out_bg">#e1f6fb</color>
              <color name="callx_message_in_bg">#ffffff</color>
              <color name="callx_app_bg">#f0f2f5</color>
              <color name="callx_chat_bg">#e5ddd5</color>
              <color name="callx_icon_color">#f0f2f5</color>
              <color name="callx_text_primary">#111b21</color>
              <color name="callx_text_secondary">#667781</color>
              <color name="callx_border_color">#e9edef</color>
              <color name="callx_button_color">#008069</color>
              <color name="callx_end_call">#e91e63</color>
              <color name="callx_accept_call">#4CAF50</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          ENDOFFILE

          # === strings.xml ===
          cat > app/src/main/res/values/strings.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CallX</string>
              <string name="hint_email">Email</string>
              <string name="hint_password">Password</string>
              <string name="hint_message">Message…</string>
              <string name="btn_login">Login</string>
              <string name="btn_signup">Sign Up</string>
              <string name="btn_send">Send</string>
              <string name="tab_chats">Chats</string>
              <string name="tab_updates">Updates</string>
              <string name="tab_calls">Calls</string>
          </resources>
          ENDOFFILE

          # === themes.xml ===
          cat > app/src/main/res/values/themes.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CallX" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#005c97</item>
                  <item name="colorPrimaryVariant">#004a7a</item>
                  <item name="colorSecondary">#34B7F1</item>
                  <item name="colorOnPrimary">#ffffff</item>
                  <item name="android:statusBarColor">#004a7a</item>
              </style>
          </resources>
          ENDOFFILE

          # === bubble_sent.xml ===
          cat > app/src/main/res/drawable/bubble_sent.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#e1f6fb"/>
              <corners android:topLeftRadius="18dp" android:topRightRadius="18dp" android:bottomLeftRadius="18dp" android:bottomRightRadius="4dp"/>
          </shape>
          ENDOFFILE

          # === bubble_received.xml ===
          cat > app/src/main/res/drawable/bubble_received.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#ffffff"/>
              <corners android:topLeftRadius="18dp" android:topRightRadius="18dp" android:bottomLeftRadius="4dp" android:bottomRightRadius="18dp"/>
          </shape>
          ENDOFFILE

          # === rounded_input_bg.xml ===
          cat > app/src/main/res/drawable/rounded_input_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#ffffff"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1dp" android:color="#e9edef"/>
          </shape>
          ENDOFFILE

          # === circle_green.xml ===
          cat > app/src/main/res/drawable/circle_green.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#4CAF50"/>
          </shape>
          ENDOFFILE

          # === circle_red.xml ===
          cat > app/src/main/res/drawable/circle_red.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#e91e63"/>
          </shape>
          ENDOFFILE

          # === circle_avatar_bg.xml ===
          cat > app/src/main/res/drawable/circle_avatar_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#e1f6fb"/>
          </shape>
          ENDOFFILE

          # === activity_auth.xml ===
          cat > app/src/main/res/layout/activity_auth.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#f0f2f5">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="32dp"
                  android:gravity="center_horizontal">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="CallX"
                      android:textSize="48sp"
                      android:textStyle="bold"
                      android:textColor="#005c97"
                      android:layout_marginTop="60dp"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Connect. Call. Chat."
                      android:textColor="#667781"
                      android:textSize="16sp"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="48dp"/>
                  <com.google.android.material.textfield.TextInputLayout
                      android:id="@+id/til_email"
                      style="@style/Widget.MaterialComponents.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Email">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_email"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="textEmailAddress"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.textfield.TextInputLayout
                      android:id="@+id/til_password"
                      style="@style/Widget.MaterialComponents.TextInputLayout.OutlinedBox"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="Password"
                      android:layout_marginTop="16dp"
                      app:passwordToggleEnabled="true"
                      xmlns:app="http://schemas.android.com/apk/res-auto">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_password"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="textPassword"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <TextView
                      android:id="@+id/tv_error"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#e91e63"
                      android:layout_marginTop="8dp"
                      android:visibility="gone"/>
                  <Button
                      android:id="@+id/btn_login"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Login"
                      android:backgroundTint="#008069"
                      android:layout_marginTop="24dp"/>
                  <Button
                      android:id="@+id/btn_signup"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Sign Up"
                      style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                      android:layout_marginTop="12dp"/>
              </LinearLayout>
          </ScrollView>
          ENDOFFILE

          # === activity_main.xml ===
          cat > app/src/main/res/layout/activity_main.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="#005c97"
                  app:title="CallX"
                  app:titleTextColor="#ffffff"/>
              <com.google.android.material.tabs.TabLayout
                  android:id="@+id/tab_layout"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="#005c97"
                  app:tabTextColor="#b0c4d8"
                  app:tabSelectedTextColor="#ffffff"
                  app:tabIndicatorColor="#34B7F1"/>
              <androidx.viewpager2.widget.ViewPager2
                  android:id="@+id/view_pager"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"/>
          </LinearLayout>
          ENDOFFILE

          # === activity_chat.xml ===
          cat > app/src/main/res/layout/activity_chat.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="?attr/actionBarSize"
                  android:background="#005c97"
                  app:navigationIcon="@drawable/ic_back"
                  app:titleTextColor="#ffffff"/>
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv_messages"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#e5ddd5"
                  android:padding="8dp"
                  android:clipToPadding="false"/>
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="8dp"
                  android:background="#ffffff"
                  android:gravity="center_vertical">
                  <EditText
                      android:id="@+id/et_message"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:hint="Message…"
                      android:background="@drawable/rounded_input_bg"
                      android:padding="12dp"
                      android:maxLines="4"/>
                  <ImageButton
                      android:id="@+id/btn_send"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:src="@android:drawable/ic_menu_send"
                      android:background="@drawable/circle_green"
                      android:layout_marginStart="8dp"
                      android:tint="#ffffff"/>
              </LinearLayout>
          </LinearLayout>
          ENDOFFILE

          # === activity_call.xml ===
          cat > app/src/main/res/layout/activity_call.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <org.webrtc.SurfaceViewRenderer
                  android:id="@+id/remote_video"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
              <org.webrtc.SurfaceViewRenderer
                  android:id="@+id/local_video"
                  android:layout_width="120dp"
                  android:layout_height="160dp"
                  android:layout_gravity="top|end"
                  android:layout_margin="16dp"/>
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:orientation="vertical"
                  android:padding="32dp"
                  android:gravity="center">
                  <TextView
                      android:id="@+id/tv_caller_name"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#ffffff"
                      android:textSize="24sp"
                      android:textStyle="bold"/>
                  <TextView
                      android:id="@+id/tv_call_status"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#34B7F1"
                      android:textSize="16sp"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="32dp"/>
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center">
                      <ImageButton
                          android:id="@+id/btn_toggle_mic"
                          android:layout_width="56dp"
                          android:layout_height="56dp"
                          android:src="@android:drawable/ic_btn_speak_now"
                          android:background="@drawable/circle_avatar_bg"
                          android:layout_marginEnd="24dp"/>
                      <ImageButton
                          android:id="@+id/btn_end_call"
                          android:layout_width="72dp"
                          android:layout_height="72dp"
                          android:src="@android:drawable/ic_delete"
                          android:background="@drawable/circle_red"
                          android:tint="#ffffff"
                          android:layout_marginEnd="24dp"/>
                      <ImageButton
                          android:id="@+id/btn_toggle_camera"
                          android:layout_width="56dp"
                          android:layout_height="56dp"
                          android:src="@android:drawable/ic_menu_camera"
                          android:background="@drawable/circle_avatar_bg"/>
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          ENDOFFILE

          # === fragment_chats.xml ===
          cat > app/src/main/res/layout/fragment_chats.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#f0f2f5">
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv_chats"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </FrameLayout>
          ENDOFFILE

          # === fragment_updates.xml ===
          cat > app/src/main/res/layout/fragment_updates.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#f0f2f5">
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv_requests"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </FrameLayout>
          ENDOFFILE

          # === fragment_calls.xml ===
          cat > app/src/main/res/layout/fragment_calls.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#f0f2f5">
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv_calls"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </FrameLayout>
          ENDOFFILE

          # === item_contact.xml ===
          cat > app/src/main/res/layout/item_contact.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="16dp"
              android:background="#ffffff"
              android:gravity="center_vertical">
              <TextView
                  android:id="@+id/tv_avatar"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:gravity="center"
                  android:textSize="24sp"
                  android:background="@drawable/circle_avatar_bg"/>
              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:layout_marginStart="16dp">
                  <TextView
                      android:id="@+id/tv_name"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textStyle="bold"
                      android:textColor="#111b21"
                      android:textSize="16sp"/>
                  <TextView
                      android:id="@+id/tv_last_message"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#667781"
                      android:textSize="14sp"
                      android:maxLines="1"
                      android:ellipsize="end"/>
              </LinearLayout>
              <TextView
                  android:id="@+id/tv_unread"
                  android:layout_width="24dp"
                  android:layout_height="24dp"
                  android:gravity="center"
                  android:textColor="#ffffff"
                  android:textSize="12sp"
                  android:background="@drawable/circle_green"
                  android:visibility="gone"/>
          </LinearLayout>
          ENDOFFILE

          # === item_message_sent.xml ===
          cat > app/src/main/res/layout/item_message_sent.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="end"
              android:padding="4dp">
              <TextView
                  android:id="@+id/tv_message"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bubble_sent"
                  android:padding="10dp"
                  android:textColor="#111b21"
                  android:maxWidth="260dp"/>
          </LinearLayout>
          ENDOFFILE

          # === item_message_received.xml ===
          cat > app/src/main/res/layout/item_message_received.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="start"
              android:padding="4dp">
              <TextView
                  android:id="@+id/tv_message"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bubble_received"
                  android:padding="10dp"
                  android:textColor="#111b21"
                  android:maxWidth="260dp"/>
          </LinearLayout>
          ENDOFFILE

          # === item_request.xml ===
          cat > app/src/main/res/layout/item_request.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="16dp"
              android:background="#ffffff"
              android:gravity="center_vertical">
              <TextView
                  android:id="@+id/tv_avatar"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:gravity="center"
                  android:textSize="24sp"
                  android:background="@drawable/circle_avatar_bg"/>
              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:layout_marginStart="16dp">
                  <TextView
                      android:id="@+id/tv_name"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textStyle="bold"
                      android:textColor="#111b21"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="wants to connect"
                      android:textColor="#667781"/>
              </LinearLayout>
              <Button
                  android:id="@+id/btn_accept"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Accept"
                  android:backgroundTint="#4CAF50"
