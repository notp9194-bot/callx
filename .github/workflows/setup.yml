          cat > app/src/main/java/com/callx/app/activities/NewBroadcastActivity.java << 'ENDOFFILE'
          package com.callx.app.activities;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.*;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.R;
          import com.callx.app.utils.FirebaseUtils;
          import com.callx.app.utils.PushNotify;
          import com.google.firebase.database.*;
          import org.json.JSONObject;
          import java.util.*;
          /** Compose-and-send to a list of selected contacts (sends one push and
           *  one chat-message per recipient, mirroring WhatsApp broadcast lists). */
          public class NewBroadcastActivity extends AppCompatActivity {
              private final Map<String, String> chosenUidToName = new LinkedHashMap<>();
              private LinearLayout llChosen;
              private EditText etName, etMessage;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_new_broadcast);
                  llChosen = findViewById(R.id.ll_chosen);
                  etName = findViewById(R.id.et_name);
                  etMessage = findViewById(R.id.et_message);
                  Button btnPick = findViewById(R.id.btn_pick);
                  Button btnSend = findViewById(R.id.btn_send);
                  btnPick.setOnClickListener(v -> pickContacts());
                  btnSend.setOnClickListener(v -> sendNow());
              }
              private void pickContacts() {
                  // Inline picker via existing users node; for brevity we show the
                  // first 50 known users with a simple AlertDialog multi-choice.
                  FirebaseUtils.users().limitToFirst(50)
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              List<String> uids = new ArrayList<>(); List<String> names = new ArrayList<>();
                              for (DataSnapshot c : s.getChildren()) {
                                  if (c.getKey().equals(FirebaseUtils.myUid())) continue;
                                  String n = c.child("name").getValue(String.class);
                                  if (n == null) continue;
                                  uids.add(c.getKey()); names.add(n);
                              }
                              boolean[] picked = new boolean[uids.size()];
                              new androidx.appcompat.app.AlertDialog.Builder(NewBroadcastActivity.this)
                                  .setTitle("Pick recipients")
                                  .setMultiChoiceItems(names.toArray(new String[0]), picked,
                                      (d, w, ch) -> picked[w] = ch)
                                  .setPositiveButton("OK", (d, w) -> {
                                      chosenUidToName.clear();
                                      llChosen.removeAllViews();
                                      for (int i = 0; i < uids.size(); i++) {
                                          if (picked[i]) {
                                              chosenUidToName.put(uids.get(i), names.get(i));
                                              TextView t = new TextView(NewBroadcastActivity.this);
                                              t.setText("• " + names.get(i));
                                              t.setPadding(8, 4, 8, 4);
                                              llChosen.addView(t);
                                          }
                                      }
                                  })
                                  .setNegativeButton("Cancel", null).show();
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {}
                      });
              }
              private void sendNow() {
                  String name = etName.getText().toString().trim();
                  String text = etMessage.getText().toString().trim();
                  String me = FirebaseUtils.myUid();
                  if (text.isEmpty() || chosenUidToName.isEmpty() || me == null) {
                      Toast.makeText(this, "Pick recipients and type a message", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  // Persist broadcast list
                  String bid = FirebaseUtils.broadcasts().child(me).push().getKey();
                  Map<String, Object> b = new HashMap<>();
                  b.put("name", name.isEmpty() ? "Broadcast" : name);
                  b.put("ownerUid", me); b.put("createdAt", System.currentTimeMillis());
                  b.put("lastMessage", text); b.put("lastMessageAt", System.currentTimeMillis());
                  Map<String, Boolean> mems = new HashMap<>();
                  for (String uid : chosenUidToName.keySet()) mems.put(uid, true);
                  b.put("members", mems);
                  FirebaseUtils.broadcasts().child(me).child(bid).setValue(b);
                  // Fan-out: push a real chat message into each recipient's chat with me
                  for (Map.Entry<String, String> e : chosenUidToName.entrySet()) {
                      String otherUid = e.getKey();
                      String chatKey = FirebaseUtils.chatKey(me, otherUid);
                      Map<String, Object> m = new HashMap<>();
                      m.put("senderId", me); m.put("senderName", "Me");
                      m.put("type", "text"); m.put("text", text);
                      m.put("timestamp", System.currentTimeMillis());
                      m.put("status", "sent"); m.put("broadcastId", bid);
                      FirebaseUtils.chats().child(chatKey).child("messages").push().setValue(m);
                      try {
                          JSONObject body = new JSONObject();
                          body.put("toUid", otherUid); body.put("fromUid", me);
                          body.put("title", "Broadcast"); body.put("body", text); body.put("type", "message");
                          PushNotify.send("/notify/message", body);
                      } catch (Exception ignored) {}
                  }
                  Toast.makeText(this, "Broadcast sent to " + chosenUidToName.size(),
                      Toast.LENGTH_SHORT).show();
                  finish();
              }
          }
          ENDOFFILE

