                  if (id == R.id.action_starred) { startActivity(new Intent(this, StarredActivity.class)); return true; }
                  if (id == R.id.action_blocked) { startActivity(new Intent(this, BlockedListActivity.class)); return true; }
                  if (id == R.id.action_settings){ startActivity(new Intent(this, ProfileActivity.class)); return true; }
                  if (id == R.id.action_logout)  { FirebaseAuth.getInstance().signOut();
                      startActivity(new Intent(this, AuthActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_CLEAR_TASK | Intent.FLAG_ACTIVITY_NEW_TASK));
                      return true; }
                  return super.onOptionsItemSelected(it);
