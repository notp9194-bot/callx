                          etName.setText(s(d, "name"));
                          etAbout.setText(s(d, "about"));
                          tvCallxId.setText("CallX ID: " + s(d, "callxId"));
                          photoUrl = s(d, "photoUrl");
                          if (photoUrl != null && !photoUrl.isEmpty())
                              Glide.with(ProfileActivity.this).load(photoUrl).into(iv);
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
              private String s(DataSnapshot d, String key) {
                  Object o = d.child(key).getValue(); return o == null ? "" : o.toString();
              }
              private void save() {
                  String uid = FirebaseUtils.myUid(); if (uid == null) return;
                  Map<String, Object> u = new HashMap<>();
                  u.put("name", etName.getText().toString().trim());
                  u.put("about", etAbout.getText().toString().trim());
                  u.put("privacyReadReceipts", swRR.isChecked());
                  u.put("privacyShowLastSeen", swLS.isChecked());
                  if (photoUrl != null) u.put("photoUrl", photoUrl);
                  FirebaseUtils.users().child(uid).updateChildren(u);
                  Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show();
              }
              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (res != Activity.RESULT_OK || d == null || d.getData() == null) return;
                  Uri u = d.getData();
                  CloudinaryUploader.upload(this, u, "image", new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          photoUrl = url;
                          runOnUiThread(() -> Glide.with(ProfileActivity.this).load(url).into(iv));
                      }
                      @Override public void onError(String s) {}
                  });
              }
          }
