      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradlew << 'GRADLEW_END'
          #!/usr/bin/env sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec java -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW_END
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APK artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: callx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Commit generated project
        run: |
          git config user.name  "callx-bot"
          git config user.email "bot@callx.app"
          git add -A
          git diff --cached --quiet || git commit -m "Setup CallX v2 (production)"
          git push origin HEAD:${{ github.ref_name }} || true
