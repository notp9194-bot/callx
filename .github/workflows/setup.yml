              private void push(Message m) {
                  String id = msgRef.push().getKey(); m.id = id;
                  msgRef.child(id).setValue(m);
                  Map<String, Object> meta = new HashMap<>();
                  String preview = m.text != null ? m.text : "[" + m.type + "]";
                  meta.put("lastMessage", preview);
                  meta.put("lastMessageAt", m.timestamp);
                  FirebaseUtils.groups().child(gid).updateChildren(meta);
                  try {
                      JSONObject body = new JSONObject();
                      body.put("gid", gid); body.put("title", gname);
                      body.put("body", preview); body.put("fromUid", FirebaseUtils.myUid());
                      PushNotify.send("/notify/group", body);
                  } catch (Exception ignored) {}
                  PrefsManager.setDraft("g_" + gid, null);
                  replyTo = null; llReplyPreview.setVisibility(View.GONE);
              }
