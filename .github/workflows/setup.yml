          import com.callx.app.activities.NewGroupActivity;
          import com.callx.app.adapters.GroupAdapter;
          import com.callx.app.models.Group;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.*;
          public class GroupsFragment extends Fragment {
              private List<Group> data = new ArrayList<>();
              private GroupAdapter adapter;
              @Override public View onCreateView(@NonNull LayoutInflater i, ViewGroup p, Bundle s) {
                  View root = i.inflate(R.layout.fragment_groups, p, false);
                  RecyclerView rv = root.findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  adapter = new GroupAdapter(getContext(), data, g -> {
                      Intent it = new Intent(getActivity(), GroupChatActivity.class);
                      it.putExtra(GroupChatActivity.EXTRA_GID, g.id);
                      it.putExtra(GroupChatActivity.EXTRA_NAME, g.name);
                      startActivity(it);
                  });
                  rv.setAdapter(adapter);
                  root.findViewById(R.id.fab_new_group).setOnClickListener(v ->
                      startActivity(new Intent(getActivity(), NewGroupActivity.class)));
                  load();
                  return root;
              }
              private void load() {
                  String me = FirebaseUtils.myUid(); if (me == null) return;
                  FirebaseUtils.groups().addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          data.clear();
                          for (DataSnapshot c : d.getChildren()) {
                              Group g = c.getValue(Group.class);
                              if (g == null || g.members == null || !g.members.containsKey(me)) continue;
                              g.id = c.getKey();
                              data.add(g);
                          }
                          Collections.sort(data, (a, b) -> Long.compare(
                              b.lastMessageAt == null ? 0 : b.lastMessageAt,
                              a.lastMessageAt == null ? 0 : a.lastMessageAt));
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
          }
