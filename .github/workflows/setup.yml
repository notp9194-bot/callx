          package com.callx.app.activities;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.R;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          public class MessageInfoActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_message_info);
                  String chatKey = getIntent().getStringExtra("chatKey");
                  String groupId = getIntent().getStringExtra("groupId");
                  String msgId = getIntent().getStringExtra("msgId");
                  TextView tv = findViewById(R.id.tv_info);
                  if (msgId == null) { tv.setText("No message"); return; }
                  DatabaseReference ref = chatKey != null
                      ? FirebaseUtils.chats().child(chatKey).child("messages").child(msgId)
                      : FirebaseUtils.groups().child(groupId).child("messages").child(msgId);
                  ref.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot d) {
                          SimpleDateFormat fmt = new SimpleDateFormat("MMM d, yyyy h:mm a", Locale.US);
                          StringBuilder sb = new StringBuilder();
                          Long ts = d.child("timestamp").getValue(Long.class);
                          sb.append("Sent: ").append(ts == null ? "?" : fmt.format(new Date(ts))).append("\n\n");
                          sb.append("Status: ").append(d.child("status").getValue(String.class)).append("\n\n");
                          sb.append("Delivered to:\n");
                          for (DataSnapshot c : d.child("deliveredTo").getChildren()) {
                              Long at = c.getValue(Long.class);
                              sb.append("  ").append(c.getKey()).append(" — ")
                                .append(at == null ? "" : fmt.format(new Date(at))).append("\n");
                          }
                          sb.append("\nSeen by:\n");
                          for (DataSnapshot c : d.child("seenBy").getChildren()) {
                              Long at = c.getValue(Long.class);
                              sb.append("  ").append(c.getKey()).append(" — ")
                                .append(at == null ? "" : fmt.format(new Date(at))).append("\n");
                          }
                          if (d.hasChild("reactions")) {
                              sb.append("\nReactions:\n");
                              for (DataSnapshot e : d.child("reactions").getChildren()) {
                                  sb.append("  ").append(e.getKey()).append(": ")
                                    .append(e.getChildrenCount()).append("\n");
                              }
                          }
                          tv.setText(sb.toString());
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
          }
          ENDOFFILE

