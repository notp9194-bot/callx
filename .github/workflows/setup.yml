          public class ChatListAdapter extends RecyclerView.Adapter<ChatListAdapter.VH> {
              public interface OnClick { void onClick(ChatMeta m); }
              public interface OnLong { void onLong(ChatMeta m); }
              private final Context ctx;
              private final List<ChatMeta> data;
              private final OnClick onClick;
              private OnLong onLong;
              public ChatListAdapter(Context c, List<ChatMeta> d, OnClick onClick) {
                  this.ctx = c; this.data = d; this.onClick = onClick;
              }
              public void setOnLong(OnLong l) { this.onLong = l; }
              @NonNull @Override public VH onCreateViewHolder(@NonNull ViewGroup p, int v) {
                  return new VH(LayoutInflater.from(ctx).inflate(R.layout.item_chat, p, false));
              }
              @Override public void onBindViewHolder(@NonNull VH h, int pos) {
                  ChatMeta m = data.get(pos);
                  h.tvName.setText(m.partnerName == null ? "" : m.partnerName);
                  String chatKey = FirebaseUtils.chatKey(FirebaseUtils.myUid(),
                      m.partnerUid == null ? "" : m.partnerUid);
                  String draft = PrefsManager.getDraft(chatKey);
                  if (draft != null && !draft.isEmpty()) {
                      SpannableStringBuilder sb = new SpannableStringBuilder();
                      sb.append("Draft: ");
                      sb.setSpan(new ForegroundColorSpan(Color.RED), 0, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      sb.setSpan(new StyleSpan(Typeface.ITALIC), 0, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      sb.append(draft);
                      h.tvLast.setText(sb);
                  } else {
                      h.tvLast.setText(m.lastMessage == null ? "" : m.lastMessage);
                  }
                  h.tvTime.setText(m.lastMessageAt == null ? "" :
                      DateFormat.format("h:mm a", m.lastMessageAt));
                  if (m.partnerPhoto != null && !m.partnerPhoto.isEmpty())
                      Glide.with(ctx).load(m.partnerPhoto).into(h.iv);
                  long unread = m.unread == null ? 0 : m.unread;
                  if (unread > 0) {
                      h.tvUnread.setVisibility(View.VISIBLE);
                      h.tvUnread.setText(String.valueOf(unread));
                  } else h.tvUnread.setVisibility(View.GONE);
                  h.ivMute.setVisibility(PrefsManager.isMuted(chatKey) ? View.VISIBLE : View.GONE);
                  if (h.ivPin != null) {
                      h.ivPin.setVisibility(PrefsManager.isChatPinned(chatKey) ? View.VISIBLE : View.GONE);
                  }
                  h.itemView.setOnClickListener(v -> onClick.onClick(m));
                  h.itemView.setOnLongClickListener(v -> {
                      if (onLong != null) { onLong.onLong(m); return true; }
                      return false;
                  });
              }
              @Override public int getItemCount() { return data.size(); }
              static class VH extends RecyclerView.ViewHolder {
                  TextView tvName, tvLast, tvTime, tvUnread; CircleImageView iv;
                  ImageView ivMute, ivCheck, ivPin; View dotOnline;
                  VH(View v) {
                      super(v);
                      tvName = v.findViewById(R.id.tv_name); tvLast = v.findViewById(R.id.tv_last);
                      tvTime = v.findViewById(R.id.tv_time); tvUnread = v.findViewById(R.id.tv_unread);
                      iv = v.findViewById(R.id.iv_avatar);
                      ivMute = v.findViewById(R.id.iv_mute); ivCheck = v.findViewById(R.id.iv_check);
                      ivPin = v.findViewById(R.id.iv_pin);
                      dotOnline = v.findViewById(R.id.dot_online);
                  }
              }
          }
