              private void pick(String mime, int rc) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(mime);
                  startActivityForResult(i, rc);
              }
              private void openCameraImage() { pick("image/*", RC_CAMERA); }
              @Override protected void onActivityResult(int rc, int resCode, Intent data) {
                  super.onActivityResult(rc, resCode, data);
                  if (resCode != Activity.RESULT_OK || data == null) return;
                  if (rc == 200) {
                      Message m = newMessageBase("location");
                      m.lat = data.getDoubleExtra("lat", 0); m.lng = data.getDoubleExtra("lng", 0);
                      pushMessage(m); return;
                  }
                  if (rc == 201) {
                      Message m = newMessageBase("contact");
                      m.contactName = data.getStringExtra("name");
                      m.contactPhone = data.getStringExtra("phone");
                      pushMessage(m); return;
                  }
                  if (rc == RC_STICKER) {
                      String sid = data.getStringExtra("stickerId");
                      String pack = data.getStringExtra("stickerPack");
                      Message m = newMessageBase("sticker");
                      m.stickerId = sid; m.stickerPack = pack;
                      pushMessage(m); return;
                  }
                  Uri uri = data.getData(); if (uri == null) return;
                  // Compress images before upload
                  if (rc == RC_GALLERY || rc == RC_CAMERA) {
                      uri = ImageCompressor.compress(this, uri);
                  }
                  String resType = (rc == RC_AUDIO) ? "video" : (rc == RC_FILE ? "raw" : "auto");
                  Uri videoThumb = (rc == RC_VIDEO) ? FileUtils.makeVideoThumb(this, uri) : null;
                  long dur = (rc == RC_AUDIO || rc == RC_VIDEO) ? FileUtils.getDurationMs(this, uri) : 0;
                  String fileName = FileUtils.getName(this, uri);
                  long size = FileUtils.getSize(this, uri);
                  // Insert optimistic "sending" placeholder
                  final Message placeholder = newMessageBase(typeFor(rc));
                  placeholder.fileName = fileName; placeholder.fileSize = size; placeholder.duration = dur;
                  placeholder.id = "local_" + System.currentTimeMillis();
                  messages.add(placeholder);
                  adapter.notifyItemInserted(messages.size() - 1);
                  rv.scrollToPosition(adapter.getItemCount() - 1);
                  final Uri finalUri = uri;
                  CloudinaryUploader.upload(this, finalUri, resType, new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          runOnUiThread(() -> {
                              // Remove placeholder
                              for (int i = 0; i < messages.size(); i++)
                                  if (placeholder.id.equals(messages.get(i).id)) {
                                      messages.remove(i); adapter.notifyItemRemoved(i); break;
                                  }
                              Message m = newMessageBase(typeFor(rc));
                              m.mediaUrl = url; m.duration = dur;
                              m.fileName = fileName; m.fileSize = size;
                              if (rc == RC_GALLERY || rc == RC_CAMERA) m.viewOnce = nextIsViewOnce;
                              if (videoThumb != null) {
                                  CloudinaryUploader.upload(ChatActivity.this, videoThumb, "image",
                                      new CloudinaryUploader.Callback() {
                                          @Override public void onSuccess(String tu) {
                                              m.thumbnailUrl = tu; pushMessage(m);
                                          }
                                          @Override public void onError(String s) { pushMessage(m); }
                                      });
                              } else pushMessage(m);
                          });
                      }
                      @Override public void onError(String s) {
                          runOnUiThread(() -> {
                              for (int i = 0; i < messages.size(); i++)
                                  if (placeholder.id.equals(messages.get(i).id)) {
                                      messages.get(i).status = "failed";
                                      adapter.notifyItemChanged(i); break;
                                  }
                              Toast.makeText(ChatActivity.this, "Upload failed: " + s, Toast.LENGTH_LONG).show();
                          });
                      }
                  });
              }
              private String typeFor(int rc) {
                  switch (rc) { case RC_VIDEO: return "video";
                                case RC_AUDIO: return "audio";
                                case RC_FILE:  return "file";
                                default: return "image"; }
              }
              private void openMedia(Message m) {
                  if (m.mediaUrl == null) return;
                  Intent i = new Intent(this, MediaViewerActivity.class);
                  i.putExtra("url", m.mediaUrl); i.putExtra("type", m.type);
                  startActivity(i);
              }
              // ================= MESSAGE OPTIONS =================
