              private void setupSwipeToReply() {
                  ItemTouchHelper.SimpleCallback cb = new ItemTouchHelper.SimpleCallback(0,
                      ItemTouchHelper.RIGHT | ItemTouchHelper.LEFT) {
                      @Override public boolean onMove(@NonNull RecyclerView r,
                          @NonNull RecyclerView.ViewHolder a, @NonNull RecyclerView.ViewHolder b) { return false; }
                      @Override public void onSwiped(@NonNull RecyclerView.ViewHolder vh, int dir) {
                          int pos = vh.getAdapterPosition();
                          if (pos < 0 || pos >= messages.size()) return;
                          Message m = messages.get(pos);
                          startReply(m);
                          adapter.notifyItemChanged(pos);
                      }
                      @Override public void onChildDraw(@NonNull Canvas c, @NonNull RecyclerView r,
                          @NonNull RecyclerView.ViewHolder vh, float dX, float dY,
                          int actionState, boolean isCurrentlyActive) {
                          // Limit translation to 80dp visually
                          float max = 200f;
                          float dx2 = Math.max(-max, Math.min(max, dX / 2));
                          super.onChildDraw(c, r, vh, dx2, dY, actionState, isCurrentlyActive);
                      }
                  };
                  new ItemTouchHelper(cb).attachToRecyclerView(rv);
              }
