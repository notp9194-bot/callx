          package com.callx.app.fragments;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import androidx.annotation.NonNull;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.activities.NewStatusActivity;
          import com.callx.app.activities.StatusViewerActivity;
          import com.callx.app.adapters.StatusAdapter;
          import com.callx.app.models.StatusItem;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.*;
          public class StatusFragment extends Fragment {
              private List<StatusItem> data = new ArrayList<>();
              private StatusAdapter adapter;
              @Override public View onCreateView(@NonNull LayoutInflater i, ViewGroup p, Bundle s) {
                  View root = i.inflate(R.layout.fragment_status, p, false);
                  RecyclerView rv = root.findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  adapter = new StatusAdapter(getContext(), data, ownerUid -> {
                      Intent it = new Intent(getActivity(), StatusViewerActivity.class);
                      it.putExtra("ownerUid", ownerUid); startActivity(it);
                  });
                  rv.setAdapter(adapter);
                  root.findViewById(R.id.fab_new_status).setOnClickListener(v ->
                      startActivity(new Intent(getActivity(), NewStatusActivity.class)));
                  load();
                  return root;
              }
              private void load() {
                  FirebaseUtils.status().addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          data.clear();
                          long cutoff = System.currentTimeMillis() - 24L*60*60*1000;
                          for (DataSnapshot owner : d.getChildren()) {
                              StatusItem latest = null;
                              for (DataSnapshot it : owner.getChildren()) {
                                  StatusItem si = it.getValue(StatusItem.class);
                                  if (si == null || si.timestamp == null || si.timestamp < cutoff) continue;
                                  if (latest == null || si.timestamp > latest.timestamp) latest = si;
                              }
                              if (latest != null) { latest.ownerUid = owner.getKey(); data.add(latest); }
                          }
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
          }
          ENDOFFILE

