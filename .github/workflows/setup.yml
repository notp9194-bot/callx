          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.LayoutInflater;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ImageButton;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.bumptech.glide.Glide;
          import com.callx.app.R;
          import com.callx.app.adapters.MessageAdapter;
          import com.callx.app.crypto.AesCrypto;
          import com.callx.app.models.Message;
          import com.callx.app.utils.*;
          import com.google.android.material.appbar.MaterialToolbar;
          import com.google.android.material.bottomsheet.BottomSheetDialog;
          import com.google.firebase.database.*;
          import org.json.JSONObject;
          import java.util.*;
          public class ChatActivity extends AppCompatActivity {
              public static final String EXTRA_UID  = "uid";
              public static final String EXTRA_NAME = "name";
              public static final String EXTRA_PHOTO = "photo";
              private String otherUid, otherName, otherPhoto, chatKey;
              private RecyclerView rv;
              private MessageAdapter adapter;
              private List<Message> messages = new ArrayList<>();
              private EditText etMessage;
              private ImageButton btnSend, btnMic, btnAttach, btnCamera;
              private MaterialToolbar toolbar;
              private LinearLayout llReplyPreview, llEditPreview;
              private TextView tvReplyToName, tvReplyToText, tvEditText;
              private ImageView ivWallpaper;
              private Message replyTo, editing;
              private SharedPreferences sp;
              private DatabaseReference msgRef, typingRef, presenceRef;
              private ChildEventListener msgsListener;
              private ValueEventListener typingListener, presenceListener, blockListener;
              private boolean theyBlockedMe = false, iBlockedThem = false;
              private boolean nextIsViewOnce = false;
              private String chatAesKey;
              private AudioRecorderHelper recorder = new AudioRecorderHelper();
              private boolean recording = false;

              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_chat);
                  otherUid  = getIntent().getStringExtra(EXTRA_UID);
                  otherName = getIntent().getStringExtra(EXTRA_NAME);
                  otherPhoto= getIntent().getStringExtra(EXTRA_PHOTO);
                  chatKey   = FirebaseUtils.chatKey(FirebaseUtils.myUid(), otherUid);
                  sp = PrefsManager.sp();
                  bind();
                  setupToolbar();
                  setupRv();
                  setupSendBar();
                  loadWallpaper();
                  ensureChatKey();
                  loadMessages();
                  watchPresenceAndTyping();
                  watchBlockState();
              }
              private void bind() {
                  rv = findViewById(R.id.rv_messages);
                  toolbar = findViewById(R.id.toolbar);
                  etMessage = findViewById(R.id.et_message);
                  btnSend = findViewById(R.id.btn_send);
                  btnMic  = findViewById(R.id.btn_mic);
                  btnAttach = findViewById(R.id.btn_attach);
                  btnCamera = findViewById(R.id.btn_camera);
                  llReplyPreview = findViewById(R.id.ll_reply_preview);
                  llEditPreview  = findViewById(R.id.ll_edit_preview);
                  tvReplyToName = findViewById(R.id.tv_reply_to_name);
                  tvReplyToText = findViewById(R.id.tv_reply_to_text);
                  tvEditText    = findViewById(R.id.tv_edit_text);
                  ivWallpaper   = findViewById(R.id.iv_wallpaper);
                  findViewById(R.id.btn_close_reply).setOnClickListener(v -> { replyTo = null; llReplyPreview.setVisibility(View.GONE); });
                  findViewById(R.id.btn_close_edit ).setOnClickListener(v -> { editing  = null; llEditPreview.setVisibility(View.GONE); etMessage.setText(""); });
              }
              private void setupToolbar() {
                  setSupportActionBar(toolbar);
                  toolbar.setNavigationOnClickListener(v -> finish());
                  toolbar.setTitle(otherName);
                  toolbar.setSubtitle("");
              }
              private void setupRv() {
                  LinearLayoutManager lm = new LinearLayoutManager(this);
                  lm.setStackFromEnd(true);
                  rv.setLayoutManager(lm);
                  adapter = new MessageAdapter(this, messages, FirebaseUtils.myUid(), false);
                  adapter.setListener(new MessageAdapter.Listener() {
                      @Override public void onLongPress(Message m) { showOptions(m); }
                      @Override public void onReact(Message m, String emoji) { addReaction(m, emoji); }
                      @Override public void onMediaTap(Message m) { openMedia(m); }
                  });
                  rv.setAdapter(adapter);
              }
              private void setupSendBar() {
                  toggleSendMicBtn();
                  etMessage.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int a, int b, int c) {}
                      @Override public void onTextChanged(CharSequence s, int a, int b, int c) {
                          toggleSendMicBtn();
                          PresenceManager.setTyping(chatKey, s.length() > 0);
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });
                  btnSend.setOnClickListener(v -> sendText());
                  btnMic.setOnClickListener(v -> toggleRecord());
                  btnAttach.setOnClickListener(v -> showAttachSheet());
                  btnCamera.setOnClickListener(v -> openCameraImage());
              }
              private void toggleSendMicBtn() {
                  boolean has = etMessage.getText().toString().trim().length() > 0;
                  btnSend.setVisibility(has ? View.VISIBLE : View.GONE);
                  btnMic.setVisibility(has ? View.GONE : View.VISIBLE);
              }
              private void loadWallpaper() {
                  String custom = PrefsManager.customWallpaperUrl(chatKey);
                  if (custom != null && !custom.isEmpty()) {
                      com.bumptech.glide.Glide.with(this).load(custom).into(ivWallpaper);
                      return;
                  }
                  int w = PrefsManager.wallpaperFor(chatKey);
                  int[] res = { R.drawable.wallpaper_1, R.drawable.wallpaper_2, R.drawable.wallpaper_3 };
                  ivWallpaper.setImageResource(res[Math.max(0, Math.min(2, w))]);
              }
              /** Derive per-chat AES key from ECDH key exchange (falls back to deterministic seed). */
              private void ensureChatKey() {
                  com.callx.app.utils.KeyExchangeHelper.deriveChatKey(otherUid, key -> {
                      chatAesKey = key;
                  });
              }
              // ================= MESSAGING =================
              private void loadMessages() {
                  msgRef = FirebaseUtils.chats().child(chatKey).child("messages");
                  msgsListener = new ChildEventListener() {
                      @Override public void onChildAdded(@NonNull DataSnapshot s, String prev) {
                          Message m = parse(s);
                          if (m == null || isExpired(m) || isHiddenForMe(m)) return;
                          messages.add(m);
                          adapter.notifyItemInserted(messages.size() - 1);
                          rv.scrollToPosition(messages.size() - 1);
                          markDeliveredAndSeen(m);
                      }
                      @Override public void onChildChanged(@NonNull DataSnapshot s, String prev) {
                          Message m = parse(s);
                          if (m == null) return;
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(m.id)) {
                                  if (Boolean.TRUE.equals(m.deletedForAll) || isHiddenForMe(m)) {
                                      messages.remove(i); adapter.notifyItemRemoved(i);
                                  } else {
                                      messages.set(i, m); adapter.notifyItemChanged(i);
                                  }
                                  break;
                              }
                      }
                      @Override public void onChildRemoved(@NonNull DataSnapshot s) {
                          String id = s.getKey();
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(id)) {
                                  messages.remove(i); adapter.notifyItemRemoved(i); break;
                              }
                      }
                      @Override public void onChildMoved(@NonNull DataSnapshot s, String prev) {}
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  msgRef.orderByChild("timestamp").addChildEventListener(msgsListener);
              }
              private Message parse(DataSnapshot s) {
                  try {
                      Message m = s.getValue(Message.class);
                      if (m != null) {
                          m.id = s.getKey();
                          // Decrypt text if encrypted
                          if (m.encrypted != null && chatAesKey != null) {
                              m.text = AesCrypto.decrypt(m.encrypted, chatAesKey);
                          }
                      }
                      return m;
                  } catch (Exception e) { return null; }
              }
              private boolean isExpired(Message m) {
                  return m.expiresAt != null && m.expiresAt > 0 && m.expiresAt < System.currentTimeMillis();
              }
              private boolean isHiddenForMe(Message m) {
                  if (sp.getBoolean("hidden_" + m.id, false)) return true;
                  if (m.hiddenFor == null || FirebaseUtils.myUid() == null) return false;
                  return Boolean.TRUE.equals(m.hiddenFor.get(FirebaseUtils.myUid()));
              }
              private void markDeliveredAndSeen(Message m) {
                  if (m.senderId == null || m.senderId.equals(FirebaseUtils.myUid())) return;
                  String me = FirebaseUtils.myUid();
                  msgRef.child(m.id).child("deliveredTo").child(me).setValue(System.currentTimeMillis());
                  if (PrefsManager.readReceiptsEnabled()) {
                      msgRef.child(m.id).child("seenBy").child(me).setValue(System.currentTimeMillis());
                      msgRef.child(m.id).child("status").setValue("seen");
                  } else {
                      msgRef.child(m.id).child("status").setValue("delivered");
                  }
                  if (Boolean.TRUE.equals(m.viewOnce)) {
                      msgRef.child(m.id).child("viewed").setValue(true);
                  }
              }
              private void sendText() {
                  String text = etMessage.getText().toString().trim();
                  if (text.isEmpty() || iBlockedThem || theyBlockedMe) return;
                  if (editing != null) { applyEdit(editing, text); return; }
                  Message m = newMessageBase("text"); m.text = text;
                  pushMessage(m);
                  etMessage.setText("");
                  PresenceManager.setTyping(chatKey, false);
              }
              private Message newMessageBase(String type) {
                  Message m = new Message();
                  m.senderId = FirebaseUtils.myUid();
                  m.senderName = "Me";
                  m.type = type;
                  m.timestamp = System.currentTimeMillis();
                  m.status = "sending";
                  long disappear = PrefsManager.disappearFor(chatKey);
                  if (disappear > 0) m.expiresAt = m.timestamp + disappear;
                  if (replyTo != null) {
                      m.replyToId = replyTo.id;
                      m.replyToName = replyTo.senderName;
                      m.replyToText = replyTo.text != null ? replyTo.text : "[" + replyTo.type + "]";
                  }
                  return m;
              }
              private void pushMessage(Message m) {
                  // Encrypt text payload if key present
                  if (m.text != null && chatAesKey != null) {
                      m.encrypted = AesCrypto.encrypt(m.text, chatAesKey);
                      m.text = null;
                  }
                  String id = msgRef.push().getKey();
                  m.id = id;
                  m.status = "sent";
                  msgRef.child(id).setValue(m);
                  // Last message preview meta
                  Map<String, Object> meta = new HashMap<>();
                  String preview = m.encrypted != null ? "🔒 message" : (
                      m.text != null ? m.text : "[" + m.type + "]");
                  meta.put("lastMessage", preview);
                  meta.put("lastMessageAt", m.timestamp);
                  FirebaseUtils.chats().child(chatKey).child("_meta").updateChildren(meta);
                  // Update both users' chat-list entries
                  Map<String, Object> myEntry = new HashMap<>();
                  myEntry.put("partnerUid", otherUid);
                  myEntry.put("partnerName", otherName);
                  myEntry.put("partnerPhoto", otherPhoto);
                  myEntry.put("lastMessage", preview);
                  myEntry.put("lastMessageAt", m.timestamp);
                  FirebaseUtils.users().child(FirebaseUtils.myUid()).child("chats").child(otherUid).updateChildren(myEntry);
                  Map<String, Object> theirEntry = new HashMap<>();
                  theirEntry.put("partnerUid", FirebaseUtils.myUid());
                  theirEntry.put("partnerName", "");
                  theirEntry.put("partnerPhoto", "");
                  theirEntry.put("lastMessage", preview);
                  theirEntry.put("lastMessageAt", m.timestamp);
                  theirEntry.put("unread", ServerValue.increment(1));
                  FirebaseUtils.users().child(otherUid).child("chats").child(FirebaseUtils.myUid()).updateChildren(theirEntry);
                  // Push notification
                  try {
                      JSONObject body = new JSONObject();
                      body.put("toUid", otherUid);
                      body.put("fromUid", FirebaseUtils.myUid());
                      body.put("title", otherName);
                      body.put("body", preview);
                      body.put("type", "message");
                      PushNotify.send("/notify/message", body);
                  } catch (Exception ignored) {}
                  replyTo = null; llReplyPreview.setVisibility(View.GONE);
                  nextIsViewOnce = false;
              }
              // ================= ATTACHMENTS =================
              private static final int RC_GALLERY = 101, RC_VIDEO = 102, RC_AUDIO = 103,
                                       RC_FILE = 104, RC_CAMERA = 105;
              private void showAttachSheet() {
                  BottomSheetDialog bsd = new BottomSheetDialog(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.bottom_sheet_attach, null);
                  bsd.setContentView(v);
                  v.findViewById(R.id.opt_gallery).setOnClickListener(x -> { bsd.dismiss(); pick("image/*", RC_GALLERY); });
                  v.findViewById(R.id.opt_video).setOnClickListener(x -> { bsd.dismiss(); pick("video/*", RC_VIDEO); });
                  v.findViewById(R.id.opt_audio).setOnClickListener(x -> { bsd.dismiss(); pick("audio/*", RC_AUDIO); });
                  v.findViewById(R.id.opt_file).setOnClickListener(x -> { bsd.dismiss(); pick("*/*", RC_FILE); });
                  v.findViewById(R.id.opt_location).setOnClickListener(x -> { bsd.dismiss();
                      startActivityForResult(new Intent(this, LocationShareActivity.class), 200); });
                  v.findViewById(R.id.opt_contact).setOnClickListener(x -> { bsd.dismiss();
                      startActivityForResult(new Intent(this, ContactsPickerActivity.class), 201); });
                  v.findViewById(R.id.opt_view_once).setOnClickListener(x -> { bsd.dismiss();
                      nextIsViewOnce = true;
                      // Let user choose image or video for view-once
                      new AlertDialog.Builder(this).setTitle("View-once")
                          .setItems(new String[]{"Image", "Video"}, (dlg, w) -> {
                              if (w == 0) pick("image/*", RC_GALLERY);
                              else        pick("video/*", RC_VIDEO);
                          }).show();
                  });
                  bsd.show();
              }
              private void pick(String mime, int rc) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(mime);
                  startActivityForResult(i, rc);
              }
              private void openCameraImage() { pick("image/*", RC_CAMERA); }
              @Override protected void onActivityResult(int rc, int resCode, Intent data) {
                  super.onActivityResult(rc, resCode, data);
                  if (resCode != Activity.RESULT_OK || data == null) return;
                  if (rc == 200) {
                      double lat = data.getDoubleExtra("lat", 0);
                      double lng = data.getDoubleExtra("lng", 0);
                      Message m = newMessageBase("location"); m.lat = lat; m.lng = lng;
                      pushMessage(m); return;
                  }
                  if (rc == 201) {
                      Message m = newMessageBase("contact");
                      m.contactName = data.getStringExtra("name");
                      m.contactPhone = data.getStringExtra("phone");
                      pushMessage(m); return;
                  }
                  Uri uri = data.getData(); if (uri == null) return;
                  String resType = (rc == RC_AUDIO) ? "video" : (rc == RC_FILE ? "raw" : "auto");
                  // For video, also generate thumbnail
                  Uri videoThumb = (rc == RC_VIDEO) ? FileUtils.makeVideoThumb(this, uri) : null;
                  long dur = (rc == RC_AUDIO || rc == RC_VIDEO) ? FileUtils.getDurationMs(this, uri) : 0;
                  String fileName = FileUtils.getName(this, uri);
                  long size = FileUtils.getSize(this, uri);
                  CloudinaryUploader.upload(this, uri, resType, new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          runOnUiThread(() -> {
                              Message m = newMessageBase(typeFor(rc));
                              m.mediaUrl = url; m.duration = dur;
                              m.fileName = fileName; m.fileSize = size;
                              if (videoThumb != null) {
                                  CloudinaryUploader.upload(ChatActivity.this, videoThumb, "image",
                                      new CloudinaryUploader.Callback() {
                                          @Override public void onSuccess(String tu) {
                                              m.thumbnailUrl = tu; pushMessage(m);
                                          }
                                          @Override public void onError(String s) { pushMessage(m); }
                                      });
                              } else {
                                  if (rc == RC_GALLERY || rc == RC_CAMERA) m.viewOnce = nextIsViewOnce;
                                  pushMessage(m);
                              }
                          });
                      }
                      @Override public void onError(String s) {
                          runOnUiThread(() -> Toast.makeText(ChatActivity.this, "Upload failed: " + s, Toast.LENGTH_LONG).show());
                      }
                  });
              }
              private String typeFor(int rc) {
                  switch (rc) { case RC_VIDEO: return "video";
                                case RC_AUDIO: return "audio";
                                case RC_FILE:  return "file";
                                default: return "image"; }
              }
              private void openMedia(Message m) {
                  if (m.mediaUrl == null) return;
                  Intent i = new Intent(this, MediaViewerActivity.class);
                  i.putExtra("url", m.mediaUrl);
                  i.putExtra("type", m.type);
                  startActivity(i);
              }
              // ================= LONG-PRESS OPTIONS =================
              private void showOptions(Message m) {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.dialog_message_options, null);
                  AlertDialog d = b.setView(v).create();
                  // Reactions
                  int[] ids = { R.id.r1, R.id.r2, R.id.r3, R.id.r4, R.id.r5, R.id.r6 };
                  for (int id : ids) {
                      TextView t = v.findViewById(id);
                      t.setOnClickListener(x -> { addReaction(m, (String) t.getTag()); d.dismiss(); });
                  }
                  v.findViewById(R.id.opt_reply).setOnClickListener(x -> { startReply(m); d.dismiss(); });
                  v.findViewById(R.id.opt_forward).setOnClickListener(x -> { forward(m); d.dismiss(); });
                  v.findViewById(R.id.opt_copy).setOnClickListener(x -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("msg", m.text == null ? "" : m.text));
                      Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show();
                      d.dismiss();
                  });
                  v.findViewById(R.id.opt_star).setOnClickListener(x -> { toggleStar(m); d.dismiss(); });
                  View edit = v.findViewById(R.id.opt_edit);
                  View delAll = v.findViewById(R.id.opt_delete_all);
                  boolean mine = m.senderId != null && m.senderId.equals(FirebaseUtils.myUid());
                  edit.setVisibility(mine && "text".equals(m.type) ? View.VISIBLE : View.GONE);
                  delAll.setVisibility(mine ? View.VISIBLE : View.GONE);
                  edit.setOnClickListener(x -> { startEdit(m); d.dismiss(); });
                  v.findViewById(R.id.opt_delete_me).setOnClickListener(x -> { hideForMe(m); d.dismiss(); });
                  delAll.setOnClickListener(x -> { deleteForAll(m); d.dismiss(); });
                  v.findViewById(R.id.opt_info).setOnClickListener(x -> { showInfo(m); d.dismiss(); });
                  d.show();
              }
              private void addReaction(Message m, String emoji) {
                  String me = FirebaseUtils.myUid();
                  if (m.id == null || me == null) return;
                  msgRef.child(m.id).child("reactions").child(emoji).child(me).setValue(System.currentTimeMillis());
              }
              private void startReply(Message m) {
                  replyTo = m;
                  llReplyPreview.setVisibility(View.VISIBLE);
                  tvReplyToName.setText(m.senderName == null ? "" : m.senderName);
                  tvReplyToText.setText(m.text == null ? ("[" + m.type + "]") : m.text);
              }
              private void startEdit(Message m) {
                  editing = m;
                  llEditPreview.setVisibility(View.VISIBLE);
                  tvEditText.setText(m.text == null ? "" : m.text);
                  etMessage.setText(m.text == null ? "" : m.text);
                  etMessage.setSelection(etMessage.getText().length());
              }
              private void applyEdit(Message m, String newText) {
                  Map<String, Object> u = new HashMap<>();
                  u.put("encrypted", chatAesKey == null ? null : AesCrypto.encrypt(newText, chatAesKey));
                  u.put("text",      chatAesKey == null ? newText : null);
                  u.put("edited", true);
                  msgRef.child(m.id).updateChildren(u);
                  editing = null; llEditPreview.setVisibility(View.GONE); etMessage.setText("");
              }
              private void hideForMe(Message m) {
                  sp.edit().putBoolean("hidden_" + m.id, true).apply();
                  // Sync hidden state to cloud so it persists across re-installs / devices
                  String me = FirebaseUtils.myUid();
                  if (me != null && m.id != null)
                      msgRef.child(m.id).child("hiddenFor").child(me).setValue(true);
                  for (int i = 0; i < messages.size(); i++)
                      if (messages.get(i).id.equals(m.id)) {
                          messages.remove(i); adapter.notifyItemRemoved(i); break;
                      }
              }
              private void deleteForAll(Message m) {
                  Map<String, Object> u = new HashMap<>();
                  u.put("deletedForAll", true);
                  u.put("text", null); u.put("encrypted", null);
                  u.put("mediaUrl", null); u.put("thumbnailUrl", null);
                  msgRef.child(m.id).updateChildren(u);
              }
              private void toggleStar(Message m) {
                  String me = FirebaseUtils.myUid();
                  DatabaseReference s = FirebaseUtils.starred().child(me).child(m.id);
                  s.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot d) {
                          if (d.exists()) s.removeValue();
                          else {
                              Map<String,Object> mp = new HashMap<>();
                              mp.put("chatKey", chatKey); mp.put("at", System.currentTimeMillis());
                              mp.put("preview", m.text != null ? m.text : "[" + m.type + "]");
                              s.setValue(mp);
                          }
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
              private void forward(Message m) {
                  Intent i = new Intent(this, ForwardActivity.class);
                  i.putExtra("text", m.text);
                  i.putExtra("type", m.type);
                  i.putExtra("mediaUrl", m.mediaUrl);
                  startActivity(i);
              }
              private void showInfo(Message m) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Sent: ").append(new Date(m.timestamp)).append("\n");
                  sb.append("Status: ").append(m.status).append("\n");
                  if (m.deliveredTo != null) sb.append("Delivered: ").append(m.deliveredTo.size()).append("\n");
                  if (m.seenBy != null) sb.append("Seen by: ").append(m.seenBy.size()).append("\n");
                  new AlertDialog.Builder(this).setTitle("Message info")
                      .setMessage(sb.toString()).setPositiveButton("OK", null).show();
              }
              // ================= AUDIO RECORD =================
              private void toggleRecord() {
                  if (!recording) {
                      try { recorder.start(this); recording = true;
                          Toast.makeText(this, "Recording...", Toast.LENGTH_SHORT).show(); }
                      catch (Exception e) { Toast.makeText(this, "Mic error", Toast.LENGTH_SHORT).show(); }
                  } else {
                      java.io.File f = recorder.stop(); recording = false;
                      if (f != null && f.exists()) {
                          long dur = FileUtils.getDurationMs(this, Uri.fromFile(f));
                          CloudinaryUploader.upload(this, Uri.fromFile(f), "video", new CloudinaryUploader.Callback() {
                              @Override public void onSuccess(String url) {
                                  runOnUiThread(() -> {
                                      Message m = newMessageBase("audio");
                                      m.mediaUrl = url; m.duration = dur;
                                      pushMessage(m);
                                  });
                              }
                              @Override public void onError(String s) {}
                          });
                      }
                  }
              }
              // ================= PRESENCE / TYPING / BLOCK =================
              private void watchPresenceAndTyping() {
                  presenceRef = FirebaseUtils.presence().child(otherUid);
                  presenceListener = new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          Boolean on = s.child("online").getValue(Boolean.class);
                          Long at = s.child("at").getValue(Long.class);
                          String sub = (Boolean.TRUE.equals(on)) ? getString(R.string.online)
                              : (at == null ? "" : "last seen " + relTime(at));
                          toolbar.setSubtitle(sub);
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  presenceRef.addValueEventListener(presenceListener);
                  typingRef = FirebaseUtils.typing().child(chatKey).child(otherUid);
                  typingListener = new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          if (s.exists()) toolbar.setSubtitle(getString(R.string.typing));
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  typingRef.addValueEventListener(typingListener);
              }
              private void watchBlockState() {
                  blockListener = new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          iBlockedThem = s.child("byMe").exists();
                          theyBlockedMe = s.child("byOther").exists();
                          findViewById(R.id.banner_block).setVisibility(
                              (iBlockedThem || theyBlockedMe) ? View.VISIBLE : View.GONE);
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  String me = FirebaseUtils.myUid();
                  FirebaseUtils.blocks().child(me).child(otherUid).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          iBlockedThem = s.exists();
                          findViewById(R.id.banner_block).setVisibility(
                              (iBlockedThem || theyBlockedMe) ? View.VISIBLE : View.GONE);
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
                  FirebaseUtils.blocks().child(otherUid).child(me).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          theyBlockedMe = s.exists();
                          findViewById(R.id.banner_block).setVisibility(
                              (iBlockedThem || theyBlockedMe) ? View.VISIBLE : View.GONE);
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
              private String relTime(long at) {
                  long diff = System.currentTimeMillis() - at;
                  if (diff < 60_000) return "just now";
                  if (diff < 3600_000) return (diff / 60_000) + "m ago";
                  if (diff < 86400_000) return (diff / 3600_000) + "h ago";
                  return (diff / 86400_000) + "d ago";
              }
              // ================= MENU =================
              @Override public boolean onCreateOptionsMenu(Menu m) {
                  getMenuInflater().inflate(R.menu.chat_menu, m); return true;
              }
              @Override public boolean onOptionsItemSelected(@NonNull MenuItem it) {
                  int id = it.getItemId();
                  if (id == R.id.action_voice_call) { startCall(false); return true; }
                  if (id == R.id.action_video_call) { startCall(true); return true; }
                  if (id == R.id.action_search)     {
                      Intent i = new Intent(this, SearchInChatActivity.class);
                      i.putExtra("chatKey", chatKey); startActivity(i); return true; }
                  if (id == R.id.action_view_contact) {
                      Toast.makeText(this, otherName, Toast.LENGTH_SHORT).show(); return true; }
                  if (id == R.id.action_wallpaper) {
                      Intent i = new Intent(this, WallpaperPickerActivity.class);
                      i.putExtra("chatKey", chatKey);
                      startActivityForResult(i, 999); return true; }
                  if (id == R.id.action_disappearing) { askDisappear(); return true; }
                  if (id == R.id.action_mute) {
                      boolean cur = PrefsManager.isMuted(chatKey);
                      PrefsManager.setMuted(chatKey, !cur);
                      Toast.makeText(this, (!cur ? "Muted" : "Unmuted"), Toast.LENGTH_SHORT).show();
                      return true; }
                  if (id == R.id.action_block) {
                      if (iBlockedThem) BlockManager.unblock(otherUid);
                      else BlockManager.block(otherUid);
                      return true; }
                  if (id == R.id.action_clear_chat) {
                      msgRef.removeValue();
                      messages.clear(); adapter.notifyDataSetChanged();
                      return true; }
                  return super.onOptionsItemSelected(it);
              }
              private void askDisappear() {
                  String[] opts = {"Off", "24 hours", "7 days", "90 days"};
                  long[] ms = {0, 86400_000L, 7L*86400_000L, 90L*86400_000L};
                  new AlertDialog.Builder(this).setTitle("Disappearing messages")
                      .setItems(opts, (d, w) -> {
                          PrefsManager.setDisappear(chatKey, ms[w]);
                          Toast.makeText(this, "Set: " + opts[w], Toast.LENGTH_SHORT).show();
                      }).show();
              }
              private void startCall(boolean video) {
                  if (iBlockedThem || theyBlockedMe) {
                      Toast.makeText(this, "Cannot call: blocked", Toast.LENGTH_SHORT).show(); return;
                  }
                  Intent i = new Intent(this, CallActivity.class);
                  i.putExtra(CallActivity.EXTRA_PEER_UID, otherUid);
                  i.putExtra(CallActivity.EXTRA_PEER_NAME, otherName);
                  i.putExtra(CallActivity.EXTRA_IS_CALLER, true);
                  i.putExtra(CallActivity.EXTRA_VIDEO, video);
                  i.putExtra(CallActivity.EXTRA_CALL_ID, "call_" + chatKey + "_" + System.currentTimeMillis());
                  startActivity(i);
              }
              @Override protected void onDestroy() {
                  super.onDestroy();
                  if (msgRef != null && msgsListener != null) msgRef.removeEventListener(msgsListener);
                  if (presenceRef != null && presenceListener != null) presenceRef.removeEventListener(presenceListener);
                  if (typingRef != null && typingListener != null) typingRef.removeEventListener(typingListener);
                  PresenceManager.setTyping(chatKey, false);
              }
              @Override protected void onResume() {
                  super.onResume();
                  // Reset unread for me
                  FirebaseUtils.users().child(FirebaseUtils.myUid())
                      .child("chats").child(otherUid).child("unread").setValue(0);
              }
          }
