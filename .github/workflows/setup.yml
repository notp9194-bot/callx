          cat > app/src/main/java/com/callx/app/crypto/AesCrypto.java << 'ENDOFFILE'
          package com.callx.app.crypto;
          import android.util.Base64;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.SecretKeySpec;
          import java.security.SecureRandom;
          public class AesCrypto {
              private static final String AES = "AES/GCM/NoPadding";
              public static String genKeyBase64() throws Exception {
                  KeyGenerator kg = KeyGenerator.getInstance("AES");
                  kg.init(256);
                  SecretKey k = kg.generateKey();
                  return Base64.encodeToString(k.getEncoded(), Base64.NO_WRAP);
              }
              public static String encrypt(String plain, String keyB64) {
                  try {
                      byte[] key = Base64.decode(keyB64, Base64.NO_WRAP);
                      byte[] iv = new byte[12];
                      new SecureRandom().nextBytes(iv);
                      Cipher c = Cipher.getInstance(AES);
                      c.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(key, "AES"),
                          new GCMParameterSpec(128, iv));
                      byte[] ct = c.doFinal(plain.getBytes("UTF-8"));
                      byte[] out = new byte[iv.length + ct.length];
                      System.arraycopy(iv, 0, out, 0, iv.length);
                      System.arraycopy(ct, 0, out, iv.length, ct.length);
                      return Base64.encodeToString(out, Base64.NO_WRAP);
                  } catch (Exception e) { return plain; }
              }
              public static String decrypt(String b64, String keyB64) {
                  try {
                      byte[] data = Base64.decode(b64, Base64.NO_WRAP);
                      byte[] key  = Base64.decode(keyB64, Base64.NO_WRAP);
                      byte[] iv = new byte[12];
                      System.arraycopy(data, 0, iv, 0, 12);
                      byte[] ct = new byte[data.length - 12];
                      System.arraycopy(data, 12, ct, 0, ct.length);
                      Cipher c = Cipher.getInstance(AES);
                      c.init(Cipher.DECRYPT_MODE, new SecretKeySpec(key, "AES"),
                          new GCMParameterSpec(128, iv));
                      return new String(c.doFinal(ct), "UTF-8");
                  } catch (Exception e) { return b64; }
              }
          }
          ENDOFFILE

