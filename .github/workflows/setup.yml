          cat > app/src/main/java/com/callx/app/services/CallxMessagingService.java << 'ENDOFFILE'
          package com.callx.app.services;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.core.app.NotificationCompat;
          import com.callx.app.R;
          import com.callx.app.activities.IncomingCallActivity;
          import com.callx.app.utils.Constants;
          import com.callx.app.utils.FirebaseUtils;
          import com.callx.app.utils.PrefsManager;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;
          public class CallxMessagingService extends FirebaseMessagingService {
              @Override public void onNewToken(String token) {
                  String uid = FirebaseUtils.myUid();
                  if (uid != null) FirebaseUtils.users().child(uid).child("fcmToken").setValue(token);
              }
              @Override public void onMessageReceived(RemoteMessage rm) {
                  Map<String, String> d = rm.getData();
                  String type = d.get("type");
                  // Mute / archive check (1:1 chat) — skip notification if muted
                  String fromUid = d.get("fromUid");
                  String me = FirebaseUtils.myUid();
                  if ("message".equals(type) && fromUid != null && me != null) {
                      String chatKey = (me.compareTo(fromUid) < 0) ? me + "_" + fromUid : fromUid + "_" + me;
                      if (PrefsManager.isMuted(chatKey)) return;
                      // Archived: still notify but use silent channel? -> we just suppress sound
                  }
                  // Group mute check
                  String gid = d.get("gid");
                  if ("group".equals(type) && gid != null) {
                      if (PrefsManager.isMuted("group_" + gid)) return;
                  }
                  if ("call".equals(type)) showIncomingCall(d);
                  else if ("group".equals(type)) showNotif(d, Constants.CHANNEL_GROUPS);
                  else if ("status".equals(type)) showNotif(d, Constants.CHANNEL_STATUS);
                  else if ("mention".equals(type)) {
                      // Mentions always get high priority even if group is muted-by-default someday
                      showNotif(d, Constants.CHANNEL_GROUPS);
                  }
                  else showNotif(d, Constants.CHANNEL_MESSAGES);
              }
              private void showIncomingCall(Map<String, String> d) {
                  Intent i = new Intent(this, IncomingCallActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  i.putExtra("name", d.get("name"));
                  i.putExtra("fromUid", d.get("fromUid"));
                  i.putExtra("callId", d.get("callId"));
                  i.putExtra("video", "true".equals(d.get("video")));
                  startActivity(i);
              }
              private void showNotif(Map<String,String> d, String channel) {
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, channel)
                      .setSmallIcon(R.drawable.ic_message_notification)
                      .setContentTitle(d.get("title"))
                      .setContentText(d.get("body"))
                      .setAutoCancel(true);
                  ((NotificationManager) getSystemService(NOTIFICATION_SERVICE))
                      .notify((int) System.currentTimeMillis(), b.build());
              }
          }
          ENDOFFILE

          cat > app/src/main/java/com/callx/app/services/CallForegroundService.java << 'ENDOFFILE'
          package com.callx.app.services;
          import android.app.Notification;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;
          import com.callx.app.R;
          import com.callx.app.utils.Constants;
          public class CallForegroundService extends Service {
              @Override public IBinder onBind(Intent i) { return null; }
              @Override public int onStartCommand(Intent i, int flags, int sid) {
                  String peer = i == null ? "" : i.getStringExtra("peer");
                  boolean video = i != null && i.getBooleanExtra("video", false);
                  Notification n = new NotificationCompat.Builder(this, Constants.CHANNEL_ONGOING)
                      .setSmallIcon(R.drawable.ic_phone)
                      .setContentTitle(video ? "Video call" : "Voice call")
                      .setContentText(peer == null ? "" : peer)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build();
                  startForeground(7000, n);
                  return START_STICKY;
              }
          }
          ENDOFFILE

