              private void insertMention(MentionPickerAdapter.Item it) {
                  String text = etMessage.getText().toString();
                  int cursor = etMessage.getSelectionStart();
                  int at = text.lastIndexOf('@', cursor - 1);
                  if (at < 0) return;
                  String left = text.substring(0, at);
                  String right = text.substring(cursor);
                  String mention = "@" + it.handle + " ";
