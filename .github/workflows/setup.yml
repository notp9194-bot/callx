          # ============================================================
          # JAVA — CallxApp (notification channels + lifecycle observer for App lock)
          # ============================================================
          cat > app/src/main/java/com/callx/app/CallxApp.java << 'ENDOFFILE'
          package com.callx.app;
          import android.app.Application;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.os.Build;
          import androidx.lifecycle.DefaultLifecycleObserver;
          import androidx.lifecycle.LifecycleOwner;
          import androidx.lifecycle.ProcessLifecycleOwner;
          import com.callx.app.utils.Constants;
          import com.callx.app.utils.PrefsManager;
          public class CallxApp extends Application {
              public static long lastBackgroundedAt = 0;
              public static boolean isLocked = false;
              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();
                  PrefsManager.init(this);
                  // Schedule periodic cleanup of expired (disappearing) messages
                  com.callx.app.utils.DisappearWorker.schedule(this);
                  // Generate this device's E2E key (no-op if exists)
                  com.callx.app.utils.KeyExchangeHelper.ensureMyKey(null);
                  ProcessLifecycleOwner.get().getLifecycle()
                      .addObserver(new DefaultLifecycleObserver() {
                          @Override public void onStop(LifecycleOwner o) {
                              lastBackgroundedAt = System.currentTimeMillis();
                          }
                          @Override public void onStart(LifecycleOwner o) {
                              if (PrefsManager.isAppLockEnabled()
                                  && lastBackgroundedAt > 0
                                  && System.currentTimeMillis() - lastBackgroundedAt > 30_000L) {
                                  isLocked = true;
                              }
                          }
                      });
              }
              private void createChannels() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  AudioAttributes aa = new AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                  NotificationChannel calls = new NotificationChannel(Constants.CHANNEL_CALLS,
                      "Calls", NotificationManager.IMPORTANCE_HIGH);
                  calls.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), aa);
                  calls.enableVibration(true);
                  nm.createNotificationChannel(calls);
                  nm.createNotificationChannel(new NotificationChannel(Constants.CHANNEL_MESSAGES,
                      "Messages", NotificationManager.IMPORTANCE_HIGH));
                  nm.createNotificationChannel(new NotificationChannel(Constants.CHANNEL_GROUPS,
                      "Groups", NotificationManager.IMPORTANCE_HIGH));
                  nm.createNotificationChannel(new NotificationChannel(Constants.CHANNEL_STATUS,
                      "Status", NotificationManager.IMPORTANCE_DEFAULT));
                  nm.createNotificationChannel(new NotificationChannel(Constants.CHANNEL_ONGOING,
                      "Ongoing call", NotificationManager.IMPORTANCE_LOW));
              }
          }
          ENDOFFILE

          # ============================================================
          # JAVA — UTILS
          # ============================================================
          cat > app/src/main/java/com/callx/app/utils/PrefsManager.java << 'ENDOFFILE'
          package com.callx.app.utils;
          import android.content.Context;
          import android.content.SharedPreferences;
          public class PrefsManager {
              private static SharedPreferences sp;
              public static void init(Context c) {
                  sp = c.getSharedPreferences("callx_prefs", Context.MODE_PRIVATE);
              }
              public static SharedPreferences sp() { return sp; }
              public static boolean isAppLockEnabled() { return sp.getBoolean("app_lock", false); }
              public static void setAppLock(boolean v) { sp.edit().putBoolean("app_lock", v).apply(); }
              // App-lock PIN fallback (hashed)
              public static boolean hasPin() { return sp.getString("pin_hash", null) != null; }
              public static String getPinHash() { return sp.getString("pin_hash", null); }
              public static void setPinHash(String h) { sp.edit().putString("pin_hash", h).apply(); }
              public static void clearPin() { sp.edit().remove("pin_hash").apply(); }
              public static String lockMode() { return sp.getString("lock_mode", "biometric"); } // biometric | pin | both
              public static void setLockMode(String m) { sp.edit().putString("lock_mode", m).apply(); }
              public static boolean readReceiptsEnabled() { return sp.getBoolean("read_receipts", true); }
