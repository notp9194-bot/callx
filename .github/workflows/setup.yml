          package com.callx.app.activities;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.LayoutInflater;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ImageButton;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.adapters.MessageAdapter;
          import com.callx.app.models.Message;
          import com.callx.app.utils.*;
          import com.google.android.material.appbar.MaterialToolbar;
          import com.google.android.material.bottomsheet.BottomSheetDialog;
          import com.google.firebase.database.*;
          import org.json.JSONObject;
          import java.util.*;
          public class GroupChatActivity extends AppCompatActivity {
              public static final String EXTRA_GID = "gid";
              public static final String EXTRA_NAME = "name";
              private String gid, gname;
              private RecyclerView rv;
              private MessageAdapter adapter;
              private List<Message> messages = new ArrayList<>();
              private EditText etMessage;
              private ImageButton btnSend, btnMic, btnAttach;
              private DatabaseReference msgRef;
              private ChildEventListener msgsListener;
              private AudioRecorderHelper recorder = new AudioRecorderHelper();
              private boolean recording = false;
              private Message replyTo;

              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_chat);
                  gid = getIntent().getStringExtra(EXTRA_GID);
                  gname = getIntent().getStringExtra(EXTRA_NAME);
                  rv = findViewById(R.id.rv_messages);
                  etMessage = findViewById(R.id.et_message);
                  btnSend = findViewById(R.id.btn_send);
                  btnMic = findViewById(R.id.btn_mic);
                  btnAttach = findViewById(R.id.btn_attach);
                  MaterialToolbar tb = findViewById(R.id.toolbar);
                  setSupportActionBar(tb);
                  tb.setTitle(gname); tb.setSubtitle("Group");
                  tb.setNavigationOnClickListener(v -> finish());
                  tb.setOnClickListener(v -> {
                      Intent i = new Intent(this, GroupInfoActivity.class);
                      i.putExtra("gid", gid); startActivity(i);
                  });
                  LinearLayoutManager lm = new LinearLayoutManager(this); lm.setStackFromEnd(true);
                  rv.setLayoutManager(lm);
                  adapter = new MessageAdapter(this, messages, FirebaseUtils.myUid(), true);
                  adapter.setListener(new MessageAdapter.Listener() {
                      @Override public void onLongPress(Message m) { showOpts(m); }
                      @Override public void onReact(Message m, String emoji) { addReact(m, emoji); }
                      @Override public void onMediaTap(Message m) { openMedia(m); }
                  });
                  rv.setAdapter(adapter);
                  msgRef = FirebaseUtils.groups().child(gid).child("messages");
                  msgsListener = new ChildEventListener() {
                      @Override public void onChildAdded(@NonNull DataSnapshot s, String prev) {
                          Message m = s.getValue(Message.class);
                          if (m == null) return; m.id = s.getKey();
                          messages.add(m);
                          adapter.notifyItemInserted(messages.size() - 1);
                          rv.scrollToPosition(messages.size() - 1);
                          // Group read receipts: mark delivered/seen for messages from others
                          String me = FirebaseUtils.myUid();
                          if (me != null && m.senderId != null && !me.equals(m.senderId)) {
                              s.getRef().child("deliveredTo").child(me)
                                  .setValue(System.currentTimeMillis());
                              if (PrefsManager.readReceiptsEnabled())
                                  s.getRef().child("seenBy").child(me)
                                      .setValue(System.currentTimeMillis());
                          }
                      }
                      @Override public void onChildChanged(@NonNull DataSnapshot s, String prev) {
                          Message m = s.getValue(Message.class);
                          if (m == null) return; m.id = s.getKey();
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(m.id)) {
                                  messages.set(i, m); adapter.notifyItemChanged(i); break; }
                      }
                      @Override public void onChildRemoved(@NonNull DataSnapshot s) {
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(s.getKey())) {
                                  messages.remove(i); adapter.notifyItemRemoved(i); break; }
                      }
                      @Override public void onChildMoved(@NonNull DataSnapshot s, String p) {}
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  msgRef.addChildEventListener(msgsListener);
                  etMessage.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence cs, int a, int b, int c) {}
                      @Override public void onTextChanged(CharSequence cs, int a, int b, int c) {
                          boolean has = cs.toString().trim().length() > 0;
                          btnSend.setVisibility(has ? View.VISIBLE : View.GONE);
                          btnMic.setVisibility(has ? View.GONE : View.VISIBLE);
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });
                  btnSend.setOnClickListener(v -> sendText());
                  btnMic.setOnClickListener(v -> toggleRecord());
                  btnAttach.setOnClickListener(v -> showAttach());
              }
              private void sendText() {
                  String t = etMessage.getText().toString().trim();
                  if (t.isEmpty()) return;
                  final Message m = baseMsg("text"); m.text = t;
                  // Parse @mentions and resolve to uids before push
                  final List<String> tokens = MentionHelper.extract(t);
                  if (tokens.isEmpty()) { push(m); etMessage.setText(""); return; }
                  FirebaseUtils.groups().child(gid).child("members")
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot d) {
                              List<String> mems = new ArrayList<>();
                              for (DataSnapshot c : d.getChildren()) mems.add(c.getKey());
                              MentionResolver.resolve(tokens, mems, uids -> {
                                  m.mentions = uids;
                                  push(m);
                                  notifyMentions(uids, t);
                                  etMessage.setText("");
                              });
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {
                              push(m); etMessage.setText("");
                          }
                      });
              }
              private void notifyMentions(List<String> uids, String text) {
                  for (String uid : uids) {
                      if (uid.equals(FirebaseUtils.myUid())) continue;
                      try {
                          JSONObject body = new JSONObject();
                          body.put("type", "mention"); body.put("toUid", uid);
                          body.put("gid", gid); body.put("title", gname);
                          body.put("body", "@you: " + text);
                          PushNotify.send("/notify/mention", body);
                      } catch (Exception ignored) {}
                  }
              }
              private Message baseMsg(String type) {
                  Message m = new Message();
                  m.senderId = FirebaseUtils.myUid();
                  m.senderName = "Me";
                  m.type = type;
                  m.timestamp = System.currentTimeMillis();
                  m.status = "sent";
                  if (replyTo != null) {
                      m.replyToId = replyTo.id; m.replyToName = replyTo.senderName;
                      m.replyToText = replyTo.text != null ? replyTo.text : "[" + replyTo.type + "]";
                  }
                  return m;
              }
              private void push(Message m) {
                  String id = msgRef.push().getKey(); m.id = id;
                  msgRef.child(id).setValue(m);
                  Map<String, Object> meta = new HashMap<>();
                  String preview = m.text != null ? m.text : "[" + m.type + "]";
                  meta.put("lastMessage", preview);
                  meta.put("lastMessageAt", m.timestamp);
                  FirebaseUtils.groups().child(gid).updateChildren(meta);
                  try {
                      JSONObject body = new JSONObject();
                      body.put("gid", gid); body.put("title", gname);
                      body.put("body", preview); body.put("fromUid", FirebaseUtils.myUid());
                      PushNotify.send("/notify/group", body);
                  } catch (Exception ignored) {}
                  replyTo = null;
              }
              private void showAttach() {
                  BottomSheetDialog bsd = new BottomSheetDialog(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.bottom_sheet_attach, null);
                  bsd.setContentView(v);
                  v.findViewById(R.id.opt_gallery).setOnClickListener(x -> { bsd.dismiss(); pick("image/*"); });
                  v.findViewById(R.id.opt_video).setOnClickListener(x -> { bsd.dismiss(); pick("video/*"); });
                  v.findViewById(R.id.opt_audio).setOnClickListener(x -> { bsd.dismiss(); pick("audio/*"); });
                  v.findViewById(R.id.opt_file).setOnClickListener(x -> { bsd.dismiss(); pick("*/*"); });
                  bsd.show();
              }
              private String pickedMime;
              private void pick(String mime) {
                  pickedMime = mime;
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(mime);
                  startActivityForResult(i, 1);
              }
              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (res != Activity.RESULT_OK || d == null || d.getData() == null) return;
                  Uri u = d.getData();
                  String type = pickedMime.startsWith("image") ? "image"
                      : pickedMime.startsWith("video") ? "video"
                      : pickedMime.startsWith("audio") ? "audio" : "file";
                  String name = FileUtils.getName(this, u);
                  long size = FileUtils.getSize(this, u);
                  long dur  = "video".equals(type) || "audio".equals(type) ? FileUtils.getDurationMs(this, u) : 0;
                  Uri thumb = "video".equals(type) ? FileUtils.makeVideoThumb(this, u) : null;
                  String resType = "file".equals(type) ? "raw" : ("audio".equals(type) ? "video" : "auto");
                  CloudinaryUploader.upload(this, u, resType, new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          runOnUiThread(() -> {
                              Message m = baseMsg(type); m.mediaUrl = url;
                              m.duration = dur; m.fileName = name; m.fileSize = size;
                              if (thumb != null) {
                                  CloudinaryUploader.upload(GroupChatActivity.this, thumb, "image",
                                      new CloudinaryUploader.Callback() {
                                          @Override public void onSuccess(String tu) { m.thumbnailUrl = tu; push(m); }
                                          @Override public void onError(String s) { push(m); }
                                      });
                              } else push(m);
                          });
                      }
                      @Override public void onError(String s) {}
                  });
              }
              private void toggleRecord() {
                  if (!recording) {
                      try { recorder.start(this); recording = true; }
                      catch (Exception e) {}
                  } else {
                      java.io.File f = recorder.stop(); recording = false;
                      if (f != null) {
                          long dur = FileUtils.getDurationMs(this, Uri.fromFile(f));
                          CloudinaryUploader.upload(this, Uri.fromFile(f), "video",
                              new CloudinaryUploader.Callback() {
                                  @Override public void onSuccess(String url) {
                                      runOnUiThread(() -> {
                                          Message m = baseMsg("audio"); m.mediaUrl = url; m.duration = dur;
                                          push(m);
                                      });
                                  }
                                  @Override public void onError(String s) {}
                              });
                      }
                  }
              }
              private void openMedia(Message m) {
                  if (m.mediaUrl == null) return;
                  Intent i = new Intent(this, MediaViewerActivity.class);
                  i.putExtra("url", m.mediaUrl); i.putExtra("type", m.type);
                  startActivity(i);
              }
              private void showOpts(Message m) {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.dialog_message_options, null);
                  AlertDialog d = b.setView(v).create();
                  int[] ids = { R.id.r1, R.id.r2, R.id.r3, R.id.r4, R.id.r5, R.id.r6 };
                  for (int id : ids) {
                      View t = v.findViewById(id);
                      t.setOnClickListener(x -> { addReact(m, (String) ((android.widget.TextView) t).getTag()); d.dismiss(); });
                  }
                  v.findViewById(R.id.opt_reply).setOnClickListener(x -> { replyTo = m; d.dismiss(); });
                  v.findViewById(R.id.opt_forward).setOnClickListener(x -> {
                      Intent i = new Intent(this, ForwardActivity.class);
                      i.putExtra("text", m.text); i.putExtra("type", m.type); i.putExtra("mediaUrl", m.mediaUrl);
                      startActivity(i); d.dismiss(); });
                  v.findViewById(R.id.opt_delete_all).setOnClickListener(x -> {
                      msgRef.child(m.id).removeValue(); d.dismiss(); });
                  d.show();
              }
              private void addReact(Message m, String emoji) {
                  String me = FirebaseUtils.myUid();
                  msgRef.child(m.id).child("reactions").child(emoji).child(me).setValue(System.currentTimeMillis());
              }
              @Override public boolean onCreateOptionsMenu(Menu m) {
                  m.add(0, 1, 0, "Group info");
                  m.add(0, 2, 0, "Search");
                  return true;
              }
              @Override public boolean onOptionsItemSelected(@NonNull MenuItem it) {
                  if (it.getItemId() == 1) {
                      Intent i = new Intent(this, GroupInfoActivity.class); i.putExtra("gid", gid);
                      startActivity(i); return true;
                  }
                  if (it.getItemId() == 2) {
                      Intent i = new Intent(this, SearchInChatActivity.class);
                      i.putExtra("group", true); i.putExtra("gid", gid);
                      startActivity(i); return true;
                  }
                  return super.onOptionsItemSelected(it);
              }
              @Override protected void onDestroy() {
                  super.onDestroy();
                  if (msgRef != null && msgsListener != null) msgRef.removeEventListener(msgsListener);
              }
          }
