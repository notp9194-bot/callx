              <color name="action_call_reject">#EF4444</color>
              <color name="action_danger">#F87171</color>
              <color name="divider">#1E2538</color>
          </resources>
          ENDOFFILE

          cat > app/src/main/res/values/strings.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CallX</string>
              <string name="hint_email">Email</string>
              <string name="hint_password">Password</string>
              <string name="hint_message">Message…</string>
              <string name="btn_send">Send</string>
              <string name="tab_chats">Chats</string>
              <string name="tab_status">Status</string>
              <string name="tab_groups">Groups</string>
              <string name="tab_calls">Calls</string>
          </resources>
          ENDOFFILE

          # ============================================================
          # themes.xml — Material 3 + fullscreen variant
          # ============================================================
          cat > app/src/main/res/values/themes.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CallX" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/brand_primary</item>
                  <item name="colorPrimaryVariant">@color/brand_primary_dark</item>
                  <item name="colorSecondary">@color/brand_accent</item>
                  <item name="colorOnPrimary">@color/text_on_primary</item>
                  <item name="android:windowBackground">@color/surface_bg</item>
                  <item name="android:statusBarColor">@color/brand_primary_dark</item>
                  <item name="android:navigationBarColor">@color/surface_bg</item>
              </style>
              <style name="Theme.CallX.Fullscreen" parent="Theme.CallX">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowBackground">@color/black</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/black</item>
              </style>
              <!-- Transparent activity used by RequestPopupActivity (BottomSheet host) -->
              <style name="Theme.CallX.Transparent" parent="Theme.CallX">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:backgroundDimEnabled">true</item>
                  <item name="android:windowAnimationStyle">@android:style/Animation.Dialog</item>
              </style>
          </resources>
          ENDOFFILE

          # ============================================================
          # DRAWABLES — bubbles, buttons, gradients, icons
          # ============================================================
          cat > app/src/main/res/drawable/bubble_sent.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
