          # JAVA — WebRTC Manager (REAL PeerConnection + SDP/ICE Firebase signaling)
          # ============================================================
          cat > app/src/main/java/com/callx/app/webrtc/WebRtcManager.java << 'ENDOFFILE'
          package com.callx.app.webrtc;
          import android.content.Context;
          import com.callx.app.utils.Constants;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import org.json.JSONObject;
          import org.webrtc.*;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          /**
           * WebRtcManager
           *  - Builds PeerConnection with audio (and optional video) tracks
           *  - Exchanges SDP offer/answer + ICE candidates over Firebase Realtime DB
           *  - "callId" is the shared chatKey-style identifier both peers know
           */
          public class WebRtcManager {
              public interface Listener {
                  void onLocalTrack(VideoTrack track);
                  void onRemoteTrack(VideoTrack track);
                  void onConnected();
                  void onDisconnected();
                  void onError(String s);
              }
              private final Context ctx;
              private final EglBase eglBase = EglBase.create();
              private PeerConnectionFactory factory;
              private PeerConnection pc;
              private AudioTrack localAudio;
              private VideoTrack localVideo;
              private VideoCapturer videoCapturer;
              private SurfaceTextureHelper surfaceHelper;
              private final boolean isCaller;
              private final boolean withVideo;
              private final String callId;
              private final Listener listener;
              private DatabaseReference signalRef;
              private ChildEventListener signalListener;
              private boolean front = true;
              public WebRtcManager(Context ctx, String callId, boolean isCaller,
                                   boolean withVideo, Listener listener) {
                  this.ctx = ctx; this.callId = callId; this.isCaller = isCaller;
                  this.withVideo = withVideo; this.listener = listener;
              }
              public EglBase.Context eglContext() { return eglBase.getEglBaseContext(); }
              public void start() {
                  PeerConnectionFactory.initialize(
                      PeerConnectionFactory.InitializationOptions.builder(ctx)
                          .createInitializationOptions());
                  VideoEncoderFactory enc = new DefaultVideoEncoderFactory(eglBase.getEglBaseContext(), true, true);
                  VideoDecoderFactory dec = new DefaultVideoDecoderFactory(eglBase.getEglBaseContext());
                  factory = PeerConnectionFactory.builder()
                      .setVideoEncoderFactory(enc).setVideoDecoderFactory(dec)
                      .setOptions(new PeerConnectionFactory.Options()).createPeerConnectionFactory();
                  List<PeerConnection.IceServer> ice = new ArrayList<>();
                  for (String s : Constants.STUN_URLS)
                      ice.add(PeerConnection.IceServer.builder(s).createIceServer());
                  PeerConnection.RTCConfiguration cfg = new PeerConnection.RTCConfiguration(ice);
                  cfg.sdpSemantics = PeerConnection.SdpSemantics.UNIFIED_PLAN;
                  pc = factory.createPeerConnection(cfg, new SimpleObserver() {
                      @Override public void onIceCandidate(IceCandidate c) { sendIce(c); }
                      @Override public void onAddTrack(RtpReceiver r, MediaStream[] s) {
                          if (r.track() instanceof VideoTrack) listener.onRemoteTrack((VideoTrack) r.track());
                      }
                      @Override public void onConnectionChange(PeerConnection.PeerConnectionState st) {
                          if (st == PeerConnection.PeerConnectionState.CONNECTED) listener.onConnected();
                          else if (st == PeerConnection.PeerConnectionState.DISCONNECTED
                                || st == PeerConnection.PeerConnectionState.FAILED
                                || st == PeerConnection.PeerConnectionState.CLOSED)
                              listener.onDisconnected();
                      }
                  });
                  // Audio
                  MediaConstraints aCon = new MediaConstraints();
                  AudioSource aSrc = factory.createAudioSource(aCon);
                  localAudio = factory.createAudioTrack("AUDIO", aSrc);
                  pc.addTrack(localAudio, Collections.singletonList("STREAM"));
                  // Video
                  if (withVideo) startVideoCapture();
                  // Signaling subscription
                  signalRef = FirebaseUtils.signaling().child(callId);
                  signalListener = new ChildEventListener() {
                      @Override public void onChildAdded(DataSnapshot s, String prev) { handle(s); }
                      @Override public void onChildChanged(DataSnapshot s, String prev) { handle(s); }
                      @Override public void onChildRemoved(DataSnapshot s) {}
                      @Override public void onChildMoved(DataSnapshot s, String prev) {}
                      @Override public void onCancelled(DatabaseError e) {}
                  };
                  signalRef.addChildEventListener(signalListener);
                  if (isCaller) createOffer();
              }
              private void startVideoCapture() {
                  Camera2Enumerator e = new Camera2Enumerator(ctx);
                  String name = null;
                  for (String d : e.getDeviceNames()) {
                      if (front && e.isFrontFacing(d)) { name = d; break; }
                      if (!front && e.isBackFacing(d)) { name = d; break; }
                  }
                  if (name == null && e.getDeviceNames().length > 0) name = e.getDeviceNames()[0];
                  if (name == null) return;
                  videoCapturer = e.createCapturer(name, null);
                  surfaceHelper = SurfaceTextureHelper.create("ct", eglBase.getEglBaseContext());
                  VideoSource src = factory.createVideoSource(videoCapturer.isScreencast());
                  videoCapturer.initialize(surfaceHelper, ctx, src.getCapturerObserver());
                  videoCapturer.startCapture(1280, 720, 30);
                  localVideo = factory.createVideoTrack("VIDEO", src);
                  pc.addTrack(localVideo, Collections.singletonList("STREAM"));
                  listener.onLocalTrack(localVideo);
              }
              private void createOffer() {
                  pc.createOffer(new SimpleSdp() {
                      @Override public void onCreateSuccess(SessionDescription d) {
                          pc.setLocalDescription(new SimpleSdp() {}, d);
                          sendDesc("offer", d);
                      }
                  }, new MediaConstraints());
              }
              private void createAnswer() {
                  pc.createAnswer(new SimpleSdp() {
                      @Override public void onCreateSuccess(SessionDescription d) {
                          pc.setLocalDescription(new SimpleSdp() {}, d);
                          sendDesc("answer", d);
                      }
                  }, new MediaConstraints());
              }
              private void sendDesc(String type, SessionDescription d) {
                  Map<String, Object> m = new HashMap<>();
                  m.put("type", type); m.put("sdp", d.description);
                  m.put("from", FirebaseUtils.myUid());
                  signalRef.push().setValue(m);
              }
              private void sendIce(IceCandidate c) {
                  Map<String, Object> m = new HashMap<>();
                  m.put("type", "ice"); m.put("sdp", c.sdp);
                  m.put("mid", c.sdpMid); m.put("idx", c.sdpMLineIndex);
                  m.put("from", FirebaseUtils.myUid());
                  signalRef.push().setValue(m);
              }
              private void handle(DataSnapshot s) {
                  try {
                      Object o = s.getValue();
                      if (!(o instanceof Map)) return;
                      Map<?,?> m = (Map<?,?>) o;
                      String from = String.valueOf(m.get("from"));
                      if (FirebaseUtils.myUid() != null
                          && FirebaseUtils.myUid().equals(from)) return;
                      String type = (String) m.get("type");
                      if ("offer".equals(type) && !isCaller) {
                          pc.setRemoteDescription(new SimpleSdp() {
                              @Override public void onSetSuccess() { createAnswer(); }
                          }, new SessionDescription(SessionDescription.Type.OFFER, (String) m.get("sdp")));
                      } else if ("answer".equals(type) && isCaller) {
                          pc.setRemoteDescription(new SimpleSdp() {},
                              new SessionDescription(SessionDescription.Type.ANSWER, (String) m.get("sdp")));
                      } else if ("ice".equals(type)) {
                          int idx = ((Number) m.get("idx")).intValue();
                          pc.addIceCandidate(new IceCandidate(
                              (String) m.get("mid"), idx, (String) m.get("sdp")));
                      }
                  } catch (Exception ignored) {}
              }
              public void setMicEnabled(boolean on) { if (localAudio != null) localAudio.setEnabled(on); }
              public void setCameraEnabled(boolean on) { if (localVideo != null) localVideo.setEnabled(on); }
              public void switchCamera() {
                  if (videoCapturer instanceof CameraVideoCapturer) {
                      ((CameraVideoCapturer) videoCapturer).switchCamera(null);
                      front = !front;
                  }
              }
              public void close() {
                  try {
                      if (signalRef != null && signalListener != null)
                          signalRef.removeEventListener(signalListener);
                      signalRef.removeValue();
                      if (videoCapturer != null) { videoCapturer.stopCapture(); videoCapturer.dispose(); }
                      if (surfaceHelper != null) surfaceHelper.dispose();
                      if (pc != null) pc.close();
                      if (factory != null) factory.dispose();
                  } catch (Exception ignored) {}
              }
              // Helpers
              static abstract class SimpleObserver implements PeerConnection.Observer {
                  public void onSignalingChange(PeerConnection.SignalingState s) {}
                  public void onIceConnectionChange(PeerConnection.IceConnectionState s) {}
                  public void onIceConnectionReceivingChange(boolean b) {}
                  public void onIceGatheringChange(PeerConnection.IceGatheringState s) {}
                  public void onIceCandidate(IceCandidate c) {}
                  public void onIceCandidatesRemoved(IceCandidate[] c) {}
                  public void onAddStream(MediaStream s) {}
                  public void onRemoveStream(MediaStream s) {}
                  public void onDataChannel(DataChannel d) {}
                  public void onRenegotiationNeeded() {}
                  public void onAddTrack(RtpReceiver r, MediaStream[] s) {}
                  public void onConnectionChange(PeerConnection.PeerConnectionState s) {}
              }
              static abstract class SimpleSdp implements SdpObserver {
                  public void onCreateSuccess(SessionDescription d) {}
                  public void onSetSuccess() {}
                  public void onCreateFailure(String s) {}
                  public void onSetFailure(String s) {}
              }
          }
          ENDOFFILE

