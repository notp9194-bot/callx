          package com.callx.app.activities;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.RadioGroup;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.R;
          import com.callx.app.utils.PrefsManager;
          import com.google.android.material.materialswitch.MaterialSwitch;
          public class ChatSettingsActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_chat_settings);
                  String chatKey = getIntent().getStringExtra("chatKey");
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  RadioGroup rg = findViewById(R.id.rg_disappear);
                  long ms = PrefsManager.disappearFor(chatKey);
                  if (ms == 0) rg.check(R.id.rb_off);
                  else if (ms == 86400_000L) rg.check(R.id.rb_24h);
                  else if (ms == 7L*86400_000L) rg.check(R.id.rb_7d);
                  else rg.check(R.id.rb_90d);
                  rg.setOnCheckedChangeListener((g, id) -> {
                      long v = 0;
                      if (id == R.id.rb_24h) v = 86400_000L;
                      else if (id == R.id.rb_7d) v = 7L*86400_000L;
                      else if (id == R.id.rb_90d) v = 90L*86400_000L;
                      PrefsManager.setDisappear(chatKey, v);
                  });
                  MaterialSwitch swMute = findViewById(R.id.sw_mute);
                  MaterialSwitch swArc  = findViewById(R.id.sw_archive);
                  swMute.setChecked(PrefsManager.isMuted(chatKey));
                  swArc.setChecked(PrefsManager.isArchived(chatKey));
                  swMute.setOnCheckedChangeListener((b, v) -> PrefsManager.setMuted(chatKey, v));
                  swArc.setOnCheckedChangeListener((b, v) -> PrefsManager.setArchived(chatKey, v));
                  findViewById(R.id.btn_wallpaper).setOnClickListener(v -> {
                      Intent i = new Intent(this, WallpaperPickerActivity.class);
                      i.putExtra("chatKey", chatKey); startActivity(i);
                  });
              }
          }
          ENDOFFILE

