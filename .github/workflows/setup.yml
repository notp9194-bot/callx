          import com.callx.app.models.User;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.*;
          public class SearchActivity extends AppCompatActivity {
              private EditText et;
              private RecyclerView rv;
              private UserSearchAdapter adapter;
              private List<User> all = new ArrayList<>(), filtered = new ArrayList<>();
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_search);
                  et = findViewById(R.id.et_search);
                  rv = findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  adapter = new UserSearchAdapter(this, filtered, u -> {
                      Intent i = new Intent(SearchActivity.this, ChatActivity.class);
                      i.putExtra(ChatActivity.EXTRA_UID, u.uid);
                      i.putExtra(ChatActivity.EXTRA_NAME, u.name);
                      i.putExtra(ChatActivity.EXTRA_PHOTO, u.photoUrl);
                      startActivity(i);
                  });
                  rv.setAdapter(adapter);
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  et.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence c,int a,int b,int d){}
                      @Override public void onTextChanged(CharSequence c,int a,int b,int d){ filter(c.toString()); }
                      @Override public void afterTextChanged(Editable s){}
                  });
                  load();
              }
              private void load() {
                  FirebaseUtils.users().addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(DataSnapshot d) {
                          String me = FirebaseUtils.myUid();
                          all.clear();
                          for (DataSnapshot c : d.getChildren()) {
                              User u = c.getValue(User.class);
                              if (u == null) continue; u.uid = c.getKey();
                              if (!u.uid.equals(me)) all.add(u);
                          }
                          filter("");
                      }
                      @Override public void onCancelled(DatabaseError e) {}
                  });
              }
              private void filter(String q) {
                  filtered.clear(); String qq = q.trim().toLowerCase();
                  for (User u : all) {
                      if (qq.isEmpty()
                          || (u.name != null && u.name.toLowerCase().contains(qq))
                          || (u.callxId != null && u.callxId.toLowerCase().contains(qq)))
                          filtered.add(u);
                  }
                  adapter.notifyDataSetChanged();
              }
          }
