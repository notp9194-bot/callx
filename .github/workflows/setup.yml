          package com.callx.app.activities;
          import android.content.Intent;
          import android.os.Bundle;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.adapters.BroadcastListAdapter;
          import com.callx.app.models.BroadcastList;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.ArrayList;
          import java.util.List;
          public class BroadcastListActivity extends AppCompatActivity {
              private final List<BroadcastList> data = new ArrayList<>();
              private BroadcastListAdapter adapter;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_broadcast_list);
                  RecyclerView rv = findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  adapter = new BroadcastListAdapter(this, data, b -> {
                      Intent i = new Intent(this, NewBroadcastActivity.class);
                      i.putExtra("broadcastId", b.id); startActivity(i);
                  });
                  rv.setAdapter(adapter);
                  findViewById(R.id.fab_new).setOnClickListener(v ->
                      startActivity(new Intent(this, NewBroadcastActivity.class)));
                  load();
              }
              private void load() {
                  String me = FirebaseUtils.myUid();
                  if (me == null) return;
                  FirebaseUtils.broadcasts().child(me).addValueEventListener(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          data.clear();
                          for (DataSnapshot c : s.getChildren()) {
                              BroadcastList b = c.getValue(BroadcastList.class);
                              if (b == null) continue;
                              b.id = c.getKey(); data.add(b);
                          }
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
              }
          }
