          cat > app/src/main/java/com/callx/app/utils/AudioPlaybackManager.java << 'ENDOFFILE'
          package com.callx.app.utils;
          import android.media.MediaPlayer;
          import android.os.Handler;
          import android.os.Looper;
          import java.util.HashMap;
          import java.util.Map;
          /** Singleton single-track audio player. Stops any prior playback before
           *  starting a new one. Notifies progress every 200ms via callback. */
          public class AudioPlaybackManager {
              public interface ProgressCb {
                  void onPrepared(int totalMs);
                  void onProgress(int positionMs, int totalMs);
                  void onCompleted();
              }
              private static AudioPlaybackManager INSTANCE;
              public static AudioPlaybackManager get() {
                  if (INSTANCE == null) INSTANCE = new AudioPlaybackManager();
                  return INSTANCE;
              }
              private MediaPlayer mp;
              private String currentId;
              private ProgressCb cb;
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable poll = new Runnable() {
                  @Override public void run() {
                      if (mp == null) return;
                      try {
                          if (mp.isPlaying() && cb != null) {
                              cb.onProgress(mp.getCurrentPosition(), mp.getDuration());
                          }
                      } catch (Exception ignored) {}
                      h.postDelayed(this, 200);
                  }
              };
              private final Map<String, Runnable> stopHooks = new HashMap<>();
              /** Register a callback that fires when the holder stops being current. */
              public void registerStopHook(String id, Runnable r) { stopHooks.put(id, r); }
              public boolean isPlaying(String id) {
                  return mp != null && id != null && id.equals(currentId) && mp.isPlaying();
              }
              public void toggle(String id, String url, ProgressCb cb) {
                  if (id != null && id.equals(currentId) && mp != null) {
                      try {
                          if (mp.isPlaying()) { mp.pause(); }
                          else { mp.start(); h.postDelayed(poll, 200); }
                      } catch (Exception ignored) {}
                      return;
                  }
                  stop();
                  this.cb = cb; this.currentId = id;
                  mp = new MediaPlayer();
                  try {
                      mp.setDataSource(url);
                      mp.setOnPreparedListener(p -> {
                          if (cb != null) cb.onPrepared(p.getDuration());
                          p.start();
                          h.postDelayed(poll, 200);
                      });
                      mp.setOnCompletionListener(p -> {
                          if (cb != null) cb.onCompleted();
                          stop();
                      });
                      mp.setOnErrorListener((m, w, e) -> { stop(); return true; });
                      mp.prepareAsync();
                  } catch (Exception e) { stop(); }
              }
              public void seek(String id, int ms) {
                  if (id != null && id.equals(currentId) && mp != null) {
                      try { mp.seekTo(ms); } catch (Exception ignored) {}
                  }
              }
              public void stop() {
                  h.removeCallbacks(poll);
                  if (currentId != null) {
                      Runnable r = stopHooks.get(currentId);
                      if (r != null) r.run();
                  }
                  if (mp != null) {
                      try { mp.stop(); } catch (Exception ignored) {}
                      try { mp.release(); } catch (Exception ignored) {}
                      mp = null;
                  }
                  currentId = null; cb = null;
              }
          }
          ENDOFFILE

          cat > app/src/main/java/com/callx/app/utils/LinkPreviewHelper.java << 'ENDOFFILE'
          package com.callx.app.utils;
          import android.os.Handler;
          import android.os.Looper;
          import com.callx.app.models.LinkPreview;
          import okhttp3.*;
          import org.json.JSONObject;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          /** Detects URLs and fetches OG/twitter card preview via the helper server.
           *  Caches results in PrefsManager (per-URL). */
          public class LinkPreviewHelper {
              public interface Cb { void onResult(LinkPreview lp); }
              private static final Pattern URL_RE = Pattern.compile(
                  "(https?://[\\w\\-\\.]+(?::\\d+)?(?:/[\\w\\-\\./?=&%#~+]*)?)",
                  Pattern.CASE_INSENSITIVE);
              private static final OkHttpClient client = new OkHttpClient();
              private static final Handler MAIN = new Handler(Looper.getMainLooper());
              public static String firstUrl(String text) {
                  if (text == null) return null;
                  Matcher m = URL_RE.matcher(text);
                  return m.find() ? m.group(1) : null;
              }
              public static void fetch(final String url, final Cb cb) {
                  if (url == null) { cb.onResult(null); return; }
                  String cached = PrefsManager.getLinkPreview(url);
                  if (cached != null) {
                      try {
                          JSONObject j = new JSONObject(cached);
                          cb.onResult(new LinkPreview(url,
                              j.optString("title"), j.optString("desc"), j.optString("image")));
                          return;
                      } catch (Exception ignored) {}
                  }
                  Request req = new Request.Builder()
                      .url(Constants.SERVER_URL + "/linkpreview?u=" + okhttp3.HttpUrl.parse(url))
                      .build();
                  client.newCall(req).enqueue(new Callback() {
                      @Override public void onFailure(Call c, java.io.IOException e) {
                          MAIN.post(() -> cb.onResult(null));
                      }
                      @Override public void onResponse(Call c, Response r) throws java.io.IOException {
                          try {
                              if (!r.isSuccessful()) { MAIN.post(() -> cb.onResult(null)); return; }
                              String body = r.body().string();
                              JSONObject j = new JSONObject(body);
                              PrefsManager.putLinkPreview(url, body);
                              MAIN.post(() -> cb.onResult(new LinkPreview(url,
                                  j.optString("title"), j.optString("desc"), j.optString("image"))));
                          } catch (Exception e) { MAIN.post(() -> cb.onResult(null)); }
                          finally { r.close(); }
                      }
                  });
              }
          }
          ENDOFFILE

          cat > app/src/main/java/com/callx/app/utils/ImageCompressor.java << 'ENDOFFILE'
          package com.callx.app.utils;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.media.ExifInterface;
          import android.net.Uri;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          /** Down-scales and JPEG-compresses an image to <= MAX_DIM on the longer
           *  edge. Returns a local file URI ready for upload. */
          public class ImageCompressor {
              private static final int MAX_DIM = 1280;
              private static final int QUALITY = 85;
              public static Uri compress(Context ctx, Uri src) {
                  try {
                      // Bounds first
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      InputStream in = ctx.getContentResolver().openInputStream(src);
                      BitmapFactory.decodeStream(in, null, o);
                      if (in != null) in.close();
                      int w = o.outWidth, h = o.outHeight;
                      if (w <= 0 || h <= 0) return src;
                      int sample = 1;
                      while ((w / (sample * 2)) > MAX_DIM || (h / (sample * 2)) > MAX_DIM) sample *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = sample;
                      InputStream in2 = ctx.getContentResolver().openInputStream(src);
                      Bitmap bmp = BitmapFactory.decodeStream(in2, null, o2);
                      if (in2 != null) in2.close();
                      if (bmp == null) return src;
                      // Final scale to MAX_DIM
                      float ratio = Math.min((float) MAX_DIM / bmp.getWidth(),
                                             (float) MAX_DIM / bmp.getHeight());
                      if (ratio < 1f) {
                          bmp = Bitmap.createScaledBitmap(bmp,
                              Math.round(bmp.getWidth() * ratio),
                              Math.round(bmp.getHeight() * ratio), true);
                      }
                      // Honor EXIF orientation
                      try {
                          InputStream in3 = ctx.getContentResolver().openInputStream(src);
                          if (in3 != null) {
                              ExifInterface ex = new ExifInterface(in3);
                              int rot = ex.getAttributeInt(ExifInterface.TAG_ORIENTATION,
                                  ExifInterface.ORIENTATION_NORMAL);
                              float deg = 0;
                              if (rot == ExifInterface.ORIENTATION_ROTATE_90) deg = 90;
                              else if (rot == ExifInterface.ORIENTATION_ROTATE_180) deg = 180;
                              else if (rot == ExifInterface.ORIENTATION_ROTATE_270) deg = 270;
                              if (deg != 0) {
                                  Matrix m = new Matrix(); m.postRotate(deg);
                                  bmp = Bitmap.createBitmap(bmp, 0, 0,
                                      bmp.getWidth(), bmp.getHeight(), m, true);
                              }
                              in3.close();
                          }
                      } catch (Exception ignored) {}
                      File out = new File(ctx.getCacheDir(),
                          "cmp_" + System.currentTimeMillis() + ".jpg");
                      FileOutputStream fos = new FileOutputStream(out);
                      bmp.compress(Bitmap.CompressFormat.JPEG, QUALITY, fos);
                      fos.close();
                      return Uri.fromFile(out);
                  } catch (Exception e) { return src; }
              }
          }
          ENDOFFILE

          cat > app/src/main/java/com/callx/app/utils/MessageOutbox.java << 'ENDOFFILE'
          package com.callx.app.utils;
          import com.google.firebase.database.DatabaseReference;
          import com.google.firebase.database.FirebaseDatabase;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.UUID;
          /** Persists outgoing messages locally if the Firebase write fails (or is
           *  optimistically queued from offline state). OutboxWorker drains it. */
          public class MessageOutbox {
              public static synchronized void enqueue(String chatPath, JSONObject msg) {
                  try {
                      JSONArray arr = new JSONArray(PrefsManager.getOutbox());
                      JSONObject item = new JSONObject();
                      item.put("localId", UUID.randomUUID().toString());
                      item.put("chatPath", chatPath);
                      item.put("msg", msg);
                      item.put("createdAt", System.currentTimeMillis());
                      item.put("attempts", 0);
                      arr.put(item);
                      PrefsManager.setOutbox(arr.toString());
                  } catch (Exception ignored) {}
              }
              public static synchronized int drain() {
                  int sent = 0;
                  try {
                      JSONArray arr = new JSONArray(PrefsManager.getOutbox());
                      JSONArray remaining = new JSONArray();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject item = arr.getJSONObject(i);
                          try {
                              String chatPath = item.getString("chatPath");
                              JSONObject msg = item.getJSONObject("msg");
                              DatabaseReference ref = FirebaseDatabase
                                  .getInstance(Constants.DB_URL).getReference(chatPath).push();
                              ref.setValue(jsonToMap(msg));
                              sent++;
                          } catch (Exception e) {
                              int attempts = item.optInt("attempts", 0) + 1;
                              if (attempts < 10) {
                                  item.put("attempts", attempts);
                                  remaining.put(item);
                              }
                          }
                      }
                      PrefsManager.setOutbox(remaining.toString());
                  } catch (Exception ignored) {}
                  return sent;
              }
              public static int pendingCount() {
                  try { return new JSONArray(PrefsManager.getOutbox()).length(); }
                  catch (Exception e) { return 0; }
              }
              private static java.util.Map<String, Object> jsonToMap(JSONObject o) throws Exception {
                  java.util.Map<String, Object> m = new java.util.HashMap<>();
                  java.util.Iterator<String> it = o.keys();
                  while (it.hasNext()) {
                      String k = it.next();
                      Object v = o.get(k);
                      if (v == JSONObject.NULL) m.put(k, null);
                      else if (v instanceof JSONObject) m.put(k, jsonToMap((JSONObject) v));
                      else if (v instanceof JSONArray) {
                          JSONArray a = (JSONArray) v;
                          java.util.List<Object> l = new java.util.ArrayList<>();
                          for (int i = 0; i < a.length(); i++) l.add(a.get(i));
                          m.put(k, l);
                      } else m.put(k, v);
                  }
