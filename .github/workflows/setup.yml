          package com.callx.app.models;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          public class Message {
              public String id;
              public String senderId;
              public String senderName;
              public String text;
              public String type;          // text | image | video | audio | file | location | contact
              public String mediaUrl;
              public String thumbnailUrl;
              public String fileName;
              public Long fileSize;
              public Long duration;        // ms
              public Long timestamp;
              public String imageUrl;      // backward compat
              // Reply quote
              public String replyToId;
              public String replyToName;
              public String replyToText;
              // Edited / deleted
              public Boolean edited;
              public Boolean deletedForAll;
              // Per-user delete-for-me sync (uid -> true)
              public Map<String, Boolean> hiddenFor = new HashMap<>();
              // For @mentions in groups (list of mentioned uids)
              public List<String> mentions = new ArrayList<>();
              // Seen / delivered status
              public String status;        // sending | sent | delivered | seen
              public Map<String, Long> seenBy = new HashMap<>();
              public Map<String, Long> deliveredTo = new HashMap<>();
              // Reactions: emoji -> uid -> timestamp
              public Map<String, Map<String, Long>> reactions = new HashMap<>();
              // View once
              public Boolean viewOnce;
              public Boolean viewed;
              // Disappear time
              public Long expiresAt;
              // Location
              public Double lat, lng;
              public Long liveUntil;
              // Contact share
              public String contactName;
              public String contactPhone;
              // Encrypted payload (AES + per-chat key)
              public String encrypted;
              public Message() {}
          }
