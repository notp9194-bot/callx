name: Setup CallX v3 — Chat System Full Production Patch

# =====================================================================
# This workflow OVERWRITES / ADDS only the chat-system files of CallX v3
# to bring every half-implemented or missing chat feature to production
# quality. It is meant to run AFTER the base "Setup CallX v3 (Production
# - Full Featured)" workflow has created the base project, OR you can run
# it on its own and then run the base file (any order works because it
# only writes/overwrites files; the base writes the rest).
#
# WHAT THIS PATCH ADDS / FIXES (chat system only)
# -----------------------------------------------
# 1.  Audio playback fully wired (singleton MediaPlayer + SeekBar +
#     progress polling + auto-pause others + completion reset).
# 2.  Reaction chips: per-emoji chip with count, own-reaction highlight,
#     tap-to-toggle, long-press to open "who reacted" drilldown.
# 3.  Combined presence + typing subtitle (no overwrite — typing wins
#     while active, falls back to online/last-seen).
# 4.  GroupChatActivity now has full feature parity with 1:1 chat:
#     edit, delete-for-me, star, copy, info, disappearing, typing,
#     presence (count of members online), read receipts, mentions,
#     @suggestion picker, swipe-to-reply, jump-to-quoted, etc.
# 5.  Pagination: loads last 50 first, then fetches older on scroll-up.
# 6.  Swipe-to-reply gesture (ItemTouchHelper).
# 7.  Scroll-to-bottom FAB with unread counter.
# 8.  Unread divider row inserted at first unread message.
# 9.  Draft persistence per chat (saved on pause, restored on resume).
# 10. Link preview: detect URLs, fetch og:title/description/image via
#     server, cache, render preview card inside bubble.
# 11. Sticker picker (bundled sticker packs from drawables).
# 12. Search highlight + jump-to-result inside chat.
# 13. Pinned messages: pin/unpin from message dialog, pinned bar at
#     top of chat with current pin (tap to jump).
# 14. Reply-jump: tap on the reply quote scrolls to original message
#     and briefly highlights it.
# 15. Per-chat AES key rotation (option in chat settings).
# 16. Offline outbox: messages queued locally and retried via
#     WorkManager when network returns.
# 17. Per-message upload progress bar inside the bubble.
# 18. Image compression before upload (max 1280px, JPEG 85).
# 19. View-once auto-delete after viewer marks viewed.
# 20. Reaction count drilldown bottom-sheet (emoji -> users list).
# 21. Broadcast lists: create list of contacts, send to all in one tap.
# 22. Chat export to .txt (share intent).
# 23. Scheduled messages: schedule a message to send later
#     (WorkManager periodic worker checks every minute).
# 24. Multi-select action mode (delete / forward / star).
# 25. Mention rendering with clickable spans + @-suggestion popup
#     for groups (filters group members as you type).
# 26. Manifest + chat menu + bottom-sheet attach updates to wire all
#     the above.
# 27. server.js endpoints for /linkpreview, /scheduled/process, and
#     /broadcast/send.
# =====================================================================

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply chat-system production patch
        run: |
          # Make sure all dirs exist (no-op if they do).
          mkdir -p app/src/main/java/com/callx/app/activities
          mkdir -p app/src/main/java/com/callx/app/fragments
          mkdir -p app/src/main/java/com/callx/app/adapters
          mkdir -p app/src/main/java/com/callx/app/models
          mkdir -p app/src/main/java/com/callx/app/utils
          mkdir -p app/src/main/java/com/callx/app/services
          mkdir -p app/src/main/java/com/callx/app/workers
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu
          mkdir -p server

          # ============================================================
          # MODELS — extended Message, ChatMeta + new BroadcastList,
          # LinkPreview, ScheduledMessage, OutboxItem
          # ============================================================
          cat > app/src/main/java/com/callx/app/models/Message.java << 'ENDOFFILE'
