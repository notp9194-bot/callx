              private void loadInitialMessages() {
                  msgRef.orderByChild("timestamp").limitToLast(PAGE)
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              messages.clear();
                              for (DataSnapshot c : s.getChildren()) {
                                  Message m = c.getValue(Message.class);
                                  if (m == null) continue; m.id = c.getKey();
                                  if (PrefsManager.isHiddenForMe(m.id)) continue;
                                  if (m.expiresAt != null && m.expiresAt > 0
                                      && m.expiresAt < System.currentTimeMillis()) continue;
                                  messages.add(m);
                                  if (m.timestamp != null && m.timestamp < oldestTs)
                                      oldestTs = m.timestamp;
                              }
                              adapter.notifyDataSetChanged();
                              rv.scrollToPosition(adapter.getItemCount() - 1);
                              attachIncrementalListener();
                              for (Message m : messages) markDeliveredAndSeen(m);
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {}
                      });
              }
              private void loadOlder() {
                  if (oldestTs == Long.MAX_VALUE) return;
                  loadingMore = true;
                  msgRef.orderByChild("timestamp").endBefore(oldestTs).limitToLast(PAGE)
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              List<Message> older = new ArrayList<>();
                              for (DataSnapshot c : s.getChildren()) {
                                  Message m = c.getValue(Message.class);
                                  if (m == null) continue; m.id = c.getKey();
                                  if (PrefsManager.isHiddenForMe(m.id)) continue;
                                  older.add(m);
                              }
                              if (older.isEmpty()) { allLoaded = true; loadingMore = false; return; }
                              for (Message m : older) {
                                  if (m.timestamp != null && m.timestamp < oldestTs) oldestTs = m.timestamp;
                              }
                              messages.addAll(0, older);
                              adapter.notifyItemRangeInserted(0, older.size());
                              loadingMore = false;
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) { loadingMore = false; }
                      });
              }
              private void attachIncrementalListener() {
                  msgsListener = new ChildEventListener() {
                      @Override public void onChildAdded(@NonNull DataSnapshot s, String prev) {
                          Message m = s.getValue(Message.class);
                          if (m == null) return; m.id = s.getKey();
                          if (PrefsManager.isHiddenForMe(m.id)) return;
                          for (Message ex : messages) if (m.id.equals(ex.id)) return;
                          if (m.timestamp == null || m.timestamp <= oldestTs) return;
                          messages.add(m);
                          adapter.notifyItemInserted(messages.size() - 1);
                          rv.scrollToPosition(adapter.getItemCount() - 1);
                          markDeliveredAndSeen(m);
                          maybeFetchLinkPreview(m);
                      }
                      @Override public void onChildChanged(@NonNull DataSnapshot s, String prev) {
                          Message m = s.getValue(Message.class);
                          if (m == null) return; m.id = s.getKey();
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(m.id)) {
                                  if (Boolean.TRUE.equals(m.deletedForAll) || PrefsManager.isHiddenForMe(m.id)) {
                                      messages.remove(i); adapter.notifyItemRemoved(i);
                                  } else {
                                      messages.set(i, m); adapter.notifyItemChanged(i);
                                  }
                                  break;
                              }
                      }
                      @Override public void onChildRemoved(@NonNull DataSnapshot s) {
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(s.getKey())) {
                                  messages.remove(i); adapter.notifyItemRemoved(i); break;
                              }
                      }
                      @Override public void onChildMoved(@NonNull DataSnapshot s, String p) {}
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  long anchor = oldestTs == Long.MAX_VALUE ? 0 : oldestTs;
                  msgRef.orderByChild("timestamp").startAfter(anchor)
                      .addChildEventListener(msgsListener);
              }
              private void markDeliveredAndSeen(Message m) {
                  if (m.senderId == null || m.senderId.equals(FirebaseUtils.myUid())) return;
                  String me = FirebaseUtils.myUid();
                  msgRef.child(m.id).child("deliveredTo").child(me).setValue(System.currentTimeMillis());
                  if (PrefsManager.readReceiptsEnabled()) {
                      msgRef.child(m.id).child("seenBy").child(me).setValue(System.currentTimeMillis());
                  }
              }
              private void maybeFetchLinkPreview(Message m) {
                  if (!"text".equals(m.type) || m.text == null || m.linkUrl != null) return;
                  String url = LinkPreviewHelper.firstUrl(m.text);
                  if (url == null) return;
                  LinkPreviewHelper.fetch(url, lp -> {
                      if (lp == null || lp.title == null) return;
                      Map<String, Object> u = new HashMap<>();
                      u.put("linkUrl", lp.url); u.put("linkTitle", lp.title);
                      u.put("linkDesc", lp.description); u.put("linkImage", lp.image);
                      msgRef.child(m.id).updateChildren(u);
                  });
              }
