          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.R;
          import com.callx.app.models.StatusItem;
          import com.callx.app.utils.CloudinaryUploader;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.DataSnapshot;
          import com.google.firebase.database.DatabaseError;
          import com.google.firebase.database.ValueEventListener;
          public class NewStatusActivity extends AppCompatActivity {
              private EditText et;
              private static final int RC_IMG = 1, RC_VID = 2;
              private String myName, myPhoto;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_new_status);
                  et = findViewById(R.id.et_text);
                  findViewById(R.id.toolbar).setOnClickListener(v -> finish());
                  FirebaseUtils.users().child(FirebaseUtils.myUid())
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(DataSnapshot d) {
                              myName = String.valueOf(d.child("name").getValue());
                              Object p = d.child("photoUrl").getValue();
                              myPhoto = p == null ? "" : p.toString();
                          }
                          @Override public void onCancelled(DatabaseError e) {}
                      });
                  findViewById(R.id.btn_image).setOnClickListener(v -> pick("image/*", RC_IMG));
                  findViewById(R.id.btn_video).setOnClickListener(v -> pick("video/*", RC_VID));
                  findViewById(R.id.btn_post).setOnClickListener(v -> postText());
              }
              private void pick(String mime, int rc) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(mime);
                  startActivityForResult(i, rc);
              }
              private void postText() {
                  String t = et.getText().toString().trim();
                  if (t.isEmpty()) { Toast.makeText(this, "Type something", Toast.LENGTH_SHORT).show(); return; }
                  pushItem("text", t, null); finish();
              }
              private void pushItem(String type, String text, String url) {
                  String me = FirebaseUtils.myUid();
                  StatusItem si = new StatusItem();
                  si.ownerUid = me; si.ownerName = myName == null ? "Me" : myName;
                  si.ownerPhoto = myPhoto; si.type = type; si.text = text; si.mediaUrl = url;
                  si.timestamp = System.currentTimeMillis();
                  si.expiresAt = si.timestamp + 24L*60*60*1000;
                  FirebaseUtils.status().child(me).push().setValue(si);
              }
              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (res != Activity.RESULT_OK || d == null || d.getData() == null) return;
                  Uri u = d.getData();
                  String resType = (rc == RC_VID) ? "video" : "image";
                  String type = (rc == RC_VID) ? "video" : "image";
                  CloudinaryUploader.upload(this, u, resType, new CloudinaryUploader.Callback() {
                      @Override public void onSuccess(String url) {
                          runOnUiThread(() -> { pushItem(type, null, url); finish(); });
                      }
                      @Override public void onError(String s) {
                          runOnUiThread(() -> Toast.makeText(NewStatusActivity.this, s, Toast.LENGTH_SHORT).show());
                      }
                  });
              }
          }
