          package com.callx.app.workers;
          import android.content.Context;
          import androidx.annotation.NonNull;
          import androidx.work.*;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.*;
          import java.util.concurrent.TimeUnit;
          /** Sweeps /chats/.../messages for view-once items whose viewed flag is true
           *  and nulls their mediaUrl + thumbnailUrl after a short grace period. */
          public class ViewOnceCleanupWorker extends Worker {
              public ViewOnceCleanupWorker(@NonNull Context c, @NonNull WorkerParameters p) { super(c, p); }
              @NonNull @Override public Result doWork() {
                  // Best-effort: only the local user's own outgoing view-once items.
                  String me = FirebaseUtils.myUid();
                  if (me == null) return Result.success();
                  // Iterate via my chat list (cheap lookup)
                  FirebaseUtils.users().child(me).child("chats")
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              for (DataSnapshot c : s.getChildren()) {
                                  String partner = c.getKey();
                                  String chatKey = FirebaseUtils.chatKey(me, partner);
                                  FirebaseUtils.chats().child(chatKey).child("messages")
                                      .orderByChild("viewOnce").equalTo(true)
                                      .addListenerForSingleValueEvent(new ValueEventListener() {
                                          @Override public void onDataChange(@NonNull DataSnapshot ss) {
                                              for (DataSnapshot ds : ss.getChildren()) {
                                                  Boolean v = ds.child("viewed").getValue(Boolean.class);
                                                  if (Boolean.TRUE.equals(v)) {
                                                      java.util.Map<String,Object> u = new java.util.HashMap<>();
                                                      u.put("mediaUrl", null);
                                                      u.put("thumbnailUrl", null);
                                                      ds.getRef().updateChildren(u);
                                                  }
                                              }
                                          }
                                          @Override public void onCancelled(@NonNull DatabaseError e) {}
                                      });
                              }
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {}
                      });
                  return Result.success();
              }
              public static void enqueue(Context ctx) {
                  PeriodicWorkRequest req = new PeriodicWorkRequest.Builder(
                      ViewOnceCleanupWorker.class, 1, TimeUnit.HOURS).build();
                  WorkManager.getInstance(ctx).enqueueUniquePeriodicWork(
                      "callx_viewonce", ExistingPeriodicWorkPolicy.KEEP, req);
              }
          }
          ENDOFFILE

