                          tvLocLabel.setText("\uD83D\uDCCD " + m.lat + ", " + m.lng);
                      } else if ("contact".equals(m.type)) {
                          llContact.setVisibility(View.VISIBLE);
                          tvContactName.setText(m.contactName == null ? "" : m.contactName);
                          tvContactMeta.setText(m.contactPhone == null ? "" : m.contactPhone);
                      } else if ("sticker".equals(m.type)) {
                          ivImage.setVisibility(View.VISIBLE);
                          int resId = ctx.getResources().getIdentifier(
                              "sticker_" + (m.stickerId == null ? "1" : m.stickerId),
                              "drawable", ctx.getPackageName());
                          if (resId == 0) resId = R.drawable.sticker_1;
                          ivImage.setImageResource(resId);
                          ivImage.setOnClickListener(v -> {
                              if (selectionMode && listener != null) listener.onClick(m);
                          });
                      } else {
                          tvMessage.setVisibility(View.VISIBLE);
                          String t = m.text == null ? "" : m.text;
                          CharSequence cs = MentionHelper.highlight(t,
                              h -> { if (listener != null) listener.onMentionTap(h); });
                          if (searchQuery != null && !searchQuery.isEmpty()) {
                              cs = applyHighlight(t, searchQuery);
                          }
                          tvMessage.setText(cs);
                      }
                      // Inline link preview (text only)
                      if ("text".equals(m.type) && m.linkUrl != null && m.linkTitle != null
                          && llLinkPreview != null) {
                          llLinkPreview.setVisibility(View.VISIBLE);
                          tvLinkTitle.setText(m.linkTitle);
                          tvLinkDesc.setText(m.linkDesc == null ? m.linkUrl : m.linkDesc);
                          if (m.linkImage != null && !m.linkImage.isEmpty())
                              Glide.with(ctx).load(m.linkImage).into(ivLinkImage);
                          else ivLinkImage.setImageDrawable(null);
                          llLinkPreview.setOnClickListener(v -> {
                              if (listener != null) listener.onLinkTap(m.linkUrl);
                          });
                      }
                      // Upload progress (sending status)
                      if (uploadProgress != null && "sending".equals(m.status)) {
                          uploadProgress.setVisibility(View.VISIBLE);
                      }
                      tvTime.setText(m.timestamp == null ? "" : DateFormat.format("h:mm a", m.timestamp));
                      tvEdited.setVisibility(Boolean.TRUE.equals(m.edited) ? View.VISIBLE : View.GONE);
                      // Status double tick
                      if (ivStatus != null && m.senderId != null && m.senderId.equals(myUid)) {
                          ivStatus.setVisibility(View.VISIBLE);
                          int color = ctx.getResources().getColor(R.color.text_secondary);
                          int icon = R.drawable.ic_check;
                          if ("scheduled".equals(m.status)) {
                              icon = R.drawable.ic_schedule;
                          } else if ("failed".equals(m.status)) {
                              icon = R.drawable.ic_error;
                              color = Color.RED;
                          } else if (m.seenBy != null && !m.seenBy.isEmpty()) {
                              icon = R.drawable.ic_check_double;
                              color = ctx.getResources().getColor(R.color.seen_blue);
                          } else if (m.deliveredTo != null && !m.deliveredTo.isEmpty()) {
                              icon = R.drawable.ic_check_double;
                          } else if ("sending".equals(m.status)) {
                              icon = R.drawable.ic_clock;
                          }
                          ivStatus.setImageResource(icon);
                          ivStatus.setColorFilter(color, PorterDuff.Mode.SRC_IN);
                      }
                      // Reactions chips
                      if (llReactions != null) {
                          llReactions.removeAllViews();
                          if (m.reactions != null && !m.reactions.isEmpty()) {
                              llReactions.setVisibility(View.VISIBLE);
                              for (Map.Entry<String, Map<String, Long>> e : m.reactions.entrySet()) {
                                  int cnt = e.getValue() == null ? 0 : e.getValue().size();
                                  if (cnt == 0) continue;
                                  boolean mine = e.getValue().containsKey(myUid);
                                  View chip = LayoutInflater.from(ctx).inflate(
                                      R.layout.item_reaction_chip, llReactions, false);
                                  TextView tEmoji = chip.findViewById(R.id.tv_emoji);
                                  TextView tCount = chip.findViewById(R.id.tv_count);
                                  tEmoji.setText(e.getKey());
                                  tCount.setText(String.valueOf(cnt));
                                  chip.setBackgroundResource(mine
                                      ? R.drawable.reaction_chip_active_bg
                                      : R.drawable.reaction_chip_bg);
                                  chip.setOnClickListener(v -> {
                                      if (listener != null) listener.onReactionChipTap(m, e.getKey());
                                  });
                                  chip.setOnLongClickListener(v -> {
                                      if (listener != null) listener.onReactionChipLong(m, e.getKey());
                                      return true;
                                  });
                                  llReactions.addView(chip);
                              }
                              if (llReactions.getChildCount() == 0)
                                  llReactions.setVisibility(View.GONE);
                          } else llReactions.setVisibility(View.GONE);
                      }
                      // Selection state
                      bubble.setSelected(selectionMode && m.id != null && selected.contains(m.id));
                      if (selectionMode && m.id != null && selected.contains(m.id)) {
                          bubble.setBackgroundColor(Color.parseColor("#3300A86B"));
                      } else if (highlightId != null && highlightId.equals(m.id)) {
                          bubble.setBackgroundColor(Color.parseColor("#33FFC107"));
                      } else {
                          bubble.setBackgroundColor(Color.TRANSPARENT);
                      }
                      bubble.setOnLongClickListener(v -> {
                          if (selectionMode) { listener.onClick(m); return true; }
                          if (listener != null) listener.onLongPress(m);
                          return true;
                      });
                      bubble.setOnClickListener(v -> {
                          if (selectionMode && listener != null) listener.onClick(m);
                      });
                  }
                  private CharSequence applyHighlight(String text, String q) {
                      SpannableString s = new SpannableString(text);
                      String l = text.toLowerCase(Locale.US);
                      String ql = q.toLowerCase(Locale.US);
                      int i = 0;
                      while (i < l.length()) {
                          int idx = l.indexOf(ql, i);
                          if (idx < 0) break;
                          s.setSpan(new BackgroundColorSpan(Color.YELLOW),
                              idx, idx + ql.length(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                          i = idx + ql.length();
                      }
                      return s;
                  }
              }
          }
