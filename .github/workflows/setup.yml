          package com.callx.app.utils;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.text.Spannable;
          import android.text.SpannableStringBuilder;
          import android.text.style.ClickableSpan;
          import android.text.style.ForegroundColorSpan;
          import android.text.style.StyleSpan;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class MentionHelper {
              public interface OnMentionClick { void onMention(String handle); }
              private static final Pattern MENTION = Pattern.compile("@([\\w._-]+)");
              public static CharSequence highlight(String text) { return highlight(text, null); }
              public static CharSequence highlight(String text, OnMentionClick cb) {
                  if (text == null) return "";
                  SpannableStringBuilder sb = new SpannableStringBuilder(text);
                  Matcher m = MENTION.matcher(text);
                  while (m.find()) {
                      final String handle = m.group(1);
                      sb.setSpan(new ForegroundColorSpan(Color.parseColor("#0A7CFF")),
                          m.start(), m.end(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                      sb.setSpan(new StyleSpan(Typeface.BOLD),
                          m.start(), m.end(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                      if (cb != null) {
                          sb.setSpan(new ClickableSpan() {
                              @Override public void onClick(View v) { cb.onMention(handle); }
                          }, m.start(), m.end(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                      }
                  }
                  return sb;
              }
              /** Returns the in-progress @mention "stub" if cursor is right after one,
               *  e.g. typing "hi @al|" returns "al". null otherwise. */
              public static String activeStub(String text, int cursor) {
                  if (text == null || cursor <= 0) return null;
                  String left = text.substring(0, Math.min(cursor, text.length()));
                  int at = left.lastIndexOf('@');
                  if (at < 0) return null;
                  String stub = left.substring(at + 1);
                  if (stub.isEmpty()) return "";
                  if (!stub.matches("[\\w._-]*")) return null;
                  // Must be preceded by start-of-text or whitespace
                  if (at > 0) {
                      char prev = left.charAt(at - 1);
                      if (prev != ' ' && prev != '\n' && prev != '\t') return null;
                  }
                  return stub;
              }
              public static List<String> extractMentions(String text) {
                  List<String> out = new ArrayList<>();
                  if (text == null) return out;
                  Matcher m = MENTION.matcher(text);
                  while (m.find()) out.add(m.group(1));
                  return out;
              }
          }
          ENDOFFILE

