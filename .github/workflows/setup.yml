              private void ensureChatKey() {
                  DatabaseReference k = FirebaseUtils.chats().child(chatKey).child("_meta").child("aes");
                  k.addListenerForSingleValueEvent(new ValueEventListener() {
                      @Override public void onDataChange(@NonNull DataSnapshot s) {
                          if (s.exists()) { chatAesKey = s.getValue(String.class); return; }
                          try {
                              chatAesKey = AesCrypto.genKeyBase64();
                              k.setValue(chatAesKey);
                          } catch (Exception ignored) {}
                      }
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  });
                  chatKeyVersion = PrefsManager.keyVersion(chatKey);
              }
              private void rotateChatKey() {
                  try {
                      String fresh = AesCrypto.genKeyBase64();
                      FirebaseUtils.chats().child(chatKey).child("_meta").child("aes").setValue(fresh);
                      chatAesKey = fresh;
                      PrefsManager.incrementKeyVersion(chatKey);
                      chatKeyVersion = PrefsManager.keyVersion(chatKey);
                      Toast.makeText(this, "Encryption key rotated", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Rotate failed", Toast.LENGTH_SHORT).show();
                  }
              }
              // ================= MESSAGES — pagination =================
              private void loadInitialMessages() {
                  msgRef = FirebaseUtils.chats().child(chatKey).child("messages");
                  msgRef.orderByChild("timestamp").limitToLast(PAGE)
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              messages.clear();
                              for (DataSnapshot c : s.getChildren()) {
                                  Message m = parse(c);
                                  if (m == null || isExpired(m) || isHiddenForMe(m)) continue;
                                  messages.add(m);
                                  if (m.timestamp != null && m.timestamp < oldestTimestamp)
                                      oldestTimestamp = m.timestamp;
                              }
                              adapter.notifyDataSetChanged();
                              computeUnreadDivider();
                              rv.scrollToPosition(adapter.getItemCount() - 1);
                              attachIncrementalListener();
                              for (Message m : messages) markDeliveredAndSeen(m);
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) {}
                      });
              }
              private void loadOlder() {
                  if (oldestTimestamp == Long.MAX_VALUE) return;
                  loadingMore = true;
                  msgRef.orderByChild("timestamp").endBefore(oldestTimestamp).limitToLast(PAGE)
                      .addListenerForSingleValueEvent(new ValueEventListener() {
                          @Override public void onDataChange(@NonNull DataSnapshot s) {
                              List<Message> older = new ArrayList<>();
                              for (DataSnapshot c : s.getChildren()) {
                                  Message m = parse(c);
                                  if (m == null || isExpired(m) || isHiddenForMe(m)) continue;
                                  older.add(m);
                              }
                              if (older.isEmpty()) { allLoaded = true; loadingMore = false; return; }
                              for (Message m : older) {
                                  if (m.timestamp != null && m.timestamp < oldestTimestamp)
                                      oldestTimestamp = m.timestamp;
                              }
                              messages.addAll(0, older);
                              adapter.notifyItemRangeInserted(0, older.size());
                              loadingMore = false;
                          }
                          @Override public void onCancelled(@NonNull DatabaseError e) { loadingMore = false; }
                      });
              }
              private void attachIncrementalListener() {
                  msgsListener = new ChildEventListener() {
                      @Override public void onChildAdded(@NonNull DataSnapshot s, String prev) {
                          Message m = parse(s);
                          if (m == null || isExpired(m) || isHiddenForMe(m)) return;
                          for (Message ex : messages) if (m.id.equals(ex.id)) return;
                          if (m.timestamp == null || m.timestamp <= oldestTimestamp) return;
                          messages.add(m);
                          adapter.notifyItemInserted(messages.size() - 1);
                          // Scroll only when near bottom
                          LinearLayoutManager lm = (LinearLayoutManager) rv.getLayoutManager();
                          if (lm == null || lm.findLastVisibleItemPosition() >= adapter.getItemCount() - 3) {
                              rv.scrollToPosition(adapter.getItemCount() - 1);
                          } else {
                              int pending = adapter.getItemCount() - 1 - lm.findLastVisibleItemPosition();
                              fabBadge.setVisibility(View.VISIBLE);
                              fabBadge.setText(String.valueOf(pending));
                          }
                          markDeliveredAndSeen(m);
                          maybeFetchLinkPreview(m);
                      }
                      @Override public void onChildChanged(@NonNull DataSnapshot s, String prev) {
                          Message m = parse(s);
                          if (m == null) return;
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(m.id)) {
                                  if (Boolean.TRUE.equals(m.deletedForAll) || isHiddenForMe(m)) {
                                      messages.remove(i); adapter.notifyItemRemoved(i);
                                  } else {
                                      messages.set(i, m); adapter.notifyItemChanged(i);
                                  }
                                  break;
                              }
                      }
                      @Override public void onChildRemoved(@NonNull DataSnapshot s) {
                          String id = s.getKey();
                          for (int i = 0; i < messages.size(); i++)
                              if (messages.get(i).id.equals(id)) {
                                  messages.remove(i); adapter.notifyItemRemoved(i); break;
                              }
                      }
                      @Override public void onChildMoved(@NonNull DataSnapshot s, String prev) {}
                      @Override public void onCancelled(@NonNull DatabaseError e) {}
                  };
                  long anchor = oldestTimestamp == Long.MAX_VALUE ? 0 : oldestTimestamp;
                  msgRef.orderByChild("timestamp").startAfter(anchor)
                      .addChildEventListener(msgsListener);
              }
              private void computeUnreadDivider() {
                  firstUnreadIndex = -1;
                  for (int i = 0; i < messages.size(); i++) {
                      Message m = messages.get(i);
                      if (m.timestamp != null && m.timestamp > lastReadAt
                          && (m.senderId == null || !m.senderId.equals(FirebaseUtils.myUid()))) {
                          firstUnreadIndex = i; break;
                      }
                  }
                  adapter.setFirstUnreadIndex(firstUnreadIndex);
              }
              private Message parse(DataSnapshot s) {
                  try {
                      Message m = s.getValue(Message.class);
                      if (m != null) {
                          m.id = s.getKey();
                          if (m.encrypted != null && chatAesKey != null) {
                              m.text = AesCrypto.decrypt(m.encrypted, chatAesKey);
                          }
                      }
                      return m;
                  } catch (Exception e) { return null; }
              }
              private boolean isExpired(Message m) {
                  return m.expiresAt != null && m.expiresAt > 0 && m.expiresAt < System.currentTimeMillis();
              }
              private boolean isHiddenForMe(Message m) {
                  return PrefsManager.isHiddenForMe(m.id);
              }
              private void markDeliveredAndSeen(Message m) {
                  if (m.senderId == null || m.senderId.equals(FirebaseUtils.myUid())) return;
                  String me = FirebaseUtils.myUid();
                  msgRef.child(m.id).child("deliveredTo").child(me).setValue(System.currentTimeMillis());
                  if (PrefsManager.readReceiptsEnabled()) {
                      msgRef.child(m.id).child("seenBy").child(me).setValue(System.currentTimeMillis());
                      msgRef.child(m.id).child("status").setValue("seen");
                  } else {
                      msgRef.child(m.id).child("status").setValue("delivered");
                  }
                  if (Boolean.TRUE.equals(m.viewOnce)) {
                      msgRef.child(m.id).child("viewed").setValue(true);
                      msgRef.child(m.id).child("viewedBy").child(me).setValue(System.currentTimeMillis());
                  }
              }
              // ================= LINK PREVIEW =================
              private void maybeFetchLinkPreview(Message m) {
                  if (!"text".equals(m.type) || m.text == null || m.linkUrl != null) return;
                  String url = LinkPreviewHelper.firstUrl(m.text);
                  if (url == null) return;
                  LinkPreviewHelper.fetch(url, lp -> {
                      if (lp == null || lp.title == null) return;
                      Map<String, Object> u = new HashMap<>();
                      u.put("linkUrl", lp.url); u.put("linkTitle", lp.title);
                      u.put("linkDesc", lp.description); u.put("linkImage", lp.image);
                      msgRef.child(m.id).updateChildren(u);
                  });
              }
              // ================= SEND =================
              private void sendText() {
                  String text = etMessage.getText().toString().trim();
                  if (text.isEmpty() || iBlockedThem || theyBlockedMe) return;
                  if (editing != null) { applyEdit(editing, text); return; }
                  Message m = newMessageBase("text"); m.text = text;
                  pushMessage(m);
                  etMessage.setText("");
                  PresenceManager.setTyping(chatKey, false);
              }
              private Message newMessageBase(String type) {
                  Message m = new Message();
                  m.senderId = FirebaseUtils.myUid();
                  m.senderName = "Me";
                  m.type = type;
                  m.timestamp = System.currentTimeMillis();
                  m.status = "sending";
                  m.keyVersion = chatKeyVersion;
                  long disappear = PrefsManager.disappearFor(chatKey);
                  if (disappear > 0) m.expiresAt = m.timestamp + disappear;
                  if (replyTo != null) {
                      m.replyToId = replyTo.id;
                      m.replyToName = replyTo.senderName;
                      m.replyToText = replyTo.text != null ? replyTo.text : "[" + replyTo.type + "]";
                  }
                  return m;
              }
              private void pushMessage(Message m) {
                  String plainPreview = m.text != null ? m.text : "[" + m.type + "]";
                  if (m.text != null && chatAesKey != null) {
                      m.encrypted = AesCrypto.encrypt(m.text, chatAesKey);
                      m.text = null;
                  }
                  String id = msgRef.push().getKey();
                  m.id = id;
                  m.status = "sent";
                  msgRef.child(id).setValue(m).addOnFailureListener(e -> {
                      // Queue for retry
                      try {
                          JSONObject j = new JSONObject();
                          j.put("senderId", m.senderId); j.put("senderName", m.senderName);
                          j.put("type", m.type); j.put("timestamp", m.timestamp);
                          j.put("status", "failed");
                          if (m.encrypted != null) j.put("encrypted", m.encrypted);
                          if (m.text != null) j.put("text", m.text);
                          if (m.mediaUrl != null) j.put("mediaUrl", m.mediaUrl);
                          MessageOutbox.enqueue("chats/" + chatKey + "/messages", j);
                      } catch (Exception ignored) {}
                  });
                  String preview = m.encrypted != null ? "🔒 " + plainPreview : plainPreview;
                  Map<String, Object> meta = new HashMap<>();
                  meta.put("lastMessage", preview); meta.put("lastMessageAt", m.timestamp);
                  FirebaseUtils.chats().child(chatKey).child("_meta").updateChildren(meta);
                  Map<String, Object> myEntry = new HashMap<>();
                  myEntry.put("partnerUid", otherUid); myEntry.put("partnerName", otherName);
                  myEntry.put("partnerPhoto", otherPhoto);
                  myEntry.put("lastMessage", preview); myEntry.put("lastMessageAt", m.timestamp);
                  FirebaseUtils.users().child(FirebaseUtils.myUid()).child("chats").child(otherUid).updateChildren(myEntry);
                  Map<String, Object> theirEntry = new HashMap<>();
                  theirEntry.put("partnerUid", FirebaseUtils.myUid());
                  theirEntry.put("partnerName", "");
                  theirEntry.put("partnerPhoto", "");
                  theirEntry.put("lastMessage", preview); theirEntry.put("lastMessageAt", m.timestamp);
                  theirEntry.put("unread", ServerValue.increment(1));
                  FirebaseUtils.users().child(otherUid).child("chats").child(FirebaseUtils.myUid()).updateChildren(theirEntry);
                  try {
                      JSONObject body = new JSONObject();
                      body.put("toUid", otherUid); body.put("fromUid", FirebaseUtils.myUid());
                      body.put("title", otherName); body.put("body", preview); body.put("type", "message");
                      PushNotify.send("/notify/message", body);
                  } catch (Exception ignored) {}
                  PrefsManager.setDraft(chatKey, null);
                  replyTo = null; llReplyPreview.setVisibility(View.GONE);
                  nextIsViewOnce = false;
              }
              // ================= ATTACHMENTS =================
              private static final int RC_GALLERY = 101, RC_VIDEO = 102, RC_AUDIO = 103,
                                       RC_FILE = 104, RC_CAMERA = 105, RC_STICKER = 106;
              private void showAttachSheet() {
                  BottomSheetDialog bsd = new BottomSheetDialog(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.bottom_sheet_attach, null);
                  bsd.setContentView(v);
                  v.findViewById(R.id.opt_gallery).setOnClickListener(x -> { bsd.dismiss(); pick("image/*", RC_GALLERY); });
                  v.findViewById(R.id.opt_video).setOnClickListener(x -> { bsd.dismiss(); pick("video/*", RC_VIDEO); });
                  v.findViewById(R.id.opt_audio).setOnClickListener(x -> { bsd.dismiss(); pick("audio/*", RC_AUDIO); });
                  v.findViewById(R.id.opt_file).setOnClickListener(x -> { bsd.dismiss(); pick("*/*", RC_FILE); });
                  v.findViewById(R.id.opt_location).setOnClickListener(x -> { bsd.dismiss();
                      startActivityForResult(new Intent(this, LocationShareActivity.class), 200); });
                  v.findViewById(R.id.opt_contact).setOnClickListener(x -> { bsd.dismiss();
                      startActivityForResult(new Intent(this, ContactsPickerActivity.class), 201); });
                  v.findViewById(R.id.opt_view_once).setOnClickListener(x -> { bsd.dismiss();
                      nextIsViewOnce = true;
                      Toast.makeText(this, "Next image will be view-once", Toast.LENGTH_SHORT).show();
                      pick("image/*", RC_GALLERY); });
                  View opSticker = v.findViewById(R.id.opt_sticker);
                  if (opSticker != null) opSticker.setOnClickListener(x -> { bsd.dismiss();
                      startActivityForResult(new Intent(this, StickerPickerActivity.class), RC_STICKER); });
                  View opSched = v.findViewById(R.id.opt_schedule);
                  if (opSched != null) opSched.setOnClickListener(x -> { bsd.dismiss(); showScheduleDialog(); });
