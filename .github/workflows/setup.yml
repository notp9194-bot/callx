          cat > app/src/main/res/layout/activity_auth.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:fillViewport="true" android:background="@color/bg">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:padding="24dp" android:gravity="center">
                  <ImageView android:layout_width="100dp" android:layout_height="100dp"
                      android:src="@drawable/ic_launcher_fg" android:layout_marginTop="40dp"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="CallX" android:textSize="34sp" android:textStyle="bold"
                      android:textColor="@color/text_primary" android:layout_marginTop="12dp"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="Chat • Call • Status • Groups"
                      android:textColor="@color/text_secondary" android:layout_marginBottom="32dp"/>
                  <com.google.android.material.textfield.TextInputLayout
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:hint="Display name" android:layout_marginTop="8dp"
                      app:boxBackgroundMode="outline">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_name"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.textfield.TextInputLayout
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:hint="Email" android:layout_marginTop="8dp"
                      app:boxBackgroundMode="outline">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_email"
                          android:inputType="textEmailAddress"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.textfield.TextInputLayout
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:hint="Password" android:layout_marginTop="8dp"
                      app:boxBackgroundMode="outline" app:passwordToggleEnabled="true">
                      <com.google.android.material.textfield.TextInputEditText
                          android:id="@+id/et_password"
                          android:inputType="textPassword"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </com.google.android.material.textfield.TextInputLayout>
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btn_signup"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="Create account" android:layout_marginTop="20dp"/>
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btn_login" style="?attr/materialButtonOutlinedStyle"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="I already have an account" android:layout_marginTop="8dp"/>
                  <ProgressBar android:id="@+id/progress" android:visibility="gone"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"/>
              </LinearLayout>
          </ScrollView>
          ENDOFFILE

