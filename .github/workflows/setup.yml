          # ============================================================
          # SERVER — Express helper updates (link preview, scheduled cron,
          # broadcast endpoint). Adds new endpoints; keeps existing ones.
          # ============================================================
          cat > server/server.js << 'ENDOFFILE'
          /**
           * CallX backend helper
           *  POST /cloudinary/sign  -> { signature, timestamp, apiKey, cloud, folder }
           *  POST /notify/message   -> sends FCM data push (chat message)
           *  POST /notify/group     -> sends FCM data push (group message)
           *  POST /notify/call      -> sends FCM data push (incoming call)
           *  POST /notify/status    -> sends FCM data push (status)
           *  GET  /linkpreview?u=   -> { title, desc, image }
           *  POST /broadcast/send   -> fan-out a message to many recipients
           *  GET  /scheduled/process -> drain due scheduled messages (call from cron)
           */
          const express = require('express');
          const bodyParser = require('body-parser');
          const cors = require('cors');
          const fetch = require('node-fetch');
          const cloudinary = require('cloudinary').v2;
          const app = express();
          app.use(cors()); app.use(bodyParser.json({ limit: '5mb' }));
          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD,
            api_key:    process.env.CLOUDINARY_KEY,
            api_secret: process.env.CLOUDINARY_SECRET
          });
          app.get('/', (_, res) => res.send('CallX server alive'));
          app.post('/cloudinary/sign', (req, res) => {
            const folder = req.body.folder || 'callx';
            const timestamp = Math.floor(Date.now() / 1000);
            const signature = cloudinary.utils.api_sign_request(
              { folder, timestamp }, process.env.CLOUDINARY_SECRET);
            res.json({
              signature, timestamp,
              apiKey: process.env.CLOUDINARY_KEY,
              cloudName: process.env.CLOUDINARY_CLOUD,
              cloud: process.env.CLOUDINARY_CLOUD,
              folder
            });
          });
          async function sendFcm(toUid, data) {
            const dbUrl = process.env.FIREBASE_DB_URL;
            if (!dbUrl) throw new Error('FIREBASE_DB_URL missing');
            const r = await fetch(`${dbUrl}/users/${toUid}/fcmToken.json`);
            const token = await r.json();
            if (!token) return { ok: false, reason: 'no token' };
            const payload = { to: token, data, priority: 'high' };
            const fr = await fetch('https://fcm.googleapis.com/fcm/send', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'key=' + process.env.FCM_SERVER_KEY
              },
              body: JSON.stringify(payload)
            });
            return await fr.json();
          }
          app.post('/notify/message', async (req, res) => {
            try { res.json(await sendFcm(req.body.toUid, {
              type: 'message', title: req.body.title || '', body: req.body.body || '',
              fromUid: req.body.fromUid || ''
            })); } catch (e) { res.status(500).json({ error: e.message }); }
          });
          app.post('/notify/group', async (req, res) => {
            try {
              const dbUrl = process.env.FIREBASE_DB_URL;
              const r = await fetch(`${dbUrl}/groups/${req.body.gid}/members.json`);
              const members = await r.json() || {};
              const out = {};
              for (const uid of Object.keys(members)) {
                if (uid === req.body.fromUid) continue;
                out[uid] = await sendFcm(uid, {
                  type: 'group', title: req.body.title || '', body: req.body.body || '', gid: req.body.gid
                });
              }
              res.json(out);
            } catch (e) { res.status(500).json({ error: e.message }); }
          });
          app.post('/notify/call', async (req, res) => {
            try { res.json(await sendFcm(req.body.toUid, {
              type: 'call', name: req.body.name || '', fromUid: req.body.fromUid || '',
              callId: req.body.callId || '', video: String(req.body.video === true)
            })); } catch (e) { res.status(500).json({ error: e.message }); }
          });
          app.post('/notify/status', async (req, res) => {
            try { res.json(await sendFcm(req.body.toUid, {
              type: 'status', title: req.body.title || '', body: req.body.body || ''
            })); } catch (e) { res.status(500).json({ error: e.message }); }
          });

          // === NEW: link preview (lightweight og:meta scrape) ===
          app.get('/linkpreview', async (req, res) => {
            try {
              const u = req.query.u; if (!u) return res.status(400).json({});
              const r = await fetch(u, {
                headers: { 'User-Agent': 'Mozilla/5.0 (CallX link preview)' },
                timeout: 6000
              });
              const html = (await r.text()).slice(0, 200000);
              const get = (re) => { const m = html.match(re); return m ? m[1] : ''; };
              const title =
                get(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i) ||
                get(/<meta[^>]+name=["']twitter:title["'][^>]+content=["']([^"']+)["']/i) ||
                get(/<title[^>]*>([^<]+)<\/title>/i);
              const desc =
                get(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i) ||
                get(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i) ||
                get(/<meta[^>]+name=["']twitter:description["'][^>]+content=["']([^"']+)["']/i);
              const image =
                get(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i) ||
                get(/<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i);
              res.json({ url: u, title, desc, image });
            } catch (e) { res.status(500).json({ error: e.message }); }
          });

          // === NEW: broadcast fan-out (server-side push only;
          // chat persistence is done client-side) ===
          app.post('/broadcast/send', async (req, res) => {
            try {
              const recipients = req.body.recipients || [];
              const out = {};
              for (const uid of recipients) {
                out[uid] = await sendFcm(uid, {
                  type: 'message', title: req.body.title || 'Broadcast',
                  body: req.body.body || '', fromUid: req.body.fromUid || ''
                });
              }
              res.json(out);
            } catch (e) { res.status(500).json({ error: e.message }); }
          });

          // === NEW: process due scheduled messages.
          // Designed to be hit by a cron (Render cron, GitHub Actions, etc.)
          // every 1-5 minutes. Reads /scheduled/{uid}/* and dispatches due ones
          // to /chats or /groups. ===
          app.get('/scheduled/process', async (req, res) => {
            try {
              const dbUrl = process.env.FIREBASE_DB_URL;
              const all = await (await fetch(`${dbUrl}/scheduled.json`)).json() || {};
              const now = Date.now();
              let count = 0;
              for (const uid of Object.keys(all)) {
                const entries = all[uid] || {};
                for (const sid of Object.keys(entries)) {
                  const it = entries[sid];
                  if (!it || !it.sendAt || it.sendAt > now) continue;
                  const dest = it.groupId
                    ? `${dbUrl}/groups/${it.groupId}/messages.json`
                    : `${dbUrl}/chats/${it.chatKey}/messages.json`;
                  const msg = { ...it, status: 'sent', timestamp: now };
                  delete msg.sendAt; delete msg.chatKey; delete msg.groupId;
                  const r = await fetch(dest, { method: 'POST', body: JSON.stringify(msg),
                    headers: { 'Content-Type': 'application/json' } });
                  if (r.ok) {
                    await fetch(`${dbUrl}/scheduled/${uid}/${sid}.json`, { method: 'DELETE' });
                    count++;
                  }
                }
              }
              res.json({ processed: count });
            } catch (e) { res.status(500).json({ error: e.message }); }
          });
          const PORT = process.env.PORT || 3000;
          app.listen(PORT, () => console.log('CallX server on ' + PORT));
          ENDOFFILE

