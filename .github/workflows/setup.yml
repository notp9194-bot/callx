              private void insertMention(MentionPickerAdapter.Item it) {
                  // unused in 1:1
              }
              // ================= SCHEDULE =================
              private void showScheduleDialog() {
                  String text = etMessage.getText().toString().trim();
                  if (text.isEmpty()) {
                      Toast.makeText(this, "Type a message first", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  final long[] choices = {
                      System.currentTimeMillis() + 5L * 60_000L,
                      System.currentTimeMillis() + 60L * 60_000L,
                      System.currentTimeMillis() + 24L * 3600_000L,
                      System.currentTimeMillis() + 7L * 24L * 3600_000L
                  };
                  String[] labels = {"In 5 minutes", "In 1 hour", "Tomorrow", "Next week"};
                  new AlertDialog.Builder(this).setTitle("Schedule message")
                      .setItems(labels, (d, w) -> scheduleMessage(text, choices[w]))
                      .show();
              }
              private void scheduleMessage(String text, long sendAt) {
                  String me = FirebaseUtils.myUid();
                  Map<String, Object> sm = new HashMap<>();
                  sm.put("chatKey", chatKey); sm.put("senderId", me); sm.put("senderName", "Me");
                  sm.put("type", "text");
                  sm.put("text", chatAesKey != null ? null : text);
                  sm.put("encrypted", chatAesKey != null ? AesCrypto.encrypt(text, chatAesKey) : null);
                  sm.put("sendAt", sendAt); sm.put("status", "scheduled");
                  String key = FirebaseUtils.scheduled().child(me).push().getKey();
                  FirebaseUtils.scheduled().child(me).child(key).setValue(sm);
                  Set<String> ids = PrefsManager.getScheduledIds();
                  ids.add(key); PrefsManager.setScheduledIds(ids);
                  etMessage.setText("");
                  Toast.makeText(this, "Scheduled", Toast.LENGTH_SHORT).show();
                  com.callx.app.workers.ScheduledMessageWorker.enqueue(this);
              }
