          package com.callx.app.utils;
          import android.graphics.Color;
          import android.text.Spannable;
          import android.text.SpannableStringBuilder;
          import android.text.style.ForegroundColorSpan;
          import android.text.style.StyleSpan;
          import android.graphics.Typeface;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class MentionHelper {
              public static final Pattern MENTION = Pattern.compile("@([A-Za-z0-9_]+)");
              public static CharSequence highlight(String text) {
                  if (text == null) return "";
                  SpannableStringBuilder sb = new SpannableStringBuilder(text);
                  Matcher m = MENTION.matcher(text);
                  while (m.find()) {
                      sb.setSpan(new ForegroundColorSpan(Color.parseColor("#0A7CFF")),
                          m.start(), m.end(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                      sb.setSpan(new StyleSpan(Typeface.BOLD),
                          m.start(), m.end(), Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
                  return sb;
              }
              public static List<String> extract(String text) {
                  List<String> r = new ArrayList<>();
                  if (text == null) return r;
                  Matcher m = MENTION.matcher(text);
                  while (m.find()) r.add(m.group(1));
                  return r;
              }
          }
          ENDOFFILE

