          package com.callx.app.utils;
          import android.content.Context;
          import android.media.MediaRecorder;
          import java.io.File;
          public class AudioRecorderHelper {
              private MediaRecorder rec;
              private File outFile;
              public File start(Context ctx) throws Exception {
                  outFile = new File(ctx.getCacheDir(),
                      "rec_" + System.currentTimeMillis() + ".m4a");
                  rec = new MediaRecorder();
                  rec.setAudioSource(MediaRecorder.AudioSource.MIC);
                  rec.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                  rec.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                  rec.setAudioSamplingRate(44100);
                  rec.setAudioEncodingBitRate(96000);
                  rec.setOutputFile(outFile.getAbsolutePath());
                  rec.prepare();
                  rec.start();
                  return outFile;
              }
              public File stop() {
                  try {
                      if (rec != null) { rec.stop(); rec.release(); rec = null; }
                  } catch (Exception ignored) {}
                  return outFile;
              }
              public void cancel() {
                  try { if (rec != null) { rec.stop(); rec.release(); rec = null; } }
                  catch (Exception ignored) {}
                  if (outFile != null && outFile.exists()) outFile.delete();
                  outFile = null;
              }
          }
