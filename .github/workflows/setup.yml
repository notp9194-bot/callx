name: Setup CallX v4 (Production - Full Featured + Upgrades)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Create Full Project Structure
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          # =====================================================================
          # CallX v3 — PRODUCTION grade chat / call / group / status app
          #
          # NEW vs v2:
          #  - REAL WebRTC (PeerConnection + SDP/ICE via Firebase signaling)
          #  - Mic / Camera / Speaker actually toggle audio/video tracks
          #  - Camera switch (front/back) in video call
          #  - Foreground call service (call survives app kill)
          #  - Read receipts (sent / delivered / seen) with double tick
          #  - Typing indicator
          #  - Online / Last seen presence (Firebase onDisconnect)
          #  - Reply / quote, Edit, Delete (for me / for everyone)
          #  - Forward message, Reactions (emoji), Star, Search in chat
          #  - Mute chat, Block / Unblock user, Archive chat
          #  - Disappearing messages (per-chat timer)
          #  - View once media
          #  - Group admin (members, add/remove, edit name/icon, exit, invite link)
          #  - Status views list + Status reply
          #  - Audio waveform + functional seekbar, Video thumbnail generation
          #  - App lock (Biometric / PIN)
          #  - Chat wallpaper picker
          #  - Live location share, Contact share
          #  - @mention in groups
          #  - Per-chat AES key for basic E2E layer
          # =====================================================================

          # === DIRECTORIES ===
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/callx/app/activities
          mkdir -p app/src/main/java/com/callx/app/fragments
          mkdir -p app/src/main/java/com/callx/app/adapters
          mkdir -p app/src/main/java/com/callx/app/models
          mkdir -p app/src/main/java/com/callx/app/utils
          mkdir -p app/src/main/java/com/callx/app/services
          mkdir -p app/src/main/java/com/callx/app/webrtc
          mkdir -p app/src/main/java/com/callx/app/crypto
          mkdir -p server
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # ============================================================
          # google-services.json
          # ============================================================
          cat > app/google-services.json << 'ENDOFFILE'
          {
            "project_info": {
              "project_number": "286173223634",
              "project_id": "sathix-97a76",
              "storage_bucket": "sathix-97a76.firebasestorage.app",
              "firebase_url": "https://sathix-97a76-default-rtdb.asia-southeast1.firebasedatabase.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:286173223634:android:77c66dd61ac22411b16b0b",
                  "android_client_info": { "package_name": "com.callx.app" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyAl-UmdtYFQo5qX6QyiZnTVmC6AS2bwqR4" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          ENDOFFILE

          # ============================================================
          # Gradle setup
          # ============================================================
          cat > settings.gradle << 'ENDOFFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://repo.getstream.io/artifactory/libs-release/" }
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "CallX"
          include ':app'
          ENDOFFILE

          cat > build.gradle << 'ENDOFFILE'
          buildscript {
              dependencies { classpath 'com.google.gms:google-services:4.4.0' }
          }
          plugins { id 'com.android.application' version '8.2.2' apply false }
          ENDOFFILE

          cat > gradle.properties << 'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          ENDOFFILE

          cat > gradle/wrapper/gradle-wrapper.properties << 'ENDOFFILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          ENDOFFILE

          # ============================================================
          # app/build.gradle
          # ============================================================
          cat > app/build.gradle << 'ENDOFFILE'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.callx.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.callx.app"
                  minSdk 23
                  targetSdk 34
                  versionCode __VERSION_CODE__
                  versionName "__VERSION_NAME__"
                  vectorDrawables.useSupportLibrary = true
              }
              buildTypes {
                  debug { minifyEnabled false; debuggable true }
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildFeatures { viewBinding true }
              packagingOptions {
                  resources {
                      excludes += [
                          'META-INF/AL2.0','META-INF/LGPL2.1','META-INF/DEPENDENCIES',
                          'META-INF/LICENSE*','META-INF/NOTICE*'
                      ]
                  }
              }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.activity:activity:1.8.2'
              implementation 'androidx.fragment:fragment:1.6.2'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'

              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-database'
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'com.google.firebase:firebase-storage'
              implementation 'com.google.firebase:firebase-dynamic-links'

              implementation 'io.getstream:stream-webrtc-android:1.1.2'
              implementation 'com.google.android.gms:play-services-location:21.1.0'
              implementation 'com.google.android.gms:play-services-maps:18.2.0'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
              implementation 'de.hdodenhof:circleimageview:3.1.0'
              implementation 'com.github.masoudss:WaveformSeekBar:3.1.2'
          }
          ENDOFFILE

          VCODE=$((200 + RUN_NUM))
          VNAME="3.0.${RUN_NUM}"
          sed -i "s/__VERSION_CODE__/${VCODE}/" app/build.gradle
          sed -i "s/__VERSION_NAME__/${VNAME}/" app/build.gradle
          echo "Build version: code=${VCODE} name=${VNAME}"

          # ============================================================
          # AndroidManifest.xml
          # ============================================================
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_PHONE_CALL"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_OWN_CALLS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>

              <application
                  android:name=".CallxApp"
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="false"
                  android:label="CallX"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.CallX"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true">

                  <activity android:name=".activities.SplashActivity"
                      android:exported="true"
                      android:theme="@style/Theme.CallX.Splash">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter android:autoVerify="false">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https" android:host="callx.app"/>
                          <data android:scheme="callx"/>
                      </intent-filter>
                  </activity>

                  <activity android:name=".activities.AuthActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.AppLockActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"/>
                  <activity android:name=".activities.MainActivity"      android:exported="false"/>
                  <activity android:name=".activities.ChatActivity"      android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.GroupChatActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.GroupInfoActivity" android:exported="false"/>
                  <activity android:name=".activities.NewGroupActivity"  android:exported="false"/>
                  <activity android:name=".activities.SearchActivity"    android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.SearchInChatActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity android:name=".activities.ForwardActivity"   android:exported="false"/>
                  <activity android:name=".activities.MediaViewerActivity" android:exported="false"
                      android:theme="@style/Theme.CallX.Black"/>
                  <activity android:name=".activities.StatusViewerActivity" android:exported="false"
                      android:theme="@style/Theme.CallX.Black"/>
                  <activity android:name=".activities.NewStatusActivity" android:exported="false"/>
                  <activity android:name=".activities.StatusViewsActivity" android:exported="false"/>
                  <activity android:name=".activities.ProfileActivity"   android:exported="false"/>
                  <activity android:name=".activities.ChatSettingsActivity" android:exported="false"/>
                  <activity android:name=".activities.WallpaperPickerActivity" android:exported="false"/>
                  <activity android:name=".activities.BlockedListActivity" android:exported="false"/>
                  <activity android:name=".activities.ContactsPickerActivity" android:exported="false"/>
                  <activity android:name=".activities.LocationShareActivity" android:exported="false"/>
                  <activity android:name=".activities.StarredActivity" android:exported="false"/>
                  <activity android:name=".activities.PinSetupActivity" android:exported="false"/>
                  <activity android:name=".activities.ArchivedChatsActivity" android:exported="false"/>
                  <activity android:name=".activities.PollCreateActivity" android:exported="false"/>

                  <activity android:name=".activities.CallActivity"
                      android:exported="false"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleTask"/>
                  <activity android:name=".activities.IncomingCallActivity"
                      android:exported="false"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.CallX.Black"/>

                  <service
                      android:name=".services.CallxMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>
                  </service>
                  <service
                      android:name=".services.CallForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="phoneCall|microphone|camera"/>
                  <service
                      android:name=".services.PresenceService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
                  <service
                      android:name=".services.LocationShareService"
                      android:exported="false"
                      android:foregroundServiceType="location"/>

                  <receiver
                      android:name=".services.NotificationActionReceiver"
                      android:exported="false"/>
                  <receiver
                      android:name=".services.BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          ENDOFFILE

          # ============================================================
          # COLORS / STRINGS / THEMES
          # ============================================================
          cat > app/src/main/res/values/colors.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brand_primary">#0A7CFF</color>
              <color name="brand_primary_dark">#005FCC</color>
              <color name="brand_accent">#00D4AA</color>
              <color name="bg">#FFFFFF</color>
              <color name="bg_chat">#ECE5DD</color>
              <color name="surface">#F2F4F7</color>
              <color name="text_primary">#0F172A</color>
              <color name="text_secondary">#64748B</color>
              <color name="bubble_sent">#DCF8C6</color>
              <color name="bubble_received">#FFFFFF</color>
              <color name="online_green">#25D366</color>
              <color name="reject_red">#EF4444</color>
              <color name="accept_green">#22C55E</color>
              <color name="seen_blue">#34B7F1</color>
              <color name="reaction_bg">#F1F5F9</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="black_overlay">#80000000</color>
              <color name="divider">#E2E8F0</color>
          </resources>
          ENDOFFILE

          cat > app/src/main/res/values-night/colors.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brand_primary">#3B82F6</color>
              <color name="brand_primary_dark">#1E3A8A</color>
              <color name="brand_accent">#10B981</color>
              <color name="bg">#0B1220</color>
              <color name="bg_chat">#0E1622</color>
              <color name="surface">#1A2332</color>
              <color name="text_primary">#F1F5F9</color>
              <color name="text_secondary">#94A3B8</color>
              <color name="bubble_sent">#005C4B</color>
              <color name="bubble_received">#202C33</color>
              <color name="online_green">#25D366</color>
              <color name="reject_red">#F87171</color>
              <color name="accept_green">#34D399</color>
              <color name="seen_blue">#53BDEB</color>
              <color name="reaction_bg">#1F2937</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="black_overlay">#80000000</color>
              <color name="divider">#1F2937</color>
          </resources>
          ENDOFFILE

          cat > app/src/main/res/values/strings.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CallX</string>
              <string name="action_voice_call">Voice Call</string>
              <string name="action_video_call">Video Call</string>
              <string name="action_search">Search</string>
              <string name="action_mute">Mute</string>
              <string name="action_block">Block</string>
              <string name="action_unblock">Unblock</string>
              <string name="action_clear_chat">Clear chat</string>
              <string name="action_wallpaper">Chat wallpaper</string>
              <string name="action_disappearing">Disappearing messages</string>
              <string name="action_view_contact">View contact</string>
              <string name="action_archive">Archive chat</string>
              <string name="action_unarchive">Unarchive</string>
              <string name="typing">typing…</string>
              <string name="online">online</string>
              <string name="offline">offline</string>
          </resources>
          ENDOFFILE

          cat > app/src/main/res/values/themes.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.CallX" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/brand_primary</item>
                  <item name="colorPrimaryDark">@color/brand_primary_dark</item>
                  <item name="colorAccent">@color/brand_accent</item>
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/brand_primary_dark</item>
                  <item name="android:windowLightStatusBar" tools:targetApi="m">false</item>
              </style>
              <style name="Theme.CallX.Splash" parent="Theme.CallX">
                  <item name="android:windowBackground">@drawable/splash_bg</item>
              </style>
              <style name="Theme.CallX.Black" parent="Theme.CallX">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
              </style>
          </resources>
          ENDOFFILE

          # ============================================================
          # DRAWABLES (icons + backgrounds)
          # ============================================================
          cat > app/src/main/res/drawable/splash_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/brand_primary_dark"/>
              <item>
                  <bitmap android:src="@drawable/ic_launcher_fg" android:gravity="center"/>
              </item>
          </layer-list>
          ENDOFFILE

          cat > app/src/main/res/drawable/bubble_sent.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/bubble_sent"/>
              <corners android:topLeftRadius="14dp" android:topRightRadius="14dp"
                       android:bottomLeftRadius="14dp" android:bottomRightRadius="2dp"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/bubble_received.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/bubble_received"/>
              <corners android:topLeftRadius="14dp" android:topRightRadius="14dp"
                       android:bottomLeftRadius="2dp" android:bottomRightRadius="14dp"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/bubble_reply.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#33000000"/>
              <corners android:radius="6dp"/>
              <stroke android:width="2dp" android:color="@color/brand_accent"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/reaction_chip_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/reaction_bg"/>
              <corners android:radius="20dp"/>
              <stroke android:width="1dp" android:color="@color/divider"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/rounded_input_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/surface"/>
              <corners android:radius="24dp"/>
          </shape>
          ENDOFFILE

          for n in circle_primary circle_accept circle_reject circle_avatar_bg \
                   circle_status_seen circle_status_unseen bg_circle_white circle_speaker; do
            color="@color/brand_primary"
            case "$n" in
              circle_accept) color="@color/accept_green" ;;
              circle_reject) color="@color/reject_red" ;;
              circle_avatar_bg) color="@color/surface" ;;
              circle_status_seen) color="#9CA3AF" ;;
              circle_status_unseen) color="@color/brand_accent" ;;
              bg_circle_white) color="@color/white" ;;
              circle_speaker) color="@color/surface" ;;
            esac
            cat > "app/src/main/res/drawable/${n}.xml" << ENDOFFILE
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="${color}"/>
          </shape>
          ENDOFFILE
          done

          cat > app/src/main/res/drawable/gradient_brand.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="@color/brand_primary"
                        android:endColor="@color/brand_accent" android:angle="45"/>
          </shape>
          ENDOFFILE

          cat > app/src/main/res/drawable/card_rounded.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/surface"/>
              <corners android:radius="14dp"/>
