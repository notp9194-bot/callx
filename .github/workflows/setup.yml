              }
              private Message itemAt(int pos) {
                  if (firstUnreadIndex >= 0 && pos == firstUnreadIndex)
                      return data.get(0); // never used for divider
                  if (firstUnreadIndex >= 0 && pos > firstUnreadIndex) return data.get(pos - 1);
                  return data.get(pos);
