          package com.callx.app.utils;
          import androidx.annotation.NonNull;
          import com.google.firebase.database.*;
          import java.util.*;
          /** Resolves @username tokens to uids within a group. */
          public class MentionResolver {
              public interface Cb { void onResolved(List<String> uids); }
              public static void resolve(final List<String> usernames,
                                         final List<String> groupMemberUids,
                                         final Cb cb) {
                  if (usernames == null || usernames.isEmpty() || groupMemberUids == null) {
                      cb.onResolved(new ArrayList<>()); return;
                  }
                  final List<String> matched = new ArrayList<>();
                  final int[] left = { groupMemberUids.size() };
                  for (final String uid : groupMemberUids) {
                      FirebaseUtils.users().child(uid).child("name")
                          .addListenerForSingleValueEvent(new ValueEventListener() {
                              @Override public void onDataChange(@NonNull DataSnapshot d) {
                                  String name = d.getValue(String.class);
                                  if (name != null) {
                                      String token = name.replaceAll("\\s+", "").toLowerCase();
                                      for (String u : usernames) {
                                          if (token.startsWith(u.toLowerCase())) {
                                              matched.add(uid); break;
                                          }
                                      }
                                  }
                                  if (--left[0] == 0) cb.onResolved(matched);
                              }
                              @Override public void onCancelled(@NonNull DatabaseError e) {
                                  if (--left[0] == 0) cb.onResolved(matched);
                              }
                          });
                  }
              }
          }
          ENDOFFILE

