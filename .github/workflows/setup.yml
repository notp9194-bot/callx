          package com.callx.app.activities;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.R;
          import com.callx.app.models.User;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.android.material.button.MaterialButton;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.messaging.FirebaseMessaging;
          import java.util.HashMap;
          import java.util.Map;
          public class AuthActivity extends AppCompatActivity {
              EditText etName, etEmail, etPass;
              ProgressBar progress;
              FirebaseAuth auth = FirebaseAuth.getInstance();
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_auth);
                  etName = findViewById(R.id.et_name);
                  etEmail = findViewById(R.id.et_email);
                  etPass  = findViewById(R.id.et_password);
                  progress = findViewById(R.id.progress);
                  ((MaterialButton) findViewById(R.id.btn_signup)).setOnClickListener(v -> signup());
                  ((MaterialButton) findViewById(R.id.btn_login)).setOnClickListener(v -> login());
              }
              private void signup() {
                  String n = etName.getText().toString().trim();
                  String e = etEmail.getText().toString().trim();
                  String p = etPass.getText().toString().trim();
                  if (n.isEmpty() || e.isEmpty() || p.length() < 6) {
                      Toast.makeText(this, "Fill all fields (password 6+)", Toast.LENGTH_SHORT).show(); return;
                  }
                  progress.setVisibility(View.VISIBLE);
                  auth.createUserWithEmailAndPassword(e, p).addOnCompleteListener(t -> {
                      if (!t.isSuccessful()) { fail(t); return; }
                      String uid = auth.getUid();
                      User u = new User();
                      u.uid = uid; u.name = n; u.email = e;
                      u.callxId = "callx_" + (uid == null ? "" : uid.substring(0, Math.min(6, uid.length())));
                      u.online = true; u.lastSeen = System.currentTimeMillis();
                      u.privacyReadReceipts = true; u.privacyShowLastSeen = true;
                      Map<String, Object> map = new HashMap<>();
                      map.put("uid", u.uid); map.put("name", u.name); map.put("email", u.email);
                      map.put("about", "Available"); map.put("callxId", u.callxId);
                      map.put("online", true); map.put("lastSeen", u.lastSeen);
                      map.put("privacyReadReceipts", true);
                      map.put("privacyShowLastSeen", true);
                      FirebaseUtils.users().child(uid).setValue(map);
                      saveTokenAndGo();
                  });
              }
              private void login() {
                  String e = etEmail.getText().toString().trim();
                  String p = etPass.getText().toString().trim();
                  if (e.isEmpty() || p.isEmpty()) { Toast.makeText(this, "Email + password", Toast.LENGTH_SHORT).show(); return; }
                  progress.setVisibility(View.VISIBLE);
                  auth.signInWithEmailAndPassword(e, p).addOnCompleteListener(t -> {
                      if (!t.isSuccessful()) { fail(t); return; }
                      saveTokenAndGo();
                  });
              }
              private void fail(com.google.android.gms.tasks.Task<?> t) {
                  progress.setVisibility(View.GONE);
                  String m = t.getException() == null ? "auth failed" : t.getException().getMessage();
                  Toast.makeText(this, m, Toast.LENGTH_LONG).show();
              }
              private void saveTokenAndGo() {
                  FirebaseMessaging.getInstance().getToken().addOnSuccessListener(tok -> {
                      String uid = auth.getUid();
                      if (uid != null && tok != null)
                          FirebaseUtils.users().child(uid).child("fcmToken").setValue(tok);
                      startActivity(new Intent(this, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_NEW_TASK));
                      finish();
                  });
              }
          }
          ENDOFFILE

