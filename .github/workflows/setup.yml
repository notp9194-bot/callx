          package com.callx.app.activities;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import com.callx.app.utils.FirebaseUtils;
          import com.google.firebase.database.DatabaseReference;
          import java.util.*;
          /** Lightweight in-chat poll creator. Persists to messages/<chatKey>/poll_<id>. */
          public class PollCreateActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  String chatKey = getIntent().getStringExtra("chatKey");
                  if (chatKey == null) { finish(); return; }
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 80, 40, 40);
                  TextView title = new TextView(this); title.setText("Create poll"); title.setTextSize(20);
                  EditText q = new EditText(this); q.setHint("Question");
                  final List<EditText> opts = new ArrayList<>();
                  for (int i = 0; i < 4; i++) {
                      EditText o = new EditText(this); o.setHint("Option " + (i + 1));
                      opts.add(o);
                  }
                  Button save = new Button(this); save.setText("Send poll");
                  root.addView(title); root.addView(q);
                  for (EditText o : opts) root.addView(o);
                  root.addView(save);
                  setContentView(root);
                  save.setOnClickListener(v -> {
                      String me = FirebaseUtils.myUid();
                      if (me == null || q.getText().toString().trim().isEmpty()) {
                          Toast.makeText(this, "Question required", Toast.LENGTH_SHORT).show(); return;
                      }
                      DatabaseReference ref = FirebaseUtils.chats().child(chatKey).push();
                      Map<String, Object> m = new HashMap<>();
                      m.put("id", ref.getKey()); m.put("type", "poll");
                      m.put("text", q.getText().toString());
                      m.put("senderId", me); m.put("timestamp", System.currentTimeMillis());
                      List<String> os = new ArrayList<>();
                      for (EditText o : opts) {
                          String t = o.getText().toString().trim();
                          if (!t.isEmpty()) os.add(t);
                      }
                      if (os.size() < 2) {
                          Toast.makeText(this, "At least 2 options", Toast.LENGTH_SHORT).show(); return;
                      }
                      m.put("pollOptions", os);
                      m.put("pollVotes", new HashMap<String, String>());
                      ref.setValue(m);
                      finish();
                  });
              }
          }
          ENDOFFILE

