          package com.callx.app.fragments;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.callx.app.R;
          import com.callx.app.activities.ArchivedChatsActivity;
          import com.callx.app.activities.ChatActivity;
          import com.callx.app.activities.SearchActivity;
          import com.callx.app.adapters.ChatListAdapter;
          import com.callx.app.models.ChatMeta;
          import com.callx.app.utils.FirebaseUtils;
          import com.callx.app.utils.PrefsManager;
          import com.google.firebase.database.*;
          import java.util.*;
          public class ChatsFragment extends Fragment {
              private List<ChatMeta> data = new ArrayList<>();
              private ChatListAdapter adapter;
              private TextView tvArchivedHeader;
              private int archivedCount = 0;
              @Override public View onCreateView(@NonNull LayoutInflater i, ViewGroup p, Bundle s) {
                  View root = i.inflate(R.layout.fragment_chats, p, false);
                  RecyclerView rv = root.findViewById(R.id.rv);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  adapter = new ChatListAdapter(getContext(), data, m -> {
                      Intent it = new Intent(getActivity(), ChatActivity.class);
                      it.putExtra(ChatActivity.EXTRA_UID, m.partnerUid);
                      it.putExtra(ChatActivity.EXTRA_NAME, m.partnerName);
                      it.putExtra(ChatActivity.EXTRA_PHOTO, m.partnerPhoto);
                      startActivity(it);
                  });
                  rv.setAdapter(adapter);
                  root.findViewById(R.id.fab_new_chat).setOnClickListener(v ->
                      startActivity(new Intent(getActivity(), SearchActivity.class)));
                  tvArchivedHeader = root.findViewById(R.id.tv_archived_header);
                  if (tvArchivedHeader != null) {
                      tvArchivedHeader.setOnClickListener(v ->
                          startActivity(new Intent(getActivity(), ArchivedChatsActivity.class)));
                  }
                  load();
                  return root;
              }
              private void load() {
                  String me = FirebaseUtils.myUid(); if (me == null) return;
                  FirebaseUtils.users().child(me).child("chats")
                      .addValueEventListener(new ValueEventListener() {
                          @Override public void onDataChange(DataSnapshot d) {
                              data.clear();
                              archivedCount = 0;
                              for (DataSnapshot c : d.getChildren()) {
                                  ChatMeta cm = c.getValue(ChatMeta.class);
                                  if (cm == null) continue;
                                  if (cm.partnerUid == null) cm.partnerUid = c.getKey();
                                  String key = (me.compareTo(cm.partnerUid) < 0)
                                      ? me + "_" + cm.partnerUid : cm.partnerUid + "_" + me;
                                  // Skip archived in main list
                                  if (PrefsManager.isArchived(key) || Boolean.TRUE.equals(cm.archived)) {
                                      archivedCount++; continue;
                                  }
                                  cm.muted = PrefsManager.isMuted(key);
                                  data.add(cm);
                              }
                              Collections.sort(data, (a, b) -> Long.compare(
                                  b.lastMessageAt == null ? 0 : b.lastMessageAt,
                                  a.lastMessageAt == null ? 0 : a.lastMessageAt));
                              if (tvArchivedHeader != null) {
                                  tvArchivedHeader.setVisibility(archivedCount > 0 ? View.VISIBLE : View.GONE);
                                  tvArchivedHeader.setText("📦 Archived (" + archivedCount + ")");
                              }
                              adapter.notifyDataSetChanged();
                          }
                          @Override public void onCancelled(DatabaseError e) {}
                      });
              }
          }
          ENDOFFILE

